<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Word Wheel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800&display=swap">
<style>
:root{--navy:#24315e;--ink:#24315e;--bg1:#fff4d6;--bg2:#ffe0ec;--gold:#f6c23e;--green:#36b94a;--greenD:#1f8a32;--blue:#3a7bd5;--blueD:#25559c;
  --head:"Fredoka","Nunito",system-ui,sans-serif;--body:"Nunito",system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--body);color:var(--ink);min-height:100vh;
  background:radial-gradient(circle at 15% 15%,#fff 0,transparent 35%),radial-gradient(circle at 85% 85%,#d9f2ff 0,transparent 40%),linear-gradient(135deg,var(--bg1),var(--bg2))}
.wrap{max-width:1180px;margin:0 auto;padding:16px 14px 26px;display:flex;flex-direction:column;gap:16px}
h1{margin:0;align-self:center;font-family:var(--head);font-weight:700;font-size:clamp(28px,5vw,50px);color:#fff;background:linear-gradient(#5b7fe0,#3a55b8);
  padding:8px 34px;border-radius:24px;box-shadow:0 7px 0 #27397f;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.main{display:grid;grid-template-columns:minmax(300px,1.1fr) 1fr;gap:22px;align-items:center}
@media (max-width:820px){.main{grid-template-columns:1fr}}
.wheelBox{position:relative;width:min(100%,560px);aspect-ratio:1;justify-self:center}
.pointer{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:22px solid transparent;border-right:22px solid transparent;border-top:44px solid #e2463a;filter:drop-shadow(0 4px 0 rgba(0,0,0,.25));z-index:2}
#wheel{width:100%;height:100%;display:block;filter:drop-shadow(0 10px 0 rgba(36,49,94,.25));transition:transform 4.2s cubic-bezier(.12,.75,.15,1)}
.hub{position:absolute;inset:0;margin:auto;width:22%;height:22%;border-radius:50%;background:#fff;border:6px solid var(--navy);display:grid;place-items:center;
  font-family:var(--head);font-weight:700;font-size:clamp(16px,2.6vw,24px);color:var(--navy);cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.2);z-index:3;user-select:none}
.hub:active{transform:translateY(3px)}
.panel{background:#fff;border-radius:26px;box-shadow:0 8px 0 rgba(36,49,94,.18);padding:20px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center;min-height:360px;justify-content:center}
.pic{font-size:clamp(90px,14vw,150px);line-height:1}
.word{font-family:var(--head);font-weight:700;font-size:clamp(30px,5vw,52px);letter-spacing:.06em;min-height:1.3em;color:var(--navy)}
.letters{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.lt{width:clamp(34px,5vw,48px);height:clamp(42px,6vw,56px);border-radius:10px;background:#eef2ff;border:3px solid #c9d3fb;display:grid;place-items:center;font-family:var(--head);font-weight:700;font-size:clamp(22px,3.4vw,32px);color:var(--navy)}
.lt.gap{background:none;border-color:transparent;width:14px}
.lt.on{background:#fff6d6;border-color:var(--gold)}
.hint{font-weight:800;color:#6a7398;font-size:clamp(14px,1.8vw,17px)}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{font-family:var(--head);font-weight:600;font-size:clamp(15px,1.9vw,19px);border:none;border-radius:16px;padding:11px 20px;cursor:pointer;color:#fff;background:linear-gradient(#5b8fd6,var(--blue));box-shadow:0 5px 0 var(--blueD)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--blueD)}
.btn.go{background:linear-gradient(#4fd061,var(--green));box-shadow:0 5px 0 var(--greenD)}
.btn.gold{background:linear-gradient(#ffd667,#f0a92a);color:#5a3600;box-shadow:0 5px 0 #b97a12}
.btn[hidden]{display:none}
.phrases{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.ph{background:#fff;border-radius:999px;padding:9px 16px;font-family:var(--head);font-weight:600;font-size:clamp(14px,1.8vw,18px);box-shadow:0 4px 0 rgba(36,49,94,.15);border:2px solid #e6e9f7}
.ph b{color:#e2463a}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎡 Word Wheel</h1>
  <div class="main">
    <div class="wheelBox">
      <div class="pointer"></div>
      <svg id="wheel" viewBox="-210 -210 420 420" aria-label="Word wheel"></svg>
      <div class="hub" id="spin">SPIN</div>
    </div>
    <div class="panel" id="panel">
      <div class="pic" id="pic">❓</div>
      <div class="hint" id="hint">Spin the wheel!</div>
      <div class="letters" id="letters"></div>
      <div class="btns">
        <button class="btn gold" id="next" hidden>🔤 Next letter</button>
        <button class="btn" id="show" hidden>👀 Show word</button>
        <button class="btn" id="hear" hidden>🔊 Listen</button>
        <button class="btn go" id="again" hidden>🎡 Spin again</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ===== WORDS: change pictures / words here ===== */
const WORDS=[
 {pic:'🚲',word:'bike'},{pic:'🐴',word:'horse'},{pic:'🛹',word:'skateboard'},{pic:'🛴',word:'scooter'},
 {pic:'⚽',word:'football'},{pic:'🎾',word:'tennis'},{pic:'🪁',word:'kite'},{pic:'🧸',word:'teddy bear'},
 {pic:'🛏️',word:'bed'},{pic:'🪑',word:'chair'},{pic:'🛋️',word:'sofa'},{pic:'🚪',word:'door'},
 {pic:'🎹',word:'piano'},{pic:'💻',word:'computer'},{pic:'📦',word:'box'},{pic:'🎒',word:'bag'}
];
const COLORS=['#ff8a80','#ffd166','#8bd3a7','#7cc4f5','#c3a6ff','#ffab76','#f8a5c2','#9be3de'];


/* ================= SPEECH: Gemini voice via shared Supabase proxy, browser en-GB male fallback ================= */
const AI_PROXY="https://fnmxgojqdenmtobzlnhi.supabase.co/functions/v1/gemini";
const TTS_MODEL="gemini-2.5-flash-preview-tts",TTS_VOICE="Puck";
let soundOn=true,voice=null,aiVoice=true,aiFails=0,AC=null,curSrc=null,spTok=0;const ttsCache=new Map();
function pickVoice(){const v=speechSynthesis.getVoices(),gb=v.filter(x=>/en-GB/i.test(x.lang)),M=/\bmale|daniel|george|ryan|arthur|oliver|thomas|google uk english male/i;
 voice=gb.find(x=>M.test(x.name)&&!/female/i.test(x.name))||gb[0]||v.find(x=>/^en/i.test(x.lang))||null}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function ensureAC(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}
function clean(t){return t.replace(/[^\w\s',.!?\-]/g,' ').replace(/\s+/g,' ').trim()}
function stopSpeech(){spTok++;try{curSrc&&curSrc.stop()}catch(e){}curSrc=null;if(window.speechSynthesis)speechSynthesis.cancel()}
function ttsFetch(t){if(ttsCache.has(t))return ttsCache.get(t);
 const p=(async()=>{if(!AC)throw new Error('no audio');const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),12000);
  try{const r=await fetch(AI_PROXY+'?forceFunctionRegion=us-east-1&model='+TTS_MODEL,{method:'POST',headers:{'Content-Type':'application/json'},signal:ctl.signal,
    body:JSON.stringify({model:TTS_MODEL,contents:[{parts:[{text:'Read aloud slowly and clearly, in a warm, friendly British English accent, for a young child learning English: '+t}]}],
     generationConfig:{responseModalities:['AUDIO'],speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:TTS_VOICE}}}}})});
   const j=await r.json(),part=j&&j.candidates&&j.candidates[0].content.parts.find(x=>x.inlineData);
   if(!r.ok||!part)throw new Error('no audio');
   const rate=+((/rate=(\d+)/.exec(part.inlineData.mimeType)||[0,24000])[1]),bin=atob(part.inlineData.data),n=bin.length>>1,buf=AC.createBuffer(1,n,rate),ch=buf.getChannelData(0);
   for(let i=0;i<n;i++){let v=bin.charCodeAt(2*i)|(bin.charCodeAt(2*i+1)<<8);if(v&0x8000)v-=0x10000;ch[i]=v/32768}
   return buf}finally{clearTimeout(to)}})();
 ttsCache.set(t,p);p.then(()=>{aiFails=0},()=>{ttsCache.delete(t);if(++aiFails>=2)aiVoice=false});return p}
function browserSpeak(t){if(!('speechSynthesis' in window))return;const u=new SpeechSynthesisUtterance(t);if(voice)u.voice=voice;u.lang='en-GB';u.rate=.85;speechSynthesis.speak(u)}
function speak(t){if(!soundOn||!t)return;t=clean(t);if(!t)return;stopSpeech();const tok=spTok;
 if(aiVoice&&AC){ttsFetch(t).then(buf=>{if(tok!==spTok)return;const s=AC.createBufferSource();s.buffer=buf;s.connect(AC.destination);curSrc=s;s.start()},()=>{if(tok===spTok)browserSpeak(t)})}
 else browserSpeak(t)}
function prefetch(t){if(soundOn&&aiVoice&&AC&&t)ttsFetch(clean(t)).catch(()=>{})}
function blip(good){if(!soundOn||!AC)return;try{const o=AC.createOscillator(),g=AC.createGain();o.type='square';const t=AC.currentTime;
 if(good){o.frequency.setValueAtTime(660,t);o.frequency.setValueAtTime(990,t+.08)}else{o.frequency.setValueAtTime(220,t);o.frequency.setValueAtTime(160,t+.1)}
 g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.26)}catch(e){}}


const $=id=>document.getElementById(id);
const NS='http://www.w3.org/2000/svg';
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p&&p.appendChild(e);return e}
const W=$('wheel'),N=WORDS.length,R=200,step=360/N;
el('circle',{r:206,fill:'#24315e'},W);
WORDS.forEach((w,i)=>{
 const a0=(i*step-90-step/2)*Math.PI/180,a1=((i+1)*step-90-step/2)*Math.PI/180;
 el('path',{d:`M0 0 L${R*Math.cos(a0)} ${R*Math.sin(a0)} A${R} ${R} 0 0 1 ${R*Math.cos(a1)} ${R*Math.sin(a1)} Z`,fill:COLORS[i%COLORS.length],stroke:'#fff','stroke-width':3},W);
 const g=el('g',{transform:`rotate(${i*step}) translate(0 -${R*0.68})`},W);
 const t=el('text',{'text-anchor':'middle','dominant-baseline':'central','font-size':N>14?34:40},g);t.textContent=w.pic;
});
for(let i=0;i<N;i++){const a=(i*step-90-step/2)*Math.PI/180;el('circle',{cx:(R+1)*Math.cos(a),cy:(R+1)*Math.sin(a),r:4,fill:'#fff'},W)}

let rot=0,spinning=false,cur=null,shown=0,last=-1;
function spin(){if(spinning)return;ensureAC();spinning=true;
 let k;do{k=Math.random()*N|0}while(k===last&&N>1);last=k;
 const target=360-k*step;const base=rot-(rot%360);
 rot=base+360*5+target+(Math.random()-.5)*step*0.6;
 W.style.transform=`rotate(${rot}deg)`;
 $('pic').textContent='🎡';$('hint').textContent='…';$('letters').innerHTML='';
 ['next','show','hear','again'].forEach(b=>$(b).hidden=true);blip(true);
 setTimeout(()=>{spinning=false;land(k)},4300)}
function land(k){cur=WORDS[k];shown=0;blip(true);
 $('pic').textContent=cur.pic;$('hint').textContent="What's this in English?";
 drawLetters();$('next').hidden=false;$('show').hidden=false;$('hear').hidden=true;$('again').hidden=false}
function drawLetters(){const box=$('letters');box.innerHTML='';let n=0;
 [...cur.word].forEach(ch=>{const d=document.createElement('div');
  if(ch===' '){d.className='lt gap'}else{const vis=n<shown;d.className='lt'+(vis?' on':'');d.textContent=vis?ch:'';n++}
  box.appendChild(d)})}
function letterCount(){return cur.word.replace(/ /g,'').length}
$('next').onclick=()=>{if(!cur)return;if(shown<letterCount()){shown++;drawLetters();blip(true)}if(shown>=letterCount()){$('next').hidden=true;$('hear').hidden=false}};
$('show').onclick=()=>{if(!cur)return;shown=letterCount();drawLetters();$('next').hidden=true;$('hear').hidden=false};
$('hear').onclick=()=>{if(cur)speak(cur.word)};
$('spin').onclick=spin;$('again').onclick=spin;
</script>
</body>
</html>
