<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Three Doors: What Will You Choose?</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --navy:#141a33; --navy2:#1d2547; --purple:#6a5acd; --purple-soft:#8b7fd4;
    --teal:#2ec4b6; --gold:#f2b134; --ink:#e8e6f7; --ink-dim:#a9a5cc;
  }
  body {
    font-family:'Nunito','Segoe UI',sans-serif;
    background: radial-gradient(1200px 800px at 70% -10%, #2a2f5c 0%, var(--navy) 55%, #0e1226 100%);
    color: var(--ink);
    min-height: 100vh;
    display:flex; align-items:center; justify-content:center;
    padding: 16px;
  }
  .wrap { width:100%; max-width: 1060px; }
  .center { text-align:center; }
  h1 {
    font-family:'Caveat','Segoe Script',cursive;
    font-size: 64px; color: var(--gold);
    text-shadow: 0 0 24px rgba(242,177,52,.35);
    line-height: 1; margin-bottom: 10px;
  }
  h2 {
    font-family:'Caveat','Segoe Script',cursive;
    font-size: 44px; color: var(--ink); margin-bottom: 4px;
  }
  .subtitle { font-size: 20px; color: var(--ink-dim); margin-bottom: 8px; }
  .hint-line { font-size: 16px; color: var(--teal); font-weight: 700; margin-bottom: 26px; }
  .btn {
    display:inline-block;
    font-family:inherit; font-weight:800;
    border:none; border-radius: 16px;
    cursor:pointer;
    transition: transform .08s, filter .15s;
  }
  .btn:active { transform: scale(.96); }
  .btn-big {
    background: linear-gradient(135deg, var(--purple), var(--teal));
    color:#fff; font-size: 28px;
    padding: 20px 54px; min-height: 76px;
    box-shadow: 0 10px 30px rgba(106,90,205,.4);
  }
  .btn-big:hover { filter: brightness(1.12); }
  .btn-mid {
    background: linear-gradient(135deg, var(--purple), #4d44a8);
    color:#fff; font-size: 20px;
    padding: 14px 26px; min-height: 60px;
  }
  .btn-ghost {
    background: transparent; color: var(--ink);
    border: 2px solid var(--purple-soft);
    font-size: 18px; padding: 12px 22px; min-height: 54px;
  }
  .btn-ghost:hover { background: rgba(139,127,212,.15); }

  .topbar { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom: 14px; flex-wrap: wrap; }
  .round-tag {
    background: rgba(46,196,182,.15); color: var(--teal);
    border: 1px solid rgba(46,196,182,.4);
    font-weight:800; font-size: 15px;
    padding: 6px 16px; border-radius: 999px;
  }

  .doors { display:grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  @media (max-width: 760px) { .doors { grid-template-columns: 1fr; } h1{font-size:48px;} h2{font-size:34px;} }
  .door {
    background: linear-gradient(180deg, var(--navy2), #171d3a);
    border: 2px solid rgba(139,127,212,.35);
    border-radius: 22px;
    padding: 16px;
    display:flex; flex-direction:column; gap:10px;
    box-shadow: 0 8px 24px rgba(0,0,0,.35);
  }
  .door svg { width:100%; height:auto; border-radius: 14px; display:block; }
  .door-name { font-size: 24px; font-weight: 800; color: var(--gold); }
  .feat { display:flex; align-items:flex-start; gap:10px; font-size: 18px; line-height:1.25; text-align:left; }
  .ico { flex:0 0 26px; width:26px; height:26px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:15px; margin-top:1px; }
  .ico.plus { background: rgba(46,196,182,.2); color: var(--teal); border:1.5px solid var(--teal); }
  .ico.minus { background: rgba(242,177,52,.16); color: var(--gold); border:1.5px solid var(--gold); }
  .vocab { border-bottom: 2px dotted var(--teal); cursor: pointer; }
  .vocab-ru { display:none; color: var(--teal); font-size: 15px; font-weight:700; }
  .vocab.open + .vocab-ru { display:inline; }
  .door .btn-mid { width:100%; margin-top:auto; }

  .frame-strip {
    background: rgba(242,177,52,.1);
    border: 1.5px dashed rgba(242,177,52,.55);
    color: var(--gold);
    border-radius: 14px;
    font-family:'Caveat','Segoe Script',cursive;
    font-size: 30px; padding: 8px 18px;
    margin: 14px auto 18px; display:inline-block;
  }

  .event-card {
    background: linear-gradient(180deg, var(--navy2), #171d3a);
    border: 2px solid rgba(139,127,212,.35);
    border-radius: 24px;
    padding: 26px 24px;
    max-width: 720px; margin: 0 auto;
    box-shadow: 0 10px 34px rgba(0,0,0,.4);
  }
  .event-card svg { width: 220px; max-width: 60%; margin: 0 auto 12px; display:block; border-radius: 16px; }
  .event-text { font-size: 26px; font-weight: 800; margin-bottom: 18px; line-height: 1.3; }
  .opt-btn {
    display:block; width:100%;
    background:#232a52; color:var(--ink);
    border: 2.5px solid rgba(139,127,212,.45);
    border-radius: 16px;
    font-size: 22px; font-weight: 800;
    min-height: 64px; padding: 12px 18px; margin: 10px 0;
    cursor:pointer; font-family:inherit;
    transition: transform .08s, border-color .15s, background .15s;
  }
  .opt-btn:hover { border-color: var(--teal); }
  .opt-btn:active { transform: scale(.97); }
  .opt-btn.picked { background: rgba(46,196,182,.18); border-color: var(--teal); color:#d9fffb; }
  .q-bubble {
    background: rgba(106,90,205,.18);
    border-left: 5px solid var(--purple-soft);
    border-radius: 12px;
    font-size: 21px; font-weight: 700;
    padding: 14px 18px; margin: 12px 0; text-align:left;
    min-height: 20px;
  }
  .row { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top: 14px; }

  .help-overlay {
    position: fixed; inset: 0;
    background: rgba(10,12,28,.82);
    display:none; align-items:center; justify-content:center;
    padding: 18px; z-index: 50;
  }
  .help-overlay.show { display:flex; }
  .help-panel {
    background: linear-gradient(180deg, var(--navy2), #151a36);
    border: 2px solid var(--purple-soft);
    border-radius: 22px;
    max-width: 520px; width:100%;
    padding: 26px 24px; text-align:left;
    max-height: 86vh; overflow:auto;
  }
  .help-panel h3 { font-family:'Caveat',cursive; font-size: 32px; color: var(--gold); margin-bottom: 4px; }
  .help-panel ul { list-style:none; margin: 6px 0 18px; }
  .help-panel li {
    font-size: 21px; font-weight: 700; padding: 7px 0 7px 16px;
    border-left: 3px solid var(--teal); margin: 8px 0;
  }

  .adv-grid { display:grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin: 18px 0; }
  @media (max-width: 760px){ .adv-grid { grid-template-columns: repeat(2, 1fr); } }
  .adv-item { background: var(--navy2); border-radius: 14px; padding: 8px; border:1.5px solid rgba(139,127,212,.3); }
  .adv-item svg { width:100%; border-radius: 10px; display:block; }
  .adv-name { font-size: 14px; font-weight: 800; color: var(--ink); margin-top: 6px; }
  .final-frames { font-family:'Caveat',cursive; font-size: 30px; color: var(--teal); line-height: 1.6; margin: 10px 0 18px; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<div class="help-overlay" id="helpOv" onclick="if(event.target===this)toggleHelp(false)">
  <div class="help-panel">
    <h3>Help me speak 💬</h3>
    <h3 style="font-size:24px;color:var(--teal)">My choice</h3>
    <ul>
      <li>I'll choose door…</li>
      <li>I'll go to…</li>
      <li>…because it's…</li>
      <li>…because there is / there are…</li>
    </ul>
    <h3 style="font-size:24px;color:var(--teal)">My prediction</h3>
    <ul>
      <li>I think I'll find…</li>
      <li>Maybe there will be…</li>
    </ul>
    <h3 style="font-size:24px;color:var(--teal)">My next action</h3>
    <ul>
      <li>I'll take…</li>
      <li>I'll look for…</li>
      <li>I'll ask…</li>
      <li>I won't…</li>
    </ul>
    <div class="center"><button class="btn btn-mid" onclick="toggleHelp(false)">Close</button></div>
  </div>
</div>

}

/* ---------- vocab helper ---------- */
function withVocab(text){
  let out = text;
  for(const w in VOCAB){
    const re = new RegExp(w.replace(' ','\\s'), 'i');
    out = out.replace(re, m => `<span class="vocab" onclick="toggleVocab(this)">${m}</span><span class="vocab-ru"> (${VOCAB[w]})</span>`);
  }
  return out;
}
function toggleVocab(el){ el.classList.toggle('open'); }
function toggleHelp(on){ document.getElementById('helpOv').classList.toggle('show', on); }

/* ---------- state ---------- */
let round = 0;
let choices = [null,null,null,null,null];
let qIdx = 0;
let picked = new Set();

const app = document.getElementById('app');

/* ---------- screens ---------- */
function startScreen(){
  app.innerHTML = `
    <div class="center">
      <h1>THREE DOORS</h1>
      <p class="subtitle">Every door has a problem. Which one will you choose?</p>
      <p class="hint-line">Look. Choose. Explain. Each round is a new adventure.</p>
      <button class="btn btn-big" onclick="showDoors(0)">START</button>
    </div>`;
}

function helpBtn(){ return `<button class="btn btn-ghost" onclick="toggleHelp(true)">💬 Help me speak</button>`; }

function showDoors(r){
  round = r; qIdx = 0; picked = new Set();
  const R = ROUNDS[r];
  const frameStrip = r === 0 ? `<div class="center"><div class="frame-strip">I'll choose door … because …</div></div>` : '';
  app.innerHTML = `
    <div class="topbar">
      <span class="round-tag">Round ${r+1} of 5</span>
      ${helpBtn()}
    </div>
    <div class="center"><h2>${R.title}</h2></div>
    ${frameStrip}
    <div class="doors">
      ${R.doors.map((d,di)=>`
        <div class="door">
          ${scene(d.key)}
          <div class="door-name">Door ${di+1}: ${withVocab(d.name)}</div>
          <div class="feat"><span class="ico plus">✓</span><span>${withVocab(d.pros[0])}</span></div>
          <div class="feat"><span class="ico plus">✓</span><span>${withVocab(d.pros[1])}</span></div>
          <div class="feat"><span class="ico minus">!</span><span>${withVocab(d.con)}</span></div>
          <button class="btn btn-mid" onclick="chooseDoor(${di})">Choose this door</button>
        </div>`).join('')}
    </div>`;
}

function chooseDoor(di){
  choices[round] = ROUNDS[round].doors[di];
  showEvent(di);
}

function showEvent(di){
  const d = ROUNDS[round].doors[di];
  const isLast = round === ROUNDS.length - 1;
  app.innerHTML = `
    <div class="topbar">
      <span class="round-tag">Round ${round+1} of 5 — ${d.name}</span>
      ${helpBtn()}
    </div>
    <div class="event-card center">
      ${scene(d.key)}
      <div class="event-text">${withVocab(d.event)}</div>
      ${d.multi ? `<div class="hint-line">Choose ${d.multi} things!</div>` : ''}
      <div id="opts">
        ${d.options.map((o,oi)=>`<button class="opt-btn" id="o${oi}" onclick="pickOpt(${oi},${d.multi||1})">${o}</button>`).join('')}
      </div>
      <div class="q-bubble" id="qb" style="display:none"></div>
      <div class="row">
        <button class="btn btn-ghost" onclick="moreQuestion()">❓ One more question</button>
        <button class="btn btn-ghost" onclick="showDoors(round)">← Back to doors</button>
      </div>
      <div class="row">
        <button class="btn btn-big" id="nextBtn" onclick="nextRound()" ${d.options.length>1?'':'style="display:none"'}>${isLast ? 'Finish the adventure ✨' : 'Next round →'}</button>
      </div>
    </div>`;
}

function pickOpt(oi, max){
  const id = 'o'+oi;
  const el = document.getElementById(id);
  if(max > 1){
    if(picked.has(oi)){ picked.delete(oi); el.classList.remove('picked'); }
    else if(picked.size < max){ picked.add(oi); el.classList.add('picked'); }
  } else {
    picked = new Set([oi]);
    document.querySelectorAll('.opt-btn').forEach(b=>b.classList.remove('picked'));
    el.classList.add('picked');
  }
}

function moreQuestion(){
  const qb = document.getElementById('qb');
  qb.style.display = 'block';
  qb.textContent = MORE_Q[qIdx % MORE_Q.length];
  qIdx++;
}

function nextRound(){
  if(round < ROUNDS.length - 1) showDoors(round + 1);
  else finalScreen();
}

function roundPicker(){
  app.innerHTML = `
    <div class="topbar"><span class="round-tag">Choose a round</span>${helpBtn()}</div>
    <div class="center"><h2>Choose a round</h2></div>
    ${ROUNDS.map((R,ri)=>`<button class="opt-btn" onclick="showDoors(${ri})">Round ${ri+1}: ${R.title}</button>`).join('')}
    <div class="row"><button class="btn btn-ghost" onclick="finalScreen()">← Back</button></div>`;
}

function finalScreen(){
  app.innerHTML = `
    <div class="center">
      <h1 style="font-size:52px">Your adventure</h1>
      <p class="subtitle">Tell your adventure. Use your choices.</p>
    </div>
    <div class="adv-grid">
      ${choices.map((c,ci)=> c ? `
        <div class="adv-item">${scene(c.key)}<div class="adv-name center">${ci+1}. ${c.name}</div></div>` : `
        <div class="adv-item"><div class="adv-name center" style="padding:26px 4px">${ci+1}. ?</div></div>`).join('')}
    </div>
    <div class="center final-frames">
      First, I'll…<br>Then, I'll…<br>After that, I'll…<br>Finally, I'll…
    </div>
    <div class="row">
      <button class="btn btn-big" onclick="restart()">PLAY AGAIN</button>
      <button class="btn btn-mid" onclick="roundPicker()">CHOOSE A ROUND</button>
    </div>
    <div class="row" style="margin-top:12px">${helpBtn()}</div>`;
}

function restart(){ choices=[null,null,null,null,null]; round=0; startScreen(); }

startScreen();
</script>
</body>
</html>
