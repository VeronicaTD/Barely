<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Three Doors: What Will You Choose?</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root{
    --night:#1a1035; --violet:#5b3fd0; --violet2:#4528a8; --lav:#c9b8ff; --lav-line:rgba(201,184,255,.55);
    --parch:#f3e3c1; --parch2:#e6cf9f; --parch-edge:#c9a96b; --brown:#3b2a17; --brown-soft:#6e5532;
    --gold:#f6c453; --gold2:#e8a42c; --green:#3f9a5b; --amber:#e39a22; --white:#fbf6ff;
  }
  html,body{min-height:100%}
  body{
    font-family:'Nunito','Segoe UI',sans-serif; color:var(--white);
    background:#1a1035;
    min-height:100vh; padding:18px 16px 28px;
  }
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(ellipse at 50% 40%,rgba(26,16,53,.25),rgba(14,8,32,.78)),url('three-doors-img/bg.webp') center/cover no-repeat}
  .wrap{position:relative;z-index:1;width:100%;max-width:1040px;margin:0 auto}
  .center{text-align:center}

  /* top bar */
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .pill{border:2px solid var(--lav-line);background:rgba(30,18,64,.6);backdrop-filter:blur(4px);
    color:var(--white);font-weight:800;font-size:16px;padding:9px 20px;border-radius:999px;font-family:inherit}
  button.pill{cursor:pointer} button.pill:hover{background:rgba(91,63,208,.45)}

  h1{font-family:'Caveat',cursive;font-size:clamp(56px,10vw,92px);line-height:1;color:var(--white);text-shadow:0 4px 18px rgba(0,0,0,.6)}
  h2{font-family:'Caveat',cursive;font-size:clamp(38px,6vw,58px);line-height:1.05;color:var(--white);text-shadow:0 3px 14px rgba(0,0,0,.65);margin:4px 0 6px}

  /* scroll banner */
  .scroll{display:inline-block;position:relative;margin:4px auto 16px;padding:8px 46px;
    font-family:'Caveat',cursive;font-size:clamp(24px,3.6vw,32px);color:var(--brown);
    background:linear-gradient(180deg,#f6e7c6,#e3c992);border-radius:6px;box-shadow:0 6px 16px rgba(0,0,0,.4)}
  .scroll::before,.scroll::after{content:"";position:absolute;top:-6px;bottom:-6px;width:22px;border-radius:10px;
    background:linear-gradient(90deg,#c9a46a,#f0dbb0,#b8915a);box-shadow:0 3px 8px rgba(0,0,0,.35)}
  .scroll::before{left:-8px}.scroll::after{right:-8px}

  /* buttons */
  .btn{font-family:inherit;font-weight:900;border:none;cursor:pointer;transition:transform .08s,filter .15s}
  .btn:active{transform:scale(.96)}
  .btn-violet{background:linear-gradient(180deg,var(--violet),var(--violet2));color:#fff;font-size:20px;
    border-radius:16px;padding:13px 18px;min-height:56px;box-shadow:0 5px 0 #2e1a78,0 8px 18px rgba(0,0,0,.35)}
  .btn-violet:hover{filter:brightness(1.12)}
  .btn-gold{background:linear-gradient(180deg,#ffd877,var(--gold2));color:#2a1a06;font-size:clamp(22px,3vw,28px);
    border-radius:20px;padding:16px 44px;min-height:66px;box-shadow:0 5px 0 #a8701a,0 10px 24px rgba(0,0,0,.4)}
  .btn-gold:hover{filter:brightness(1.07)}
  .btn-ghost{background:rgba(30,18,64,.55);color:var(--white);border:2px solid var(--lav-line);font-size:18px;
    border-radius:16px;padding:12px 18px;min-height:54px}
  .btn-ghost:hover{background:rgba(91,63,208,.4)}

  /* doors */
  .doors{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(12px,2vw,22px);align-items:stretch}
  .door{display:flex;flex-direction:column;align-items:center;animation:rise .45s both}
  .door:nth-child(2){animation-delay:.08s}.door:nth-child(3){animation-delay:.16s}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .door-img{width:100%;max-width:300px;aspect-ratio:292/336;object-fit:cover;display:block;
    filter:drop-shadow(0 10px 22px rgba(0,0,0,.55));
    -webkit-mask-image:radial-gradient(ellipse 62% 70% at 50% 50%,#000 62%,transparent 98%);
            mask-image:radial-gradient(ellipse 62% 70% at 50% 50%,#000 62%,transparent 98%)}
  .parch{position:relative;background:linear-gradient(180deg,var(--parch),var(--parch2));color:var(--brown);
    border-radius:10px;box-shadow:inset 0 0 0 2px rgba(201,169,107,.6),inset 0 0 26px rgba(150,110,50,.25),0 10px 22px rgba(0,0,0,.45)}
  .parch::before,.parch::after{content:"";position:absolute;width:9px;height:9px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#e8d3a8,#8f7140);top:9px}
  .parch::before{left:9px}.parch::after{right:9px}
  .door .parch{flex:1;width:100%;margin-top:-26px;padding:18px 16px 16px;display:flex;flex-direction:column;gap:9px}
  .door-name{text-align:center;font-weight:900;font-size:clamp(18px,2.2vw,22px);line-height:1.15;margin-bottom:2px}
  .door-name small{display:block;font-size:.85em}
  .feat{display:flex;gap:9px;align-items:flex-start;font-size:clamp(15px,1.8vw,17px);font-weight:700;line-height:1.25}
  .ico{flex:0 0 22px;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:900;color:#fff;margin-top:1px}
  .ico.plus{background:var(--green)} .ico.minus{background:var(--amber)}
  .door .btn-violet{width:100%;margin-top:auto}

  .vocab{border-bottom:2px dotted var(--brown-soft);cursor:pointer}
  .vocab-ru{display:none;color:#8a5a12;font-size:.9em;font-weight:800}
  .vocab.open + .vocab-ru{display:inline}
  .q-card .vocab{border-color:var(--brown-soft)}

  /* event screen */
  .event{max-width:680px;margin:0 auto;display:flex;flex-direction:column;align-items:center;animation:rise .4s both}
  .photo{background:#f4ead6;padding:10px 10px 12px;border-radius:4px;transform:rotate(-2deg);
    box-shadow:0 12px 28px rgba(0,0,0,.55);position:relative;margin:6px 0 0}
  .photo::before,.photo::after{content:"";position:absolute;width:70px;height:22px;background:rgba(230,205,150,.85);top:-10px}
  .photo::before{left:-14px;transform:rotate(-28deg)} .photo::after{right:-14px;transform:rotate(26deg)}
  .photo img{display:block;width:clamp(170px,30vw,230px);aspect-ratio:292/336;object-fit:cover}
  .photo .cap{font-family:'Caveat',cursive;color:var(--brown);font-size:24px;text-align:center;margin-top:4px}
  .q-card{width:100%;margin-top:-6px;padding:22px 26px;text-align:center;font-size:clamp(20px,2.8vw,25px);font-weight:900;line-height:1.3}
  .multi{font-size:17px;color:#8a5a12;margin-top:6px;font-weight:800}
  .opts{width:100%;display:flex;flex-direction:column;gap:12px;margin-top:16px}
  .opt{display:flex;align-items:center;gap:14px;width:100%;font-family:inherit;cursor:pointer;
    background:rgba(52,30,110,.82);color:var(--white);border:2px solid var(--lav-line);border-radius:18px;
    padding:14px 22px;min-height:64px;font-size:clamp(19px,2.6vw,23px);font-weight:800;text-align:left;
    transition:transform .08s,background .15s,border-color .15s}
  .opt:hover{border-color:var(--gold)} .opt:active{transform:scale(.98)}
  .opt .oi{font-size:28px;flex:0 0 34px;text-align:center}
  .opt .ot{flex:1;text-align:center}
  .opt.picked{background:linear-gradient(180deg,#6c4fe0,#4a2db4);border-color:var(--gold);box-shadow:0 0 0 3px rgba(246,196,83,.35)}
  .result{display:none;width:100%;margin-top:14px;padding:16px 22px;text-align:center;font-size:clamp(18px,2.4vw,21px);font-weight:800;line-height:1.4}
  .result.show{display:block;animation:rise .35s both}
  .result .you{font-family:'Caveat',cursive;font-size:1.35em;color:#7a4a0e;display:block;margin-bottom:2px}
  .bubble{display:none;width:100%;margin-top:12px;background:rgba(30,18,64,.75);border-left:5px solid var(--gold);
    border-radius:12px;padding:12px 18px;font-size:20px;font-weight:800;text-align:left}
  .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:16px;width:100%}
  .row .btn-ghost{flex:1;min-width:200px;max-width:320px}

  /* start / final */
  .start{max-width:640px;margin:8vh auto 0;text-align:center;animation:rise .5s both}
  .start .parch{padding:22px 24px;margin:18px auto 26px;font-size:clamp(18px,2.6vw,22px);font-weight:800;line-height:1.45}
  .mini-doors{display:flex;justify-content:center;gap:10px;margin-top:8px}
  .mini-doors img{width:clamp(80px,16vw,120px);filter:drop-shadow(0 6px 12px rgba(0,0,0,.5))}
  .adv{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:16px 0}
  .adv-item{display:flex;flex-direction:column;align-items:center}
  .adv-item img{width:100%;max-width:170px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.5))}
  .adv-item .parch{width:100%;margin-top:-14px;padding:10px 6px;text-align:center;font-weight:900;font-size:15px}
  .adv-empty{width:100%;aspect-ratio:292/336;border:2px dashed var(--lav-line);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:40px;color:var(--lav)}
  .frames{display:inline-block;padding:14px 34px;font-family:'Caveat',cursive;font-size:clamp(26px,3.6vw,32px);line-height:1.45;color:var(--brown)}

  /* help */
  .help-ov{position:fixed;inset:0;background:rgba(12,6,30,.8);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}
  .help-ov.show{display:flex}
  .help{max-width:500px;width:100%;max-height:86vh;overflow:auto;padding:24px 26px;text-align:left}
  .help h3{font-family:'Caveat',cursive;font-size:36px;margin-bottom:2px}
  .help h4{font-size:19px;color:#7a4a0e;margin:12px 0 4px}
  .help li{list-style:none;font-size:20px;font-weight:800;padding:5px 0 5px 14px;border-left:3px solid var(--parch-edge);margin:6px 0}

  @media (max-width:700px){
    .doors{grid-template-columns:1fr;max-width:340px;margin:0 auto}
    .adv{grid-template-columns:repeat(3,1fr)}
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<div class="help-ov" id="helpOv" onclick="if(event.target===this)toggleHelp(false)">
  <div class="help parch">
    <h3>Help me speak 💬</h3>
    <h4>My choice</h4>
    <ul><li>I'll choose door…</li><li>I'll go to…</li><li>…because it's…</li><li>…because there is / there are…</li></ul>
    <h4>My prediction</h4>
    <ul><li>I think I'll find…</li><li>Maybe there will be…</li></ul>
    <h4>My next action</h4>
    <ul><li>I'll take…</li><li>I'll look for…</li><li>I'll ask…</li><li>I won't…</li></ul>
    <div class="center" style="margin-top:14px"><button class="btn btn-violet" onclick="toggleHelp(false)">Close</button></div>
  </div>
</div>

<script>
const IMG = (r,d) => `three-doors-img/r${r+1}-d${d+1}.webp`;

const VOCAB = {
  "drinking water":"питьевая вода",
  "heating":"отопление",
  "journey":"путешествие",
  "charging":"зарядка",
  "protect":"защищать",
  "treasure":"сокровище",
  "torch":"фонарик",
  "rope bridge":"верёвочный мост"
};

const MORE_Q = [
  "Why will you choose this door?",
  "What will you take with you?",
  "Will you go alone or with a friend?",
  "What do you think you'll find there?"
];

const ROUNDS = [
  { title:"Where will you spend the night?", doors:[
    { name:"A tropical beach", pros:["Warm and beautiful.","Lots of fruit."], con:"No drinking water.",
      event:"It's getting dark. You need drinking water. What will you do?",
      options:[
        {i:"💧",t:"look for water",r:"You'll walk behind the palm trees and find a small river."},
        {i:"🔭",t:"explore the island",r:"You'll find lots of coconuts — and coconut water!"}]},
    { name:"An old castle", pros:["Food and drinking water.","A warm bed."], con:"Strange noises at night.",
      event:"You hear a noise behind a door. What will you do?",
      options:[
        {i:"🚪",t:"open the door",r:"You'll find a little owl. It's friendly!"},
        {i:"🛏️",t:"stay in your room",r:"You'll sleep with the light on. Tomorrow you'll explore the castle."}]},
    { name:"A snowy cabin", pros:["Food and drinking water.","A safe place."], con:"No heating. It's very cold.",
      event:"You find some blankets and wood. What will you do?",
      options:[
        {i:"🧣",t:"use the blankets",r:"You'll stay warm under three big blankets."},
        {i:"🔥",t:"make a fire in the fireplace",r:"The cabin will be warm and cosy in ten minutes."}]}
  ]},
  { title:"How will you travel?", doors:[
    { name:"A flying car", pros:["Very fast.","You can see everything."], con:"You must drive it yourself.",
      event:"You see dark clouds ahead. What will you do?",
      options:[
        {i:"🛬",t:"land",r:"You'll land on a hill and wait for the sun."},
        {i:"🧭",t:"find another way",r:"You'll fly around the clouds. It will take longer, but it's safe."}]},
    { name:"A slow train", pros:["Comfortable and safe.","Free food."], con:"The journey takes two days.",
      event:"Your phone battery is dead. What will you do?",
      options:[
        {i:"📖",t:"read a book",r:"You'll finish the whole book before the end of the journey!"},
        {i:"💬",t:"talk to someone",r:"You'll meet a friendly girl, and she'll teach you a new card game."}]},
    { name:"A magic boat", pros:["No ticket needed.","It can travel anywhere."], con:"You can take only one bag.",
      event:"Your bag is too heavy. What will you leave behind?",
      options:[
        {i:"📷",t:"a camera",r:"No photos — but you'll remember everything!"},
        {i:"📖",t:"a book",r:"You won't read. You'll watch the sea and the stars."},
        {i:"👟",t:"an extra pair of shoes",r:"Your bag will be light. Let's hope your shoes don't get wet!"}]}
  ]},
  { title:"Who will help you?", doors:[
    { name:"A clever robot", pros:["Knows lots of things.","Can carry heavy bags."], con:"Needs charging every hour.",
      event:"The robot needs power. What will you do?",
      options:[
        {i:"🔌",t:"look for a charger",r:"You'll find a charger in an old shop."},
        {i:"🙋",t:"ask someone for help",r:"A kind man will help you charge the robot."}]},
    { name:"A friendly dragon", pros:["Can fly.","Can protect you."], con:"Eats most of your food.",
      event:"The dragon is hungry again. What will you do?",
      options:[
        {i:"🥪",t:"share your food",r:"The dragon will be your best friend!"},
        {i:"🍎",t:"look for more food",r:"You'll find apple trees. The dragon loves apples!"}]},
    { name:"A talking cat", pros:["Can see in the dark.","Can find secret doors."], con:"Doesn't always listen to you.",
      event:"The cat goes through a small hole. What will you do?",
      options:[
        {i:"⏳",t:"wait",r:"The cat will come back with a golden key!"},
        {i:"🔍",t:"look for another entrance",r:"You'll find a secret door behind a big plant."}]}
  ]},
  { title:"Which room will you choose?", doors:[
    { name:"A room full of gold", pros:["You can take some gold.","There is a map."], con:"The gold is very heavy.",
      event:"You can carry only three things. What will you take?",
      multi:3, options:[
        {i:"🪙",t:"gold"},{i:"🗺️",t:"a map"},{i:"💧",t:"water"},{i:"🔦",t:"a torch"},{i:"🍎",t:"food"}]},
    { name:"A room full of food", pros:["Plenty of food and water.","A comfortable sofa."], con:"You must stay for three hours.",
      event:"You have three hours. What will you do?",
      options:[
        {i:"🍕",t:"eat",r:"You'll eat pizza, cake and fruit!"},
        {i:"🛋️",t:"rest",r:"You'll sleep on the sofa and feel great."},
        {i:"📝",t:"make a plan",r:"You'll make a plan and find the exit faster."}]},
    { name:"A room with a magic mirror", pros:["The mirror can answer one question.","You can leave immediately."], con:"There is no food or treasure.",
      event:"You can ask one question. What will you ask?",
      options:[
        {i:"🚪",t:"Where is the exit?",r:"The mirror will show you a small green door."},
        {i:"👫",t:"Where are my friends?",r:"The mirror will show your friends. They're in the garden!"},
        {i:"🛡️",t:"Is this place safe?",r:"The mirror will say: \"Yes, but be careful!\""}]}
  ]},
  { title:"Which way will you go?", doors:[
    { name:"A dark tunnel", pros:["The shortest way.","No stairs."], con:"You can't see without a torch.",
      event:"Your torch stops working. What will you do?",
      options:[
        {i:"📱",t:"use your phone light",r:"You'll see the exit in five minutes."},
        {i:"↩️",t:"go back",r:"You'll go back and take the forest path."}]},
    { name:"A forest path", pros:["Light and fresh air.","You can find berries."], con:"It's a long walk.",
      event:"You find two paths. What will you do?",
      options:[
        {i:"🗺️",t:"check your map",r:"You'll take the left path. It goes to the exit!"},
        {i:"🪧",t:"look for signs",r:"You'll find a sign: EXIT → 2 km."}]},
    { name:"A rope bridge", pros:["You can see the exit.","It takes only five minutes."], con:"The bridge moves in the wind.",
      event:"The wind gets stronger. What will you do?",
      options:[
        {i:"⏳",t:"wait",r:"The wind will stop, and you'll cross the bridge."},
        {i:"↩️",t:"go back",r:"You'll go back and find the tunnel."}]}
  ]}
];

/* ---------- helpers ---------- */
function withVocab(text){
  let out = text;
  for(const w in VOCAB){
    const re = new RegExp(w.replace(' ','\\s'), 'i');
    out = out.replace(re, m => `<span class="vocab" onclick="toggleVocab(this)">${m}</span><span class="vocab-ru"> (${VOCAB[w]})</span>`);
  }
  return out;
}
function toggleVocab(el){ el.classList.toggle('open'); }
function toggleHelp(on){ document.getElementById('helpOv').classList.toggle('show', on); }
function helpBtn(){ return `<button class="pill" onclick="toggleHelp(true)">💬 Help me speak</button>`; }
function listJoin(a){ return a.length<2 ? a.join('') : a.slice(0,-1).join(', ')+' and '+a[a.length-1]; }

/* ---------- state ---------- */
let round = 0, curDoor = 0, qIdx = 0;
let choices = [null,null,null,null,null];
let picked = new Set();
const app = document.getElementById('app');

/* ---------- screens ---------- */
function startScreen(){
  app.innerHTML = `
    <div class="start">
      <h1>Three Doors</h1>
      <div class="mini-doors">
        <img src="${IMG(0,0)}" alt=""><img src="${IMG(0,1)}" alt=""><img src="${IMG(0,2)}" alt="">
      </div>
      <div class="parch">Every door has a problem.<br>Which one will you choose?<br><span style="color:#7a4a0e">Look. Choose. Explain.</span></div>
      <button class="btn btn-gold" onclick="showDoors(0)">START →</button>
    </div>`;
  scrollTo(0,0);
}

function showDoors(r){
  round = r; qIdx = 0; picked = new Set();
  const R = ROUNDS[r];
  app.innerHTML = `
    <div class="topbar"><span class="pill">Round ${r+1} of 5</span>${helpBtn()}</div>
    <div class="center">
      <h2>${R.title}</h2>
      ${r===0 ? `<div class="scroll">I'll choose door … because …</div>` : '<div style="height:10px"></div>'}
    </div>
    <div class="doors">
      ${R.doors.map((d,di)=>`
        <div class="door">
          <img class="door-img" src="${IMG(r,di)}" alt="${d.name}">
          <div class="parch">
            <div class="door-name">Door ${di+1}:<small>${withVocab(d.name)}</small></div>
            <div class="feat"><span class="ico plus">✓</span><span>${withVocab(d.pros[0])}</span></div>
            <div class="feat"><span class="ico plus">✓</span><span>${withVocab(d.pros[1])}</span></div>
            <div class="feat"><span class="ico minus">!</span><span>${withVocab(d.con)}</span></div>
            <button class="btn btn-violet" onclick="chooseDoor(${di})">Choose this door</button>
          </div>
        </div>`).join('')}
    </div>`;
  scrollTo(0,0);
}

function chooseDoor(di){
  curDoor = di;
  choices[round] = {r:round, d:di, name:ROUNDS[round].doors[di].name};
  showEvent();
}

function showEvent(){
  const d = ROUNDS[round].doors[curDoor];
  const isLast = round === ROUNDS.length - 1;
  picked = new Set(); qIdx = 0;
  app.innerHTML = `
    <div class="topbar"><span class="pill">Round ${round+1} of 5 — ${d.name}</span>${helpBtn()}</div>
    <div class="event">
      <div class="photo"><img src="${IMG(round,curDoor)}" alt=""><div class="cap">${d.name}</div></div>
      <div class="parch q-card">${withVocab(d.event)}${d.multi ? `<div class="multi">Choose ${d.multi} things!</div>` : ''}</div>
      <div class="opts">
        ${d.options.map((o,oi)=>`<button class="opt" id="o${oi}" onclick="pickOpt(${oi})"><span class="oi">${o.i}</span><span class="ot">${o.t}</span><span class="oi"></span></button>`).join('')}
      </div>
      <div class="parch result" id="res"></div>
      <div class="bubble" id="qb"></div>
      <div class="row">
        <button class="btn btn-ghost" onclick="moreQuestion()">❓ One more question</button>
        <button class="btn btn-ghost" onclick="showDoors(round)">← Back to doors</button>
      </div>
      <div class="row"><button class="btn btn-gold" onclick="nextRound()">${isLast ? 'Finish the adventure ✨' : 'Next round →'}</button></div>
    </div>`;
  scrollTo(0,0);
}

function pickOpt(oi){
  const d = ROUNDS[round].doors[curDoor];
  const res = document.getElementById('res');
  if(d.multi){
    const el = document.getElementById('o'+oi);
    if(picked.has(oi)){ picked.delete(oi); el.classList.remove('picked'); }
    else if(picked.size < d.multi){ picked.add(oi); el.classList.add('picked'); }
    if(picked.size === d.multi){
      const things = [...picked].sort().map(i=>d.options[i].t);
      const hasLight = things.includes('a torch'), hasMap = things.includes('a map');
      const end = hasMap && hasLight ? "With the map and the torch, you'll find the exit easily!"
                : hasMap ? "The map will show you the way out."
                : hasLight ? "The torch will help you in dark places."
                : "Hmm… no map and no torch. The way out will be difficult!";
      res.innerHTML = `<span class="you">You decided to take ${listJoin(things)}.</span>${end}`;
      res.classList.add('show');
    } else res.classList.remove('show');
    return;
  }
  document.querySelectorAll('.opt').forEach(b=>b.classList.remove('picked'));
  document.getElementById('o'+oi).classList.add('picked');
  const o = d.options[oi];
  const did = d.event.startsWith('You can ask') ? `You decided to ask: "${o.t}"`
            : d.event.includes('leave behind') ? `You decided to leave ${o.t}.`
            : `You decided to ${o.t}.`;
  res.innerHTML = `<span class="you">${did}</span>${o.r}`;
  res.classList.add('show');
  setTimeout(()=>res.scrollIntoView({behavior:'smooth',block:'nearest'}),60);
}

function moreQuestion(){
  const qb = document.getElementById('qb');
  qb.style.display = 'block';
  qb.textContent = MORE_Q[qIdx % MORE_Q.length];
  qIdx++;
}

function nextRound(){
  if(round < ROUNDS.length - 1) showDoors(round + 1);
  else finalScreen();
}

function roundPicker(){
  app.innerHTML = `
    <div class="topbar"><span class="pill">Choose a round</span>${helpBtn()}</div>
    <div class="center"><h2>Choose a round</h2></div>
    <div class="event"><div class="opts">
      ${ROUNDS.map((R,ri)=>`<button class="opt" onclick="showDoors(${ri})"><span class="oi">${ri+1}</span><span class="ot">${R.title}</span><span class="oi"></span></button>`).join('')}
    </div>
    <div class="row"><button class="btn btn-ghost" onclick="finalScreen()">← Back</button></div></div>`;
  scrollTo(0,0);
}

function finalScreen(){
  app.innerHTML = `
    <div class="center">
      <h2 style="font-size:clamp(46px,7vw,70px)">Your adventure</h2>
      <div class="scroll">Tell your adventure. Use your choices.</div>
    </div>
    <div class="adv">
      ${choices.map((c,ci)=> c ? `
        <div class="adv-item"><img src="${IMG(c.r,c.d)}" alt=""><div class="parch">${ci+1}. ${c.name}</div></div>` : `
        <div class="adv-item"><div class="adv-empty">?</div><div class="parch">${ci+1}. ?</div></div>`).join('')}
    </div>
    <div class="center"><div class="parch frames">First, I'll…<br>Then, I'll…<br>After that, I'll…<br>Finally, I'll…</div></div>
    <div class="row">
      <button class="btn btn-gold" onclick="restart()">Play again</button>
      <button class="btn btn-ghost" onclick="roundPicker()">Choose a round</button>
      ${helpBtn()}
    </div>`;
  scrollTo(0,0);
}

function restart(){ choices=[null,null,null,null,null]; round=0; startScreen(); }

startScreen();
</script>
</body>
</html>
