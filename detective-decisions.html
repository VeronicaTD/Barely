<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detective of the Year</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Nunito', 'Segoe UI', sans-serif;
    background: linear-gradient(160deg, #e8f3ff 0%, #f3edff 60%, #e8f9ff 100%);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
  }
  .card {
    background: #ffffffcc;
    backdrop-filter: blur(6px);
    border-radius: 28px;
    box-shadow: 0 12px 40px rgba(106, 90, 205, .18);
    max-width: 640px; width: 100%;
    padding: 32px 28px;
    text-align: center;
  }
  h1, h2 {
    font-family: 'Caveat', 'Segoe Script', cursive;
    color: #5b4bb8;
    font-size: 44px;
    line-height: 1.1;
    margin-bottom: 8px;
  }
  .sub { color: #6b7a99; font-size: 19px; margin-bottom: 24px; }
  .case-tag {
    display: inline-block;
    background: #efeaff; color: #6a5acd;
    font-weight: 800; font-size: 16px;
    padding: 6px 18px; border-radius: 999px;
    margin-bottom: 16px;
  }
  .situation {
    background: #f0f7ff;
    border-left: 6px solid #7c9ff0;
    border-radius: 16px;
    padding: 24px 20px;
    font-size: 30px; font-weight: 800; color: #33415c;
    margin-bottom: 10px;
  }
  .prompt { color: #8b7fd4; font-size: 18px; font-weight: 700; margin-bottom: 20px; }
  .btn {
    display: block; width: 100%;
    min-height: 70px;
    margin: 12px 0;
    padding: 14px 20px;
    font-family: inherit;
    font-size: 24px; font-weight: 700;
    color: #43356e;
    background: #ffffff;
    border: 3px solid #cfc4f5;
    border-radius: 18px;
    cursor: pointer;
    transition: transform .08s, background .15s, border-color .15s;
  }
  .btn:active { transform: scale(.97); }
  .btn:hover { background: #f6f2ff; border-color: #8f79e8; }
  .btn.picked { background: #e4dcff; border-color: #6a5acd; }
  .btn.big {
    background: linear-gradient(135deg, #7c6fd0, #5b9cf5);
    color: #fff; border: none;
    font-size: 26px; min-height: 80px;
    box-shadow: 0 8px 20px rgba(106, 90, 205, .35);
  }
  .dots { display: flex; gap: 8px; justify-content: center; margin-bottom: 18px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: #dcd6f7; }
  .dot.done { background: #6a5acd; }
  .dot.now { background: #5b9cf5; transform: scale(1.25); }
  .sentence-frame {
    font-size: 40px; font-weight: 800; color: #33415c;
    margin: 18px 0 6px;
    font-family: 'Caveat', 'Segoe Script', cursive;
  }
  .answer {
    font-size: 32px; font-weight: 800; color: #15914f;
    margin: 12px 0 6px; min-height: 44px;
  }
  .reaction { font-size: 22px; font-weight: 800; color: #d46a9e; min-height: 30px; margin-bottom: 6px; }
  .score-big { font-size: 64px; font-weight: 800; color: #6a5acd; margin: 8px 0; }
  .rank { font-size: 26px; font-weight: 800; color: #33415c; margin-bottom: 20px; }
  .emoji-row { font-size: 52px; margin-bottom: 6px; }
  .star-pop { display:inline-block; animation: pop .5s ease; }
  @keyframes pop { 0% { transform: scale(0); } 70% { transform: scale(1.3); } 100% { transform: scale(1); } }
</style>
</head>
<body>
<div class="card" id="app"></div>

<script>
const cases = [
  { s: "😋 I'm hungry.", opts: [
    { t: "make a sandwich" },
    { t: "order a pizza" },
    { t: "eat the tablecloth", funny: "The tablecloth?? Bon appétit! 😹" }
  ]},
  { s: "🥶 I'm cold.", opts: [
    { t: "close the window" },
    { t: "put on a hoodie" },
    { t: "hug the fridge", funny: "The fridge is even colder, detective! 🥶" }
  ]},
  { s: "📞 The phone's ringing.", opts: [
    { t: "answer it" },
    { t: "let my cat answer it", funny: "Meow, who's calling? 🐱" },
    { t: "hide under the bed", funny: "Classic detective move! 🛏️" }
  ]},
  { s: "🛍️ These bags are heavy.", opts: [
    { t: "help you carry them" },
    { t: "call a taxi for the bags", funny: "VIP bags! 🚕" },
    { t: "watch and eat popcorn", funny: "Very helpful, detective! 🍿" }
  ]},
  { s: "🎂 It's my friend's birthday next week.", opts: [
    { t: "buy a present" },
    { t: "bake a cake" },
    { t: "give her my old sock", funny: "A very... personal gift! 🧦" }
  ]},
  { s: "🥛 We haven't got any milk.", opts: [
    { t: "go to the shop" },
    { t: "drink orange juice instead" },
    { t: "ask a cow personally", funny: "Moo means yes! 🐄" }
  ]},
  { s: "🌑 It's dark in here.", opts: [
    { t: "turn on the light" },
    { t: "light ten candles" },
    { t: "wear sunglasses", funny: "In the dark? Stylish! 😎" }
  ]},
  { s: "🌧️ It's raining.", opts: [
    { t: "take an umbrella" },
    { t: "stay at home" },
    { t: "dance in the rain", funny: "Singin' in the rain! 💃" }
  ]},
  { s: "🧦 My room is a mess.", opts: [
    { t: "clean it" },
    { t: "hire ten robots", funny: "Robots, activate! 🤖" },
    { t: "close the door and forget it", funny: "Problem solved! 🚪" }
  ]},
  { s: "📚 There's a test tomorrow.", opts: [
    { t: "study tonight" },
    { t: "sleep and dream about it", funny: "Dream-studying! 💤" },
    { t: "bring my lucky sandwich", funny: "Sandwich power! 🥪" }
  ]}
];

let i = 0, stars = 0;
const app = document.getElementById('app');

function startScreen(){
  app.innerHTML = `
    <div class="emoji-row">🕵️🔍</div>
    <h1>Detective of the Year</h1>
    <p class="sub">10 tricky situations.<br>Choose your action, then say it: <b>I'll ...</b></p>
    <button class="btn big" onclick="showCase()">Start the investigation</button>
  `;
}

function dots(){
  let d = '';
  for(let k=0;k<cases.length;k++){
    d += `<div class="dot ${k<i?'done':''} ${k===i?'now':''}"></div>`;
  }
  return `<div class="dots">${d}</div>`;
}

function showCase(){
  const c = cases[i];
  const order = c.opts.map((o,idx)=>idx).sort(()=>Math.random()-.5);
  app.innerHTML = `
    ${dots()}
    <div class="case-tag">Case #${i+1} of ${cases.length}</div>
    <div class="situation">${c.s}</div>
    <div class="prompt">What will you do? Choose!</div>
    ${order.map(idx=>`<button class="btn" onclick="pick(${idx})">${c.opts[idx].t}</button>`).join('')}
  `;
}

function pick(idx){
  const c = cases[i];
  const o = c.opts[idx];
  const reaction = o.funny ? `<div class="reaction">${o.funny}</div>` : `<div class="reaction">Good choice, detective! 🔍</div>`;
  app.innerHTML = `
    ${dots()}
    <div class="case-tag">Case #${i+1} of ${cases.length}</div>
    <div class="situation">${c.s}</div>
    ${reaction}
    <div class="sentence-frame">I'll ______</div>
    <div class="prompt">Say your sentence out loud!</div>
    <div class="answer" id="ans"></div>
    <button class="btn" onclick="reveal('${o.t.replace(/'/g,"\\'")}')">🔎 Show the sentence</button>
    <button class="btn big" onclick="nextCase()">⭐ I said it!</button>
  `;
}

function reveal(action){
  document.getElementById('ans').innerHTML = `<span class="star-pop">I'll ${action}.</span>`;
}

function nextCase(){
  stars++;
  i++;
  if(i < cases.length) showCase(); else finalScreen();
}

function finalScreen(){
  let rank, emo;
  if(stars >= 10){ rank = 'Detective of the Year! 🏆'; emo = '🏆🕵️🔍'; }
  else if(stars >= 7){ rank = 'Super Detective!'; emo = '🕵️⭐'; }
  else { rank = 'Junior Detective!'; emo = '🔍😊'; }
  app.innerHTML = `
    <div class="emoji-row">${emo}</div>
    <h1>Case closed!</h1>
    <div class="score-big">⭐ ${stars} / ${cases.length}</div>
    <div class="rank">${rank}</div>
    <button class="btn big" onclick="restart()">Play again</button>
  `;
}

function restart(){ i = 0; stars = 0; startScreen(); }

startScreen();
</script>
</body>
</html>
