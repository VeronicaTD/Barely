<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detective of the Year</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Nunito', 'Segoe UI', sans-serif;
    background: linear-gradient(160deg, #e8f3ff 0%, #f3edff 60%, #e8f9ff 100%);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
  }
  .card {
    background: #ffffffcc;
    backdrop-filter: blur(6px);
    border-radius: 28px;
    box-shadow: 0 12px 40px rgba(106, 90, 205, .18);
    max-width: 640px; width: 100%;
    padding: 32px 28px;
    text-align: center;
  }
  h1, h2 {
    font-family: 'Caveat', 'Segoe Script', cursive;
    color: #5b4bb8;
    font-size: 44px;
    line-height: 1.1;
    margin-bottom: 8px;
  }
  .sub { color: #6b7a99; font-size: 18px; margin-bottom: 24px; }
  .case-tag {
    display: inline-block;
    background: #efeaff; color: #6a5acd;
    font-weight: 800; font-size: 16px;
    padding: 6px 18px; border-radius: 999px;
    margin-bottom: 16px;
  }
  .situation {
    background: #f0f7ff;
    border-left: 6px solid #7c9ff0;
    border-radius: 16px;
    padding: 22px 20px;
    font-size: 26px; font-weight: 800; color: #33415c;
    margin-bottom: 24px;
  }
  .btn {
    display: block; width: 100%;
    min-height: 68px;
    margin: 12px 0;
    padding: 14px 20px;
    font-family: inherit;
    font-size: 22px; font-weight: 700;
    color: #43356e;
    background: #ffffff;
    border: 3px solid #cfc4f5;
    border-radius: 18px;
    cursor: pointer;
    transition: transform .08s, background .15s, border-color .15s;
  }
  .btn:active { transform: scale(.97); }
  .btn:hover { background: #f6f2ff; border-color: #8f79e8; }
  .btn.big-start {
    background: linear-gradient(135deg, #7c6fd0, #5b9cf5);
    color: #fff; border: none;
    font-size: 26px; min-height: 80px;
    box-shadow: 0 8px 20px rgba(106, 90, 205, .35);
  }
  .btn.correct { background: #d9f8e3; border-color: #3bbf6e; color: #166534; }
  .btn.wrong { background: #ffe1e1; border-color: #ef6060; color: #991b1b; }
  .btn:disabled { cursor: default; opacity: .95; }
  .dots { display: flex; gap: 8px; justify-content: center; margin-bottom: 18px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: #dcd6f7; }
  .dot.done { background: #6a5acd; }
  .dot.now { background: #5b9cf5; transform: scale(1.25); }
  .feedback { min-height: 34px; font-size: 20px; font-weight: 800; margin: 6px 0 10px; }
  .feedback.ok { color: #15914f; }
  .feedback.no { color: #d43d3d; }
  .score-big { font-size: 64px; font-weight: 800; color: #6a5acd; margin: 8px 0; }
  .rank { font-size: 26px; font-weight: 800; color: #33415c; margin-bottom: 20px; }
  .emoji-row { font-size: 52px; margin-bottom: 6px; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="card" id="app"></div>

<script>
const cases = [
  { s: "📞 The phone's ringing.", a: "I'll answer it.", w: ["I answered it yesterday.", "I'll answering it."] },
  { s: "🛍️ These bags are heavy.", a: "I'll help you carry them.", w: ["I help you every day.", "I'll carried them."] },
  { s: "🍽️ It's your turn to do the washing-up.", a: "I'll do it in a minute.", w: ["I do it last week.", "I'll does it."] },
  { s: "✉️ I haven't got your e-mail address.", a: "I'll send it to you.", w: ["I send it yesterday.", "I'll sending it."] },
  { s: "🎂 It's Sally's birthday next week.", a: "I'll buy her a present.", w: ["I buy her a present last year.", "I'll buys a present."] },
  { s: "🥶 I'm cold.", a: "I'll close the window.", w: ["I closed it an hour ago.", "I'll closing the window."] },
  { s: "😋 I'm hungry!", a: "I'll make a sandwich.", w: ["I make one every day.", "I'll made a sandwich."] },
  { s: "🌑 It's dark in here.", a: "I'll turn on the light.", w: ["I turn it on yesterday.", "I'll turning on the light."] },
  { s: "🥛 We haven't got any milk.", a: "I'll go to the shop.", w: ["I went there this morning.", "I'll going to the shop."] },
  { s: "🚗 I can't take you in the car.", a: "I'll get the bus.", w: ["I get the bus yesterday.", "I'll getting the bus."] }
];

let i = 0, score = 0, locked = false;
const app = document.getElementById('app');

function shuffle(arr){ return arr.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(v=>v[1]); }

function startScreen(){
  app.innerHTML = `
    <div class="emoji-row">🕵️🔍</div>
    <h1>Detective of the Year</h1>
    <p class="sub">Solve 10 cases. Choose what the detective says: <b>I'll ...</b></p>
    <button class="btn big-start" onclick="showCase()">Start the investigation</button>
  `;
}

function dots(){
  let d = '';
  for(let k=0;k<cases.length;k++){
    d += `<div class="dot ${k<i?'done':''} ${k===i?'now':''}"></div>`;
  }
  return `<div class="dots">${d}</div>`;
}

function showCase(){
  locked = false;
  const c = cases[i];
  const opts = shuffle([{t:c.a, ok:true}, {t:c.w[0], ok:false}, {t:c.w[1], ok:false}]);
  app.innerHTML = `
    ${dots()}
    <div class="case-tag">Case #${i+1} of ${cases.length}</div>
    <div class="situation">${c.s}</div>
    <div class="feedback" id="fb"></div>
    ${opts.map((o,idx)=>`<button class="btn" id="b${idx}" onclick="pick(${idx},${o.ok})">${o.t}</button>`).join('')}
  `;
}

function pick(idx, ok){
  if(locked) return;
  locked = true;
  const fb = document.getElementById('fb');
  const btn = document.getElementById('b'+idx);
  const buttons = app.querySelectorAll('.btn');
  if(ok){
    score++;
    btn.classList.add('correct');
    fb.className = 'feedback ok';
    fb.textContent = ['Case solved! 🎉','Great deduction! ⭐','Elementary! 🔍','Brilliant! 💜'][Math.floor(Math.random()*4)];
  } else {
    btn.classList.add('wrong');
    fb.className = 'feedback no';
    fb.textContent = 'Not quite! The answer: ' + cases[i].a;
    buttons.forEach(b => { if(b.textContent === cases[i].a) b.classList.add('correct'); });
  }
  buttons.forEach(b => b.disabled = true);
  setTimeout(()=>{
    i++;
    if(i < cases.length) showCase(); else finalScreen();
  }, ok ? 1200 : 2600);
}

function finalScreen(){
  let rank, emo;
  if(score >= 9){ rank = 'Detective of the Year! 🏆'; emo = '🏆🕵️🔍'; }
  else if(score >= 7){ rank = 'Super Detective!'; emo = '🕵️⭐'; }
  else if(score >= 5){ rank = 'Good Detective!'; emo = '🔍😊'; }
  else { rank = 'Junior Detective — try again!'; emo = '🔎💪'; }
  app.innerHTML = `
    <div class="emoji-row">${emo}</div>
    <h1>Case closed!</h1>
    <div class="score-big">${score} / ${cases.length}</div>
    <div class="rank">${rank}</div>
    <button class="btn big-start" onclick="restart()">Play again</button>
  `;
}

function restart(){ i = 0; score = 0; startScreen(); }

startScreen();
</script>
</body>
</html>
