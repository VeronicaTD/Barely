<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detective of the Year</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Nunito', 'Segoe UI', sans-serif;
    background: linear-gradient(160deg, #e8f3ff 0%, #f3edff 60%, #e8f9ff 100%);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
  }
  .card {
    background: #ffffffcc;
    backdrop-filter: blur(6px);
    border-radius: 28px;
    box-shadow: 0 12px 40px rgba(106, 90, 205, .18);
    max-width: 640px; width: 100%;
    padding: 32px 28px;
    text-align: center;
  }
  h1 {
    font-family: 'Caveat', 'Segoe Script', cursive;
    color: #5b4bb8;
    font-size: 46px; line-height: 1.1; margin-bottom: 8px;
  }
  .sub { color: #6b7a99; font-size: 19px; margin-bottom: 24px; }
  .case-tag {
    display: inline-block;
    background: #efeaff; color: #6a5acd;
    font-weight: 800; font-size: 16px;
    padding: 6px 18px; border-radius: 999px;
    margin-bottom: 14px;
  }
  .situation {
    background: #f0f7ff;
    border-left: 6px solid #7c9ff0;
    border-radius: 16px;
    padding: 22px 20px;
    font-size: 28px; font-weight: 800; color: #33415c;
    margin-bottom: 8px;
  }
  .prompt { color: #8b7fd4; font-size: 18px; font-weight: 700; margin-bottom: 16px; }
  .btn {
    display: block; width: 100%;
    min-height: 70px;
    margin: 10px 0;
    padding: 12px 18px;
    font-family: inherit;
    font-size: 23px; font-weight: 700;
    color: #43356e;
    background: #ffffff;
    border: 3px solid #cfc4f5;
    border-radius: 18px;
    cursor: pointer;
    transition: transform .08s, background .15s, border-color .15s;
  }
  .btn:active { transform: scale(.97); }
  .btn:hover { background: #f6f2ff; border-color: #8f79e8; }
  .btn .em { font-size: 30px; margin-right: 10px; }
  .btn.big {
    background: linear-gradient(135deg, #7c6fd0, #5b9cf5);
    color: #fff; border: none;
    font-size: 26px; min-height: 78px;
    box-shadow: 0 8px 20px rgba(106, 90, 205, .35);
  }
  .btn.idea {
    border-style: dashed; color: #8b7fd4;
  }
  .choice-line {
    background: #e4dcff;
    border-radius: 14px;
    font-size: 24px; font-weight: 800; color: #43356e;
    padding: 14px 18px; margin-bottom: 12px;
  }
  .say-frame {
    font-family: 'Caveat', 'Segoe Script', cursive;
    font-size: 42px; color: #5b4bb8; margin: 6px 0 4px;
  }
  .answer {
    font-size: 30px; font-weight: 800; color: #15914f;
    min-height: 42px; margin: 8px 0;
  }
  .reaction {
    font-size: 26px; font-weight: 800; color: #d46a9e;
    min-height: 36px; margin: 8px 0;
  }
  .reaction .rem { font-size: 40px; display: block; margin-bottom: 4px; }
  .dots { display: flex; gap: 8px; justify-content: center; margin-bottom: 16px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: #dcd6f7; }
  .dot.done { background: #6a5acd; }
  .dot.now { background: #5b9cf5; transform: scale(1.25); }
  .toggle-row { margin-bottom: 18px; }
  .toggle-btn {
    font-family: inherit; font-size: 17px; font-weight: 800;
    background: #efeaff; color: #6a5acd;
    border: 2px solid #cfc4f5; border-radius: 999px;
    padding: 10px 22px; cursor: pointer;
  }
  .toggle-btn.on { background: #6a5acd; color: #fff; }
  .big-final { font-size: 34px; font-weight: 800; color: #33415c; margin: 10px 0 22px; }
  .emoji-row { font-size: 52px; margin-bottom: 6px; }
  .pop { display:inline-block; animation: pop .45s ease; }
  @keyframes pop { 0%{transform:scale(0);} 70%{transform:scale(1.25);} 100%{transform:scale(1);} }
</style>
</head>
<body>
<div class="card" id="app"></div>

<script>
const cases = [
  { s: "😋 I'm hungry.", opts: [
    { e:"🥪", t:"make you a sandwich" },
    { e:"🍕", t:"order a pizza" },
    { e:"👟", t:"give you a shoe", funny:"A shoe?! Really?" }
  ]},
  { s: "🥶 I'm cold.", opts: [
    { e:"🪟", t:"close the window" },
    { e:"🧥", t:"get you a jacket" },
    { e:"🍦", t:"give you some ice cream", funny:"More cold?!" }
  ]},
  { s: "📞 My phone's ringing.", opts: [
    { e:"📱", t:"get your phone" },
    { e:"🙋", t:"answer it for you" },
    { e:"🐱", t:"give it to the cat", funny:"Hello? Meow!" }
  ]},
  { s: "🛍️ These bags are heavy.", opts: [
    { e:"💪", t:"help you" },
    { e:"🚕", t:"call a taxi" },
    { e:"🐕", t:"get you ten tiny dogs", funny:"Ten dogs?! WOW!" }
  ]},
  { s: "🎂 It's Anna's birthday tomorrow.", opts: [
    { e:"🎁", t:"buy her a present" },
    { e:"🎂", t:"make her a cake" },
    { e:"🧦", t:"give her an old sock", funny:"An old sock?!" }
  ]},
  { s: "🥛 We haven't got any milk.", opts: [
    { e:"🥛", t:"buy some milk" },
    { e:"🧃", t:"get some juice" },
    { e:"🐄", t:"bring a cow", funny:"A cow in the kitchen?!" }
  ]},
  { s: "🌑 It's dark in here.", opts: [
    { e:"💡", t:"turn on the light" },
    { e:"🔦", t:"get a torch" },
    { e:"😎", t:"put on sunglasses", funny:"Now I can't see!" }
  ]},
  { s: "🌧️ It's raining.", opts: [
    { e:"☂️", t:"get an umbrella" },
    { e:"🚕", t:"call a taxi" },
    { e:"🛍️", t:"put a bag on my head", funny:"A bag hat?!" }
  ]},
  { s: "🧺 My room is a mess.", opts: [
    { e:"🧹", t:"help you clean it" },
    { e:"🤖", t:"get a robot" },
    { e:"🛏️", t:"hide everything under the bed", funny:"Don't look under the bed!" }
  ]},
  { s: "📚 We've got a test tomorrow.", opts: [
    { e:"📚", t:"study with you" },
    { e:"📖", t:"bring my book" },
    { e:"🥪", t:"bring my lucky sandwich", funny:"Good luck, sandwich!" }
  ]}
];

let i = 0, done = 0, hideWords = false;
const app = document.getElementById('app');

function startScreen(){
  app.innerHTML = `
    <div class="emoji-row">🕵️🔍</div>
    <h1>Detective of the Year</h1>
    <p class="sub">Your friend needs help.<br>Choose an action, then say it: <b>I'll ...</b></p>
    <div class="toggle-row">
      <button class="toggle-btn ${hideWords?'on':''}" onclick="toggleWords(this)">🙈 Hide the words</button>
    </div>
    <button class="btn big" onclick="showCase()">Start</button>
  `;
}

function toggleWords(btn){
  hideWords = !hideWords;
  if(btn) btn.classList.toggle('on', hideWords);
}

function dots(){
  let d = '';
  for(let k=0;k<cases.length;k++){
    d += `<div class="dot ${k<i?'done':''} ${k===i?'now':''}"></div>`;
  }
  return `<div class="dots">${d}</div>`;
}

function showCase(){
  const c = cases[i];
  const order = c.opts.map((o,idx)=>idx).sort(()=>Math.random()-.5);
  app.innerHTML = `
    ${dots()}
    <div class="case-tag">${i+1} / ${cases.length}</div>
    <div class="situation">${c.s}</div>
    <div class="prompt">What will you do?</div>
    ${order.map(idx=>`<button class="btn" onclick="pick(${idx})"><span class="em">${c.opts[idx].e}</span>${hideWords?'':c.opts[idx].t}</button>`).join('')}
    <button class="btn idea" onclick="pickIdea()">💡 My idea</button>
  `;
}

function pick(idx){
  const o = cases[i].opts[idx];
  showSay(o.e, o.t, o.funny || null, false);
}

function pickIdea(){
  showSay("💡", "my idea", "Great idea! ⭐", true);
}

function showSay(emoji, action, funny, isIdea){
  const c = cases[i];
  app.innerHTML = `
    ${dots()}
    <div class="case-tag">${i+1} / ${cases.length}</div>
    <div class="situation">${c.s}</div>
    <div class="choice-line">${emoji}${(hideWords||isIdea)?'':' '+action}</div>
    <div class="say-frame">I'll ______</div>
    <div class="prompt">Say it out loud!</div>
    ${isIdea ? '' : `<div class="answer" id="ans"></div>`}
    <div class="reaction" id="rea"></div>
    ${isIdea ? '' : `<button class="btn" onclick="reveal('${action.replace(/'/g,"\\'")}')">🔎 Show the sentence</button>`}
    <button class="btn big" onclick="happen('${(funny||'').replace(/'/g,"\\'")}', ${!!funny})">🎬 See what happens</button>
  `;
  window._next = false;
}

function reveal(action){
  document.getElementById('ans').innerHTML = `<span class="pop">I'll ${action}.</span>`;
}

function happen(funny, isFunny){
  const rea = document.getElementById('rea');
  rea.innerHTML = isFunny
    ? `<span class="pop">${funny}</span>`
    : `<span class="pop" style="color:#15914f">Good idea!</span>`;
  if(!window._next){
    window._next = true;
    const b = document.createElement('button');
    b.className = 'btn big';
    b.style.marginTop = '10px';
    b.textContent = 'Next →';
    b.onclick = nextCase;
    document.getElementById('app').appendChild(b);
  }
}

function nextCase(){
  done++;
  i++;
  if(i < cases.length) showCase(); else finalScreen();
}

function finalScreen(){
  app.innerHTML = `
    <div class="emoji-row">🎉🕵️🔍</div>
    <h1>Well done!</h1>
    <div class="big-final">${done} situations completed!</div>
    <button class="btn big" onclick="restart()">Play again</button>
  `;
}

function restart(){ i = 0; done = 0; startScreen(); }

startScreen();
</script>
</body>
</html>
