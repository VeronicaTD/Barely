<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gap Maker</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffe9ec;--ink:#2b2340;--card:#fff;--a:#ff7a8a;--b:#5bb8ff;--ok:#3cc47c;--gold:#ffc83d;--lil:#9b8cff;--mute:#8a7d99;--paper:#fffdf6;--line:#cfe3ff}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;font-family:'Baloo 2',system-ui,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
.screen{height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 18px;flex-wrap:wrap;flex:0 0 auto}
h1{margin:0;font-size:28px;font-weight:800}
.btn{font:inherit;font-size:19px;font-weight:700;border:0;border-radius:16px;padding:10px 18px;cursor:pointer;color:#fff;background:var(--lil);min-height:50px;box-shadow:0 4px 0 rgba(0,0,0,.12);transition:.15s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(1px);box-shadow:0 2px 0 rgba(0,0,0,.12)}
.btn.blue{background:var(--b)}.btn.pink{background:var(--a)}.btn.green{background:var(--ok)}.btn.gold{background:var(--gold);color:var(--ink)}.btn.soft{background:#fff;color:var(--ink)}
.btn.small{font-size:16px;padding:6px 14px;min-height:42px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
main{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:10px;padding:0 18px 14px;max-width:1240px;width:100%;margin:0 auto}
.card{background:#fff;border-radius:24px;padding:14px 18px;box-shadow:0 6px 18px rgba(43,35,64,.08)}
.tip{color:var(--mute);font-size:17px;margin:0 0 6px}
textarea{width:100%;flex:1;min-height:0;resize:none;font:inherit;font-size:21px;line-height:1.5;border:3px dashed #f3b3bd;border-radius:18px;padding:12px 16px;color:var(--ink);background:var(--paper);outline:none}
textarea:focus{border-color:var(--a)}
.tcard{flex:1;min-height:0;display:flex;flex-direction:column}
.pick{flex:1;min-height:0;overflow:auto;font-size:23px;line-height:1.9;background:var(--paper);border-radius:18px;padding:10px 18px}
.pick .ln{min-height:1.9em}
.pick .ln.blank{min-height:.9em}
.w{cursor:pointer;border-radius:10px;padding:0 3px;transition:.12s;user-select:none}
.w:hover{background:#ffe1e6}
.w.on{background:var(--gold);box-shadow:0 3px 0 #e0a800;font-weight:700}
.count{font-weight:800;color:var(--a)}
.toast{position:fixed;left:50%;top:80px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:16px;padding:10px 20px;font-size:18px;z-index:20;animation:pop .25s}

/* student */
.paper{flex:1 1 auto;min-height:0;overflow:auto;background:var(--paper);border-radius:24px;box-shadow:0 6px 18px rgba(43,35,64,.08);padding:18px 26px 18px 70px;position:relative;
  background-image:linear-gradient(90deg,transparent 54px,#ffb3c0 54px,#ffb3c0 57px,transparent 57px)}
.poem{font-size:27px;line-height:1.35}
.pl{display:flex;align-items:center;gap:6px;min-height:58px;border-bottom:2px solid var(--line);padding:4px 10px;border-radius:12px;position:relative;transition:background .2s}
.pl.blank{min-height:26px;border-bottom:0}
.pl.now{background:#fff3c4;box-shadow:inset 0 0 0 3px var(--gold)}
.pl .txt{flex:1;flex-wrap:wrap;display:flex;align-items:center;white-space:pre-wrap}
.lsay{position:absolute;left:-62px;width:44px;height:44px;border-radius:50%;border:0;background:#eef6ff;font-size:20px;cursor:pointer;opacity:0;pointer-events:none;transition:.2s}
.pl.full .lsay{opacity:1;pointer-events:auto}
.gap{display:inline-flex;align-items:center;justify-content:center;min-width:120px;height:48px;margin:0 4px;border:3px dashed var(--b);border-radius:14px;background:#eef6ff;color:#8fbfe6;font-weight:700;cursor:pointer;transition:.15s;padding:0 10px;vertical-align:middle}
.gap.hover,.gap.target{background:#dff0ff;border-style:solid;transform:scale(1.05)}
.gap.hint{color:var(--lil);border-color:var(--lil);background:#f3f0ff}
.gap.done{border:3px solid var(--ok);background:#e5f8ee;color:var(--ink);cursor:default;animation:pop .3s}
.bank{flex:0 0 auto;background:#fff;border-radius:24px;padding:10px 16px;box-shadow:0 6px 18px rgba(43,35,64,.08);display:flex;gap:10px;flex-wrap:wrap;justify-content:center;min-height:76px;align-items:center}
.bank .lbl{color:var(--mute);font-size:16px;width:100%;text-align:center;margin:-4px 0 0}
.chip{font:inherit;font-size:24px;font-weight:700;background:linear-gradient(180deg,#fff,#ffe1e6);border:3px solid var(--a);color:var(--ink);border-radius:16px;padding:4px 20px;min-height:54px;cursor:grab;touch-action:none;user-select:none;box-shadow:0 4px 0 #f3b3bd;transition:transform .15s}
.chip.sel{background:var(--gold);border-color:#e0a800;transform:translateY(-4px) scale(1.06)}
.chip.ghost{opacity:.3}
.chip.bounce{animation:bounce .55s}
.drag{position:fixed;z-index:30;pointer-events:none;transform:translate(-50%,-50%) rotate(-4deg) scale(1.1);box-shadow:0 10px 20px rgba(0,0,0,.2)}
@keyframes bounce{0%{transform:translateY(0)}25%{transform:translateY(-16px)}50%{transform:translateY(0)}70%{transform:translateY(-6px)}100%{transform:translateY(0)}}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.ov{position:fixed;inset:0;background:rgba(43,35,64,.5);display:flex;align-items:center;justify-content:center;padding:14px;z-index:15}
.modal{background:#fff;border-radius:28px;padding:26px 34px;text-align:center;animation:pop .3s;max-width:560px}
.modal h2{font-size:44px;margin:0 0 4px}
.modal p{font-size:21px;color:var(--mute);margin:0 0 16px}
.conf{position:fixed;top:-30px;font-size:28px;animation:fall linear forwards;pointer-events:none;z-index:40}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.left{font-size:18px;color:var(--mute);font-weight:700}
@media(max-width:760px){.poem{font-size:21px}.paper{padding:12px 12px 12px 58px}.gap{min-width:90px;height:42px}.chip{font-size:20px}h1{font-size:22px}}
</style>
</head>
<body>

<!-- TEACHER -->
<section class="screen" id="teacher">
  <header>
    <h1>✏️ Gap Maker</h1>
    <div class="row">
      <button class="btn soft small" id="copyBtn">🔗 Copy game link</button>
      <button class="btn green" id="startBtn">Start game ▶</button>
    </div>
  </header>
  <main>
    <div class="card tcard" id="step1">
      <p class="tip">1. Paste the text here (empty line = new stanza), then press <b>Make gaps</b>.</p>
      <textarea id="src" spellcheck="false"></textarea>
      <div class="row" style="margin-top:10px"><button class="btn pink" id="makeBtn">Make gaps ✂️</button></div>
    </div>
    <div class="card tcard" id="step2" hidden>
      <div class="row" style="justify-content:space-between;margin-bottom:6px">
        <p class="tip" style="margin:0">2. Click words to hide them. Gaps: <span class="count" id="cnt">0</span></p>
        <div class="row">
          <button class="btn gold small" id="autoBtn">✨ Auto: hide feelings words</button>
          <button class="btn soft small" id="clearBtn">Clear gaps</button>
          <button class="btn soft small" id="backBtn">← Change text</button>
        </div>
      </div>
      <div class="pick" id="pick"></div>
    </div>
  </main>
</section>

<!-- STUDENT -->
<section class="screen" id="student" hidden>
  <header>
    <h1>📝 Fill the Gaps</h1>
    <div class="row">
      <span class="left" id="left"></span>
      <button class="btn blue" id="readBtn">🔊 Read the poem</button>
      <button class="btn soft small" id="editBtn">✏️ Edit</button>
    </div>
  </header>
  <main>
    <div class="paper" id="paper"><div class="poem" id="poem"></div></div>
    <div class="bank" id="bank"></div>
  </main>
</section>

<div class="ov" id="win" hidden><div class="modal">
  <h2>🎉 Well done!</h2>
  <p>All the gaps are full!</p>
  <div class="row" style="justify-content:center">
    <button class="btn blue" id="togetherBtn">🔊 Read it together</button>
    <button class="btn soft" id="closeWin">Close</button>
  </div>
</div></div>

<script>
(function(){
var SAMPLE="When I am happy, I jump and I sing,\nI feel like a bird with a bright yellow wing.\nWhen I am sad, I sit by the door\nAnd count all the raindrops that fall on the floor.\n\nWhen I am nervous, my tummy goes flip,\nI hold someone's hand and I bite my lip.\nWhen I am brave, I stand up tall,\nI am not scared of anything at all!";
var FEEL=['happy','sad','nervous','bad','good','brave','scared','angry','tired','hot','cold','hungry','thirsty'];
var KEY='gapMakerV1';
var state={t:SAMPLE,g:[]};
var $=function(id){return document.getElementById(id)};

/* ---------- parsing ---------- */
var WORD=/([A-Za-z0-9]+(?:['’-][A-Za-z0-9]+)*)/;
function parse(text){
  var lines=text.replace(/\r/g,'').split('\n'), out=[], id=0;
  lines.forEach(function(l){
    var parts=l.split(WORD), toks=[];
    parts.forEach(function(p,i){ if(!p)return; if(i%2===1){toks.push({w:p,id:id++})}else toks.push({s:p}) });
    out.push(toks);
  });
  return out;
}

/* ---------- storage ---------- */
function enc(o){return btoa(unescape(encodeURIComponent(JSON.stringify(o))))}
function dec(s){return JSON.parse(decodeURIComponent(escape(atob(s))))}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}
  try{history.replaceState(null,'','#g='+enc(state))}catch(e){}
}
function load(){
  var h=location.hash||'';
  if(h.indexOf('#g=')===0){try{var o=dec(h.slice(3));if(o&&typeof o.t==='string'){state={t:o.t,g:o.g||[]};return 'hash'}}catch(e){}}
  try{var s=localStorage.getItem(KEY);if(s){var o2=JSON.parse(s);if(o2&&typeof o2.t==='string'){state={t:o2.t,g:o2.g||[]};return 'ls'}}}catch(e){}
  return null;
}
function link(){return location.href.split('#')[0]+'#g='+enc(state)}

/* ---------- teacher ---------- */
function showTeacher(){stopRead();$('student').hidden=true;$('teacher').hidden=false;$('src').value=state.t;
  if(state.g.length){renderPick();$('step1').hidden=true;$('step2').hidden=false}else{$('step1').hidden=false;$('step2').hidden=true}}
function renderPick(){
  var lines=parse(state.t), box=$('pick'), set={};state.g.forEach(function(i){set[i]=1});
  box.innerHTML='';
  lines.forEach(function(toks){
    var d=document.createElement('div');d.className='ln'+(toks.length?'':' blank');
    toks.forEach(function(t){
      if(t.s!=null){d.appendChild(document.createTextNode(t.s));return}
      var sp=document.createElement('span');sp.className='w'+(set[t.id]?' on':'');sp.textContent=t.w;
      sp.onclick=function(){var k=state.g.indexOf(t.id);if(k<0)state.g.push(t.id);else state.g.splice(k,1);sp.classList.toggle('on');upd()};
      d.appendChild(sp);
    });
    box.appendChild(d);
  });
  upd();
}
function upd(){$('cnt').textContent=state.g.length;save()}
$('makeBtn').onclick=function(){
  var t=$('src').value.replace(/\s+$/,'');
  if(!t.trim()){toast('Paste some text first 🙂');return}
  if(t!==state.t){state.t=t;state.g=[]}
  renderPick();$('step1').hidden=true;$('step2').hidden=false;
};
$('backBtn').onclick=function(){$('src').value=state.t;$('step2').hidden=true;$('step1').hidden=false};
$('clearBtn').onclick=function(){state.g=[];renderPick()};
$('autoBtn').onclick=function(){
  var n=0;parse(state.t).forEach(function(toks){toks.forEach(function(t){
    if(t.w&&FEEL.indexOf(t.w.toLowerCase())>=0&&state.g.indexOf(t.id)<0){state.g.push(t.id);n++}})});
  renderPick();toast(n?('✨ '+n+' feelings words hidden'):'No new feelings words found');
};
$('copyBtn').onclick=function(){
  if(!$('step1').hidden){var t=$('src').value.replace(/\s+$/,'');if(t&&t!==state.t){state.t=t;state.g=[]}}
  save();var L=link();
  function fb(){try{var ta=document.createElement('textarea');ta.value=L;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('🔗 Link copied!')}catch(e){window.prompt('Copy this link:',L)}}
  try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(L).then(function(){toast('🔗 Link copied!')},fb)}else fb()}catch(e){fb()}
};
$('startBtn').onclick=function(){
  if(!$('step1').hidden){var t=$('src').value.replace(/\s+$/,'');if(!t.trim()){toast('Paste some text first 🙂');return}if(t!==state.t){state.t=t;state.g=[]}}
  if(!state.g.length){renderPick();$('step1').hidden=true;$('step2').hidden=false;toast('Click some words to make gaps first');return}
  save();startGame();
};
function toast(m){var o=document.querySelector('.toast');if(o)o.remove();var d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(function(){d.remove()},2200)}

/* ---------- student ---------- */
var lineEls=[], lineTexts=[], gapsLeft=0, selChip=null;
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=a[i];a[i]=a[j];a[j]=x}return a}
function norm(w){return w.toLowerCase().replace(/’/g,"'")}
function chipText(w){return /^I('|’|$)/.test(w)?w:w.toLowerCase()}
function startGame(){
  stopRead();$('teacher').hidden=true;$('student').hidden=false;$('win').hidden=true;
  var lines=parse(state.t), set={}, words=[];state.g.forEach(function(i){set[i]=1});
  var poem=$('poem');poem.innerHTML='';lineEls=[];lineTexts=[];gapsLeft=0;selChip=null;
  lines.forEach(function(toks,li){
    var row=document.createElement('div'), txt=document.createElement('div'), plain='';
    row.className='pl'+(toks.length&&toks.some(function(t){return (t.w||t.s||'').trim()})?'':' blank');
    txt.className='txt';
    var b=document.createElement('button');b.className='lsay';b.textContent='🔊';b.title='Read this line';
    b.onclick=function(){readLines([li])};
    row.appendChild(b);
    toks.forEach(function(t){
      if(t.s!=null){txt.appendChild(document.createTextNode(t.s));plain+=t.s;return}
      plain+=t.w;
      if(set[t.id]){
        var g=document.createElement('span');g.className='gap';g.dataset.ans=t.w;g.innerHTML='&nbsp;';
        g.onclick=function(){if(selChip&&!g.classList.contains('done'))tryPlace(selChip,g)};
        txt.appendChild(g);words.push(t.w);gapsLeft++;
      }else txt.appendChild(document.createTextNode(t.w));
    });
    row.appendChild(txt);poem.appendChild(row);lineEls.push(row);lineTexts.push(plain);
    checkLine(row);
  });
  var bank=$('bank');bank.innerHTML='';
  shuffle(words).forEach(function(w){var c=document.createElement('div');c.className='chip';c.textContent=chipText(w);c.dataset.w=w;bindChip(c);bank.appendChild(c)});
  $('paper').scrollTop=0;updLeft();
}
function updLeft(){$('left').textContent=gapsLeft?('Gaps: '+gapsLeft):'⭐ All done'}
function checkLine(row){if(row.classList.contains('blank'))return;if(!row.querySelector('.gap:not(.done)'))row.classList.add('full')}
function select(c){if(selChip)selChip.classList.remove('sel');selChip=(selChip===c)?null:c;if(selChip)selChip.classList.add('sel');
  document.querySelectorAll('.gap').forEach(function(g){g.classList.toggle('target',!!selChip&&!g.classList.contains('done'))})}
function tryPlace(chip,gap){
  document.querySelectorAll('.gap.target').forEach(function(g){g.classList.remove('target')});
  if(selChip){selChip.classList.remove('sel');selChip=null}
  if(norm(chip.dataset.w)===norm(gap.dataset.ans)){
    gap.className='gap done';gap.textContent=gap.dataset.ans;chip.remove();gapsLeft--;updLeft();
    var row=gap.closest('.pl');checkLine(row);
    if(row.classList.contains('full'))readLines([lineEls.indexOf(row)]);else speak(gap.dataset.ans);
    if(!gapsLeft)setTimeout(win,1400);
  }else{
    chip.classList.remove('bounce');void chip.offsetWidth;chip.classList.add('bounce');
    var a=gap.dataset.ans;gap.classList.add('hint');gap.textContent=a.charAt(0).toLowerCase()==='i'&&a.length===1?'I':a.charAt(0)+' …';
  }
}
function bindChip(c){
  c.addEventListener('pointerdown',function(e){
    if(e.button>0)return;e.preventDefault();
    var sx=e.clientX,sy=e.clientY,ghost=null,over=null;
    function mv(ev){
      if(!ghost&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>8){ghost=c.cloneNode(true);ghost.classList.add('drag');ghost.classList.remove('sel');document.body.appendChild(ghost);c.classList.add('ghost')}
      if(!ghost)return;ghost.style.left=ev.clientX+'px';ghost.style.top=ev.clientY+'px';
      var el=document.elementFromPoint(ev.clientX,ev.clientY),g=el&&el.closest?el.closest('.gap:not(.done)'):null;
      if(over&&over!==g)over.classList.remove('hover');over=g;if(g)g.classList.add('hover');
    }
    function up(){
      document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);document.removeEventListener('pointercancel',up);
      if(over)over.classList.remove('hover');
      if(ghost){ghost.remove();c.classList.remove('ghost');if(over)tryPlace(c,over);else{c.classList.remove('bounce');void c.offsetWidth;c.classList.add('bounce')}}
      else select(c);
    }
    document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);document.addEventListener('pointercancel',up);
  });
}

/* ---------- speech ---------- */
var voice=null, reading=false, token=0;
function pickVoice(){try{var v=speechSynthesis.getVoices();voice=v.filter(function(x){return x.lang==='en-GB'||x.lang==='en_GB'})[0]||null}catch(e){}}
if(window.speechSynthesis){pickVoice();try{speechSynthesis.onvoiceschanged=pickVoice}catch(e){}}
function fix(t){return t.replace(/\blive\b/gi,'liv').replace(/\blives\b/gi,'livs')}
function utter(t,end){
  if(!window.speechSynthesis){end&&end();return}
  try{var u=new SpeechSynthesisUtterance(fix(t));u.lang='en-GB';u.rate=.85;if(voice)u.voice=voice;
    var done=false;function fin(){if(done)return;done=true;end&&end()}
    u.onend=fin;u.onerror=fin;speechSynthesis.speak(u);
    setTimeout(function(){if(!done&&!speechSynthesis.speaking)fin()},Math.max(4000,t.length*160));
  }catch(e){end&&end()}
}
function speak(t){stopRead();utter(t)}
function stopRead(){token++;reading=false;try{window.speechSynthesis&&speechSynthesis.cancel()}catch(e){}
  lineEls.forEach(function(r){r.classList.remove('now')});$('readBtn').textContent='🔊 Read the poem'}
function readLines(idx){
  stopRead();var my=token,k=0;reading=true;
  if(idx.length>1)$('readBtn').textContent='⏹ Stop';
  function next(){
    if(my!==token)return;
    lineEls.forEach(function(r){r.classList.remove('now')});
    while(k<idx.length&&!lineTexts[idx[k]].trim())k++;
    if(k>=idx.length){reading=false;$('readBtn').textContent='🔊 Read the poem';return}
    var i=idx[k++],row=lineEls[i];row.classList.add('now');
    try{row.scrollIntoView({block:'nearest',behavior:'smooth'})}catch(e){}
    utter(lineTexts[i],function(){setTimeout(next,250)});
  }
  next();
}
function all(){return lineTexts.map(function(_,i){return i})}
$('readBtn').onclick=function(){if(reading){stopRead();return}readLines(all())};
$('editBtn').onclick=showTeacher;

/* ---------- win ---------- */
function win(){
  $('win').hidden=false;
  var e=['🎉','⭐','🌈','💖','✨','🎈'];
  for(var i=0;i<40;i++){var d=document.createElement('div');d.className='conf';d.textContent=e[i%e.length];
    d.style.left=Math.random()*100+'vw';d.style.animationDuration=(2+Math.random()*2.5)+'s';d.style.animationDelay=Math.random()*.8+'s';
    document.body.appendChild(d);(function(x){setTimeout(function(){x.remove()},5500)})(d)}
}
$('togetherBtn').onclick=function(){$('win').hidden=true;readLines(all())};
$('closeWin').onclick=function(){$('win').hidden=true};

/* ---------- init ---------- */
var src=load();
if(src==='hash'&&state.g.length){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}startGame()}
else showTeacher();
})();
</script>
</body>
</html>
