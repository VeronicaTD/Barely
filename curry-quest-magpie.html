<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curry Quest — Get past the magpie!</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaf6e4;--ink:#2b2340;--grass:#8fd06b;--path:#f3d9a4;--ok:#3cc47c;--no:#ff7a7a;--gold:#ffc83d;--lav:#9b8cff;--mut:#7a7090;--card:#fff}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:'Baloo 2',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;flex-wrap:wrap}
h1{margin:0;font-size:clamp(20px,3.4vw,30px);font-weight:800}
.hs{margin-left:auto;display:flex;gap:8px}
.pill{background:#fff;border-radius:14px;padding:3px 14px;font-size:18px;font-weight:700;border:0}
.wrap{max-width:1000px;margin:0 auto;padding:0 12px 16px}
/* map */
.map{position:relative;background:var(--grass);border-radius:24px;height:150px;overflow:hidden;box-shadow:0 5px 0 #6fb24c}
.road{position:absolute;left:4%;right:4%;top:92px;height:22px;background:var(--path);border-radius:11px}
.st{position:absolute;top:18px;transform:translateX(-50%);text-align:center;font-size:clamp(28px,5vw,42px);line-height:1}
.st small{display:block;font-size:clamp(10px,1.6vw,14px);font-weight:800;background:#ffffffcc;border-radius:8px;padding:0 6px;margin-top:2px;white-space:nowrap}
.walk{position:absolute;top:80px;transform:translateX(-50%);font-size:clamp(30px,5vw,40px);transition:left .9s ease;z-index:2;white-space:nowrap}
.walk.hop{animation:hop .45s 2}
@keyframes hop{50%{transform:translate(-50%,-14px)}}
.mag{position:absolute;font-size:44px;z-index:3;left:50%;top:-60px;transition:none;pointer-events:none}
.mag.swoop{animation:swoop 1.1s ease-in-out}
@keyframes swoop{0%{top:-60px;transform:translateX(-120px) rotate(-20deg)}50%{top:60px;transform:translateX(0) rotate(15deg)}100%{top:-60px;transform:translateX(140px) rotate(-10deg)}}
.dots{display:flex;gap:5px;justify-content:center;margin:10px 0 4px;flex-wrap:wrap}
.dots i{width:14px;height:14px;border-radius:50%;background:#d6e8cc}
.dots i.st1{background:var(--gold)}.dots i.st0{background:#b9c7b0}.dots i.cur{background:var(--lav)}
/* card */
.card{background:#fff;border-radius:24px;padding:16px 18px;margin-top:8px;box-shadow:0 5px 0 #cfe3c4}
.place{font-size:16px;font-weight:800;color:var(--mut)}
.scene{display:flex;gap:14px;align-items:center;margin:6px 0 10px}
.emo{font-size:clamp(48px,9vw,72px);line-height:1;flex:none}
.cap{font-size:clamp(18px,3vw,23px);font-weight:700;background:#fff8e1;border-radius:16px;padding:6px 14px}
.q{font-size:clamp(24px,4.6vw,34px);font-weight:800;text-align:center;margin:6px 0 10px}
.q .ask{color:var(--lav)}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.big{border:0;border-radius:18px;font-size:clamp(18px,3vw,22px);font-weight:800;padding:8px 18px;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.b-l{background:var(--lav)}.b-show{background:#5bb8ff}.b-ok{background:var(--ok)}.b-no{background:var(--no)}.b-go{background:#ff9f43}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.opt{border:3px solid #e4eedd;background:#fff;border-radius:16px;font-size:clamp(17px,3vw,21px);font-weight:700;padding:10px 8px;color:var(--ink)}
.opt.right{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{opacity:.35;text-decoration:line-through}
.model{display:none;text-align:center;font-size:clamp(20px,3.6vw,26px);font-weight:800;color:#1d7a47;background:#e4f8ec;border-radius:14px;padding:6px 12px;margin-top:10px}
.robot{display:flex;align-items:center;gap:8px;justify-content:center;margin-top:10px;font-size:20px;font-weight:700;min-height:34px}
.robot span{background:#eef0ff;border-radius:14px;padding:2px 14px}
.robot span:empty{display:none}
.ov{position:fixed;inset:0;background:rgba(43,35,64,.55);display:flex;align-items:center;justify-content:center;padding:14px;z-index:20}
.modal{background:#fff;border-radius:28px;width:min(560px,100%);padding:22px 24px;text-align:center}
.modal h2{margin:0;font-size:clamp(30px,6vw,44px);line-height:1.1}
.modal p{font-size:20px;color:var(--mut);font-weight:700;margin:8px 0}
.modal .e{font-size:56px}
.conf{position:fixed;top:-30px;font-size:26px;animation:fall linear forwards;pointer-events:none;z-index:30}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media(max-width:560px){.st small{font-size:9px;padding:0 3px}.map{height:130px}.road{top:84px}.walk{top:72px}.scene{flex-direction:column;text-align:center}}
</style>
</head>
<body>
<header>
  <h1>🍛 Curry Quest: Get past the magpie!</h1>
  <div class="hs"><span class="pill">⭐ <b id="stars">0</b></span><button class="pill" id="snd">🔊</button><button class="pill" id="restart">↺</button></div>
</header>
<div class="wrap">
  <div class="map" id="map">
    <div class="road"></div>
    <div class="mag" id="mag">🐦</div>
    <div class="walk" id="walk">🐕🐶</div>
  </div>
  <div class="dots" id="dots"></div>
  <div class="card">
    <div class="place" id="place"></div>
    <div class="scene"><div class="emo" id="emo"></div><div class="cap" id="cap"></div></div>
    <div class="q" id="q"></div>
    <div id="area"></div>
    <div class="model" id="model"></div>
    <div class="robot">🤖 <span id="rb"></span></div>
    <div class="row"><button class="big b-go" id="next" hidden>Next ▶</button></div>
  </div>
</div>

<div class="ov" id="startOv"><div class="modal">
  <div class="e">🏠 🌳🐦 🏡</div>
  <h2>Curry Quest</h2>
  <p>Take the naan to Mackenzie's house — and come back!</p>
  <button class="big b-go" id="start" style="font-size:28px;padding:10px 34px">Start ▶</button>
</div></div>
<div class="ov" id="endOv" hidden><div class="modal">
  <div class="e">🦸🐯</div>
  <h2>You're my hero!</h2>
  <p id="endP"></p>
  <button class="big b-go" id="again">Play again ▶</button>
</div></div>

<script>
/* stations along the road (percent) */
var ST=[{e:'🏠',n:'Home',x:8},{e:'🚏',n:'Bus stop',x:26},{e:'🌳',n:'Park',x:44},{e:'🏡',n:"Mackenzie's",x:62},{e:'🌳',n:'Park',x:80},{e:'🏠',n:'Home',x:94}];
/* t: say = robot asks, child answers; ask = child asks the question; choose = tap the answer */
var Q=[
 {s:0,emo:'🍛',cap:"Dad has a curry for Mackenzie's dad.",t:'choose',q:'Who carries the naan?',opts:['Bingo','Bluey','Mum'],a:0,model:'Bingo carries the naan.'},
 {s:0,emo:'🎨',cap:"Dad: Mackenzie's mum has face paints!",t:'say',q:'Is Bingo happy now?',model:'Yes, she is.'},
 {s:1,emo:'🦵',cap:'Dad: You only get to use one leg! Bingo hops and laughs.',t:'say',q:'Is Bingo sad?',model:"No, she isn't. She's happy."},
 {s:1,emo:'👒',cap:'Doreen: The magpie swooped me! Look at my hat!',t:'choose',q:'Who has a hole in her hat?',opts:['Doreen','Bingo',"Mackenzie's mum"],a:0,model:'Doreen has a hole in her hat.'},
 {s:2,emo:'🏃‍♂️',cap:'The magpie swoops Winton. He runs away and screams!',t:'say',q:'Is Winton scared?',model:'Yes, he is.'},
 {s:2,emo:'🥚',cap:'Dad: He thinks we want to hurt his eggs.',t:'ask',show:'😠',who:'the magpie',model:'Is he angry?',reply:'Yes, he is. He is a good dad.'},
 {s:2,emo:'💨',cap:'Bingo falls. The magpie swoops! They run!',t:'say',q:'Are Bingo and Dad scared?',model:'Yes, they are.'},
 {s:3,emo:'🖌️',cap:"Mackenzie's mum: I'm not very good, I'm afraid.",t:'say',q:"Is Mackenzie's mum nervous?",model:'Yes, she is.'},
 {s:3,emo:'✈️',cap:'Dad is going away for six weeks. Bingo sits on the kerb.',t:'ask',show:'😢',who:'Bingo',model:'Is she sad?',reply:'Yes, she is.'},
 {s:3,emo:'🐯',cap:'Bingo has a tiger face! Grrr!',t:'say',q:'Is Bingo sad now?',model:"No, she isn't. She's happy."},
 {s:4,emo:'🙂',cap:'Faces on the back of their heads!',t:'choose',q:"Why doesn't the magpie swoop?",opts:['He sees the faces. 🙂','He is tired. 😴','He is hungry. 🪱'],a:0,model:'He sees the faces. He thinks they are looking at him.'},
 {s:5,emo:'🦸',cap:"Dad: You're my hero, Bingo.",t:'say',q:'Is Bingo brave?',model:'Yes, she is.'},
 {s:5,emo:'🧒',cap:'Your turn!',t:'say',q:'Are you brave?',model:"Yes, I am. / No, I'm not."},
 {s:5,emo:'🐦',cap:'Your turn!',t:'say',q:'Are you scared of birds?',model:"Yes, I am. / No, I'm not."}
];

/* ---------- voice: Gemini via the shared Supabase proxy, browser voice as fallback ---------- */
var AI_PROXY="https://fnmxgojqdenmtobzlnhi.supabase.co/functions/v1/gemini",TTS_MODEL="gemini-2.5-flash-preview-tts",TTS_VOICE="Puck";
var sound=true,VOICE=null,AC=null,curSrc=null,spTok=0,aiVoice=true,aiFails=0,cache={};
function pickVoice(){if(!window.speechSynthesis)return;var vs=speechSynthesis.getVoices(),gb=vs.filter(function(v){return /en[-_]GB/i.test(v.lang)});
 VOICE=gb.find(function(v){return /\bmale|daniel|george|ryan|arthur|oliver|thomas|google uk english male/i.test(v.name)&&!/female/i.test(v.name)})||gb[0]||null}
if(window.speechSynthesis){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function ensureAC(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}
function clean(t){return t.replace(/[^\w\s',.!?\-]/g,' ').replace(/\s+/g,' ').trim()}
function tts(t){
 if(cache[t])return cache[t];
 var p=new Promise(function(ok,bad){
  if(!AC||!aiVoice){bad();return}
  var ctl=new AbortController(),to=setTimeout(function(){ctl.abort()},12000);
  fetch(AI_PROXY+'?forceFunctionRegion=us-east-1&model='+TTS_MODEL,{method:'POST',headers:{'Content-Type':'application/json'},signal:ctl.signal,
   body:JSON.stringify({model:TTS_MODEL,contents:[{parts:[{text:'Say in a warm, friendly British English accent, clearly and slowly, for a young child: '+t}]}],
    generationConfig:{responseModalities:['AUDIO'],speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:TTS_VOICE}}}}})})
  .then(function(r){return r.json().then(function(j){
    var part=j&&j.candidates&&j.candidates[0].content.parts.filter(function(x){return x.inlineData})[0];if(!r.ok||!part)throw 0;
    var rate=+((/rate=(\d+)/.exec(part.inlineData.mimeType)||[0,24000])[1]),bin=atob(part.inlineData.data),n=bin.length>>1,buf=AC.createBuffer(1,n,rate),ch=buf.getChannelData(0);
    for(var i=0;i<n;i++){var v=bin.charCodeAt(2*i)|(bin.charCodeAt(2*i+1)<<8);if(v&0x8000)v-=0x10000;ch[i]=v/32768}return buf})})
  .then(function(b){clearTimeout(to);aiFails=0;ok(b)},function(){clearTimeout(to);delete cache[t];if(++aiFails>=2)aiVoice=false;bad()});
 });
 cache[t]=p;return p;
}
function prefetch(t){if(t)tts(clean(t)).catch(function(){})}
function stopSpeech(){spTok++;try{curSrc&&curSrc.stop()}catch(e){}curSrc=null;if(window.speechSynthesis)speechSynthesis.cancel()}
function browserLine(t,cb){if(!window.speechSynthesis){setTimeout(cb,300);return}var u=new SpeechSynthesisUtterance(t),f=false;function c(){if(!f){f=true;cb()}}
 u.lang='en-GB';u.rate=.88;if(VOICE)u.voice=VOICE;u.onend=c;u.onerror=c;speechSynthesis.speak(u);setTimeout(c,1500+t.length*95)}
function line(t,tok,cb){if(tok!==spTok){cb();return}
 tts(t).then(function(buf){if(tok!==spTok){cb();return}var s=AC.createBufferSource(),f=false;function c(){if(!f){f=true;cb()}}
  s.buffer=buf;s.connect(AC.destination);s.onended=c;curSrc=s;s.start();setTimeout(c,buf.duration*1000+700)},
 function(){if(tok===spTok)browserLine(t,cb);else cb()})}
function say(lines,done){lines=[].concat(lines).map(clean).filter(Boolean);var fired=false;function fin(){if(!fired){fired=true;done&&done()}}
 if(!sound||!lines.length){setTimeout(fin,300);return}stopSpeech();var tok=spTok,i=0;(function nx(){if(i>=lines.length||tok!==spTok){fin();return}line(lines[i++],tok,nx)})()}

/* ---------- game ---------- */
var $=function(i){return document.getElementById(i)},step=0,stars=0,res=[],tries=0,done=false;
function drawMap(){var m=$('map');[].slice.call(m.querySelectorAll('.st')).forEach(function(x){x.remove()});
 ST.forEach(function(s){var d=document.createElement('div');d.className='st';d.style.left=s.x+'%';d.innerHTML=s.e+'<small>'+s.n+'</small>';m.appendChild(d)})}
function walkerX(i){/* spread questions of one station between it and the next */
 var q=Q[Math.min(i,Q.length-1)],same=Q.filter(function(x){return x.s===q.s}),k=same.indexOf(q),a=ST[q.s].x,b=q.s<ST.length-1?ST[q.s+1].x:a;
 if(i>=Q.length)return ST[ST.length-1].x;return a+(b-a)*(k/(same.length))}
function paintDots(){var h='';for(var i=0;i<Q.length;i++)h+='<i class="'+(i<res.length?(res[i]?'st1':'st0'):i===step?'cur':'')+'"></i>';$('dots').innerHTML=h;$('stars').textContent=stars}
function swoop(){var m=$('mag');m.style.left=walkerX(step)+'%';m.classList.remove('swoop');void m.offsetWidth;m.classList.add('swoop')}
function confetti(n){var e=['⭐','🎉','✨','🐯'];for(var i=0;i<n;i++){var s=document.createElement('div');s.className='conf';s.textContent=e[i%e.length];s.style.left=Math.random()*100+'vw';s.style.animationDuration=(1.5+Math.random()*1.5)+'s';document.body.appendChild(s);setTimeout(function(x){x.remove()}.bind(null,s),3400)}}

function show(){
 done=false;tries=0;var q=Q[step];
 $('walk').style.left=walkerX(step)+'%';paintDots();
 $('place').textContent=ST[q.s].e+' '+ST[q.s].n+' · '+(step+1)+' / '+Q.length;
 $('emo').textContent=q.emo;$('cap').textContent=q.cap;
 $('model').style.display='none';$('model').textContent=q.model;$('rb').textContent='';$('next').hidden=true;
 var A=$('area');A.innerHTML='';
 if(q.t==='ask'){
  $('q').innerHTML='<span class="ask">Ask about '+q.who+':</span> '+q.show+' ?';
  A.innerHTML='<div class="row"><button class="big b-l" id="hear">🔊</button><button class="big b-show" id="sh">👀 Answer</button><button class="big b-ok" id="ok">✓</button><button class="big b-no" id="no">✗</button></div>';
  say([q.cap,'Ask about '+q.who+'!']);
  $('hear').onclick=function(){say([q.cap,'Ask about '+q.who+'!'])};
 }else{
  $('q').textContent=q.q;
  if(q.t==='choose'){
   A.innerHTML='<div class="opts" id="opts"></div><div class="row"><button class="big b-l" id="hear">🔊</button></div>';
   q.opts.forEach(function(o,i){var b=document.createElement('button');b.className='opt';b.textContent=o;
    b.onclick=function(){if(done||b.classList.contains('wrong'))return;if(i===q.a){b.classList.add('right');good()}else{b.classList.add('wrong');bad()}};$('opts').appendChild(b)});
  }else{
   A.innerHTML='<div class="row"><button class="big b-l" id="hear">🔊</button><button class="big b-show" id="sh">👀 Answer</button><button class="big b-ok" id="ok">✓</button><button class="big b-no" id="no">✗</button></div>';
  }
  say([q.cap,q.q]);
  $('hear').onclick=function(){say([q.cap,q.q])};
 }
 if($('sh'))$('sh').onclick=function(){$('model').style.display='block';say(q.model)};
 if($('ok'))$('ok').onclick=function(){if(!done)good()};
 if($('no'))$('no').onclick=function(){if(!done)bad()};
 prefetch(q.model);if(q.reply)prefetch(q.reply);
 if(Q[step+1])prefetch(Q[step+1].cap);
}
function good(){
 done=true;var q=Q[step],first=tries===0;res.push(first);if(first)stars++;
 $('model').style.display='block';
 var w=$('walk');w.classList.remove('hop');void w.offsetWidth;w.classList.add('hop');
 if(q.t==='ask'){$('rb').textContent=q.reply;say([q.reply])}else{$('rb').textContent=first?'Great!':'Good!';say([first?'Great!':'Good!',q.t==='choose'?q.model:''])}
 if(first)confetti(8);
 [].forEach.call(document.querySelectorAll('#area button:not(#hear)'),function(b){b.disabled=true});
 $('next').hidden=false;paintDots();
}
function bad(){
 tries++;swoop();
 if(tries>=2){done=true;res.push(false);$('model').style.display='block';$('rb').textContent='Listen: '+Q[step].model;say(['Listen!',Q[step].model]);
  [].forEach.call(document.querySelectorAll('#area button:not(#hear)'),function(b){b.disabled=true});$('next').hidden=false;paintDots();}
 else{$('rb').textContent='Watch out! Try again!';say('Watch out! Try again!')}
}
$('next').onclick=function(){step++;if(step>=Q.length){finish();return}show()};
function finish(){$('walk').style.left=walkerX(Q.length)+'%';paintDots();$('endP').textContent='⭐ '+stars+' / '+Q.length;$('endOv').hidden=false;confetti(40);say("You're my hero!")}
function startGame(){step=0;stars=0;res=[];$('endOv').hidden=true;show()}
$('start').onclick=function(){ensureAC();pickVoice();$('startOv').hidden=true;['Great!','Good!','Watch out! Try again!','Listen!',"You're my hero!"].forEach(prefetch);startGame()};
$('again').onclick=startGame;
$('restart').onclick=function(){if(confirm('Start again?'))startGame()};
$('snd').onclick=function(){sound=!sound;this.textContent=sound?'🔊':'🔇';if(!sound)stopSpeech();else ensureAC()};
drawMap();$('walk').style.left=ST[0].x+'%';paintDots();
</script>
</body>
</html>
