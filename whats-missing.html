<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>What's missing?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbf4e6; --ink:#2b2622; --muted:#7a6f63; --card:#fffdf8; --line:#eadfcb;
  --sun:#ffb81c; --sun-d:#e09600; --ok:#2fb36b; --bad:#ef4b3f; --blue:#5a8ff0;
  --curtain:#d6403a; --curtain-d:#a92b27;
  --r:18px; --r-s:12px;
  --shadow:0 4px 0 rgba(43,38,34,.12), 0 10px 24px rgba(43,38,34,.08);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;min-height:100dvh}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun-d);outline-offset:2px}

.wrap{max-width:980px;margin:0 auto;padding:16px 14px 30px;display:grid;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:'Fredoka';font-weight:700;margin:0;font-size:clamp(24px,4.4vw,38px);line-height:1}
h1 small{display:block;font-size:.45em;color:var(--muted);font-weight:600;margin-top:4px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.stars{display:flex;gap:4px;flex-wrap:wrap}
.stars span{font-size:22px;filter:grayscale(1);opacity:.3;transition:transform .3s}
.stars span.on{filter:none;opacity:1;transform:scale(1.12)}
.stars span.half{filter:none;opacity:.55}
.stars span.cur{opacity:.85;filter:none;animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.25)}}

/* ===== сцена-театр ===== */
.stage{position:relative;border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);border:3px solid var(--ink);
  background:linear-gradient(#ffeec7,#ffe2a6 70%,#d29c5c 70%,#c48a4c);aspect-ratio:16/9}
.valance{position:absolute;left:0;right:0;top:0;height:9%;z-index:6;
  background:repeating-linear-gradient(90deg,var(--curtain) 0 34px,var(--curtain-d) 34px 40px);
  border-bottom:4px solid #ffb81c;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.grid{position:absolute;left:6%;right:6%;top:15%;bottom:10%;display:grid;gap:3%;align-content:center;justify-content:center}
.slot{position:relative;display:flex;align-items:center;justify-content:center;border-radius:16px;
  background:rgba(255,255,255,.55);border:3px solid rgba(43,38,34,.12);min-width:0;min-height:0}
.slot .pic{width:72%;height:72%;display:flex;align-items:center;justify-content:center}
.slot svg{max-width:100%;max-height:100%;width:auto;height:100%;filter:drop-shadow(0 3px 0 rgba(43,38,34,.15))}
.slot.in .pic{animation:popin .45s backwards}
@keyframes popin{from{transform:scale(0) rotate(-12deg)}}
.slot.empty{border-style:dashed;border-color:var(--sun-d);background:rgba(255,255,255,.3)}
.slot.empty .pic{display:none}
.slot .qm{display:none;font:700 clamp(30px,6vw,60px) 'Fredoka';color:var(--sun-d);animation:pulse 1.2s infinite}
.slot.empty .qm{display:block}
.slot.back .pic{animation:popin .5s}
.slot.back{border-color:var(--ok);background:#eafbf1}
.lab{position:absolute;bottom:-2px;left:50%;transform:translate(-50%,50%);white-space:nowrap;background:var(--ink);color:#fff;
  font:800 clamp(10px,1.5vw,14px) 'Nunito';padding:2px 8px;border-radius:999px;display:none;z-index:2}
.stage.labels .lab, .slot.back .lab{display:block}
.slot.empty .lab{display:none}

.curtain{position:absolute;top:0;bottom:0;width:51%;z-index:5;transition:transform .7s cubic-bezier(.6,.05,.3,1);
  background:repeating-linear-gradient(90deg,var(--curtain) 0 22px,var(--curtain-d) 22px 30px,var(--curtain) 30px 44px)}
.curtain.l{left:0;transform:translateX(-100%);border-right:4px solid var(--curtain-d)}
.curtain.r{right:0;transform:translateX(100%);border-left:4px solid var(--curtain-d)}
.stage.closed .curtain{transform:none}
.eyes{position:absolute;inset:0;z-index:7;display:flex;align-items:center;justify-content:center;
  font:700 clamp(40px,9vw,90px) 'Fredoka';opacity:0;transition:opacity .3s;pointer-events:none}
.stage.closed .eyes{opacity:1}

/* ===== карточка ===== */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 18px 20px;display:grid;gap:14px;text-align:center}
.tag{justify-self:center;font:800 13px 'Nunito';letter-spacing:.04em;text-transform:uppercase;color:var(--muted);
  background:var(--bg);border-radius:999px;padding:4px 12px}
.q{font:700 clamp(22px,4vw,34px) 'Fredoka';margin:0}
.q .ru{display:block;font:700 15px 'Nunito';color:var(--muted);margin-top:4px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{border:0;border-radius:var(--r-s);padding:12px 20px;font:700 18px 'Fredoka';background:var(--sun);
  box-shadow:0 4px 0 var(--sun-d);transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sun-d)}
.btn.ghost{background:var(--bg);box-shadow:0 4px 0 var(--line)}
.btn.ok{background:var(--ok);color:#fff;box-shadow:0 4px 0 #1f8a50}
.btn.no{background:var(--bad);color:#fff;box-shadow:0 4px 0 #b9302a}
.btn.big{font-size:22px;padding:14px 26px}
input.ans{font:700 22px 'Fredoka';padding:10px 14px;border:3px solid var(--line);border-radius:var(--r-s);width:min(280px,70vw);text-align:center;background:#fff}
input.ans.bad{border-color:var(--bad);animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.hint{background:#fff6dc;border:2px dashed var(--sun);border-radius:var(--r-s);padding:10px 14px;font-weight:800;font-size:17px;justify-self:center}
.hint .pair{display:flex;gap:14px;justify-content:center;align-items:center;margin-top:6px}
.hint .pair b{font:700 22px 'Fredoka'}
.fb{font:700 22px 'Fredoka';min-height:1.2em;margin:0}
.fb.good{color:var(--ok)} .fb.bad{color:var(--bad)}
.note{font-size:14px;color:var(--muted);margin:0}
.end h2{font:700 clamp(30px,6vw,48px) 'Fredoka';margin:0}

.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (max-width:560px){ .btn{font-size:16px;padding:10px 14px} .card{padding:14px 12px 16px} .stage{aspect-ratio:4/3} }
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>What's missing? <small>Our new things</small></h1>
    <div class="tools">
      <button class="chip" id="answerBtn" aria-pressed="true">🗣️ Отвечаем устно</button>
      <button class="chip" id="labelBtn" aria-pressed="false">🏷️ Подписи</button>
      <button class="chip" id="soundBtn" aria-pressed="true">🔊 Звук</button>
      <button class="chip" id="restartBtn">↺ Заново</button>
    </div>
  </header>
  <div class="stars" id="stars"></div>

  <div class="stage" id="stage">
    <div class="valance"></div>
    <div class="grid" id="grid"></div>
    <div class="curtain l"></div><div class="curtain r"></div>
    <div class="eyes">🙈</div>
  </div>

  <main class="card" id="card"></main>
</div>
<div class="confetti" id="confetti"></div>

<script>
/* ===================== НАСТРОЙКИ (можно править) ===================== */
const CONFIG = {
  studentName: '',   // можно вписать имя для финального экрана
  // Сколько предметов на сцене в каждом раунде (сколько чисел, столько раундов)
  sizes: [4, 4, 5, 5, 5, 6, 6, 6],
  // Слова урока: новые пропадают первыми
  newWords: ['poster','picture','drawers','cupboard','CD player'],
  oldWords: ['table','computer','bag','pencil case','board','door','window','chair','pegs'],
  shuffleAfter: false // true = после занавеса предметы ещё и меняются местами (сложнее)
};
/* ===================================================================== */

const ART = {
  poster:{vb:'0 0 80 100',svg:`<rect x="4" y="4" width="72" height="92" rx="3" fill="#fff" stroke="#2b2622" stroke-width="3"/>
    <rect x="12" y="12" width="56" height="42" fill="#7fd0f5"/><circle cx="54" cy="24" r="7" fill="#ffd23f"/>
    <path d="M12 54l16-18 12 12 10-8 18 14z" fill="#3fae5f"/>
    <rect x="14" y="62" width="52" height="6" rx="3" fill="#e8483d"/><rect x="14" y="74" width="40" height="5" rx="2.5" fill="#c9c0b2"/><rect x="14" y="84" width="46" height="5" rx="2.5" fill="#c9c0b2"/>
    <circle cx="10" cy="9" r="4" fill="#e8483d"/><circle cx="70" cy="9" r="4" fill="#e8483d"/>`},
  picture:{vb:'0 0 100 80',svg:`<rect x="3" y="3" width="94" height="74" rx="4" fill="#b8742f" stroke="#2b2622" stroke-width="3"/>
    <rect x="12" y="12" width="76" height="56" fill="#cdeefd"/><circle cx="72" cy="26" r="8" fill="#ffb81c"/>
    <path d="M12 68V56q20-14 40-2t36 0v14z" fill="#6cc76c"/><rect x="30" y="38" width="4" height="18" fill="#8a5a2b"/><circle cx="32" cy="34" r="9" fill="#3fae5f"/>`},
  drawers:{vb:'0 0 100 82',svg:`<rect x="6" y="4" width="88" height="70" rx="5" fill="#e0a15a" stroke="#2b2622" stroke-width="3"/>
    <g fill="#f2bb76" stroke="#2b2622" stroke-width="2.5"><rect x="13" y="10" width="74" height="17" rx="3"/><rect x="13" y="31" width="74" height="17" rx="3"/><rect x="13" y="52" width="74" height="17" rx="3"/></g>
    <g fill="#2b2622"><rect x="42" y="16" width="16" height="5" rx="2.5"/><rect x="42" y="37" width="16" height="5" rx="2.5"/><rect x="42" y="58" width="16" height="5" rx="2.5"/></g>
    <rect x="12" y="74" width="8" height="7" fill="#2b2622"/><rect x="80" y="74" width="8" height="7" fill="#2b2622"/>`},
  cupboard:{vb:'0 0 80 130',svg:`<rect x="4" y="4" width="72" height="118" rx="4" fill="#a96a35" stroke="#2b2622" stroke-width="3"/>
    <rect x="9" y="10" width="30" height="104" rx="3" fill="#c98547" stroke="#2b2622" stroke-width="2.5"/>
    <rect x="41" y="10" width="30" height="104" rx="3" fill="#c98547" stroke="#2b2622" stroke-width="2.5"/>
    <rect x="33" y="52" width="3.5" height="16" rx="1.7" fill="#ffd23f" stroke="#2b2622" stroke-width="1.5"/><rect x="43.5" y="52" width="3.5" height="16" rx="1.7" fill="#ffd23f" stroke="#2b2622" stroke-width="1.5"/>
    <rect x="8" y="122" width="8" height="6" fill="#2b2622"/><rect x="64" y="122" width="8" height="6" fill="#2b2622"/>`},
  'CD player':{vb:'0 0 110 70',svg:`<path d="M30 16q0-12 25-12t25 12" fill="none" stroke="#2b2622" stroke-width="5"/>
    <rect x="4" y="16" width="102" height="50" rx="12" fill="#e8483d" stroke="#2b2622" stroke-width="3"/>
    <circle cx="27" cy="41" r="15" fill="#3b3f4a" stroke="#2b2622" stroke-width="2.5"/><circle cx="27" cy="41" r="6" fill="#8b919e"/>
    <circle cx="83" cy="41" r="15" fill="#3b3f4a" stroke="#2b2622" stroke-width="2.5"/><circle cx="83" cy="41" r="6" fill="#8b919e"/>
    <rect x="44" y="24" width="22" height="13" rx="3" fill="#bfe7ff" stroke="#2b2622" stroke-width="2"/>
    <circle cx="55" cy="51" r="6" fill="#ffd23f" stroke="#2b2622" stroke-width="2"/>`},
  door:{vb:'0 0 60 120',svg:`<rect x="3" y="3" width="54" height="116" rx="2" fill="#fff" stroke="#2b2622" stroke-width="3"/>
    <rect x="9" y="9" width="42" height="110" fill="#5a8ff0" stroke="#2b2622" stroke-width="2.5"/>
    <rect x="15" y="16" width="30" height="36" rx="2" fill="#7aa8ff"/><rect x="15" y="62" width="30" height="46" rx="2" fill="#7aa8ff"/>
    <circle cx="44" cy="60" r="3.5" fill="#ffd23f" stroke="#2b2622" stroke-width="1.5"/>`},
  window:{vb:'0 0 100 90',svg:`<rect x="4" y="4" width="92" height="76" rx="3" fill="#cdeefd" stroke="#2b2622" stroke-width="4"/>
    <circle cx="74" cy="24" r="9" fill="#ffd23f"/><path d="M4 66q24-14 46 0t46-4v18H4z" fill="#8fd18f"/>
    <path d="M50 4v76M4 42h92" stroke="#fff" stroke-width="5"/><path d="M50 4v76M4 42h92" stroke="#2b2622" stroke-width="1.5" opacity=".4"/>
    <rect x="0" y="80" width="100" height="8" rx="3" fill="#fff" stroke="#2b2622" stroke-width="2.5"/>`},
  chair:{vb:'0 0 60 80',svg:`<rect x="10" y="4" width="40" height="34" rx="5" fill="#3fae5f" stroke="#2b2622" stroke-width="3"/>
    <rect x="6" y="38" width="48" height="10" rx="3" fill="#2f8f4c" stroke="#2b2622" stroke-width="3"/>
    <g stroke="#2b2622" stroke-width="5" stroke-linecap="round"><path d="M12 50v26M48 50v26"/></g>`},
  table:{vb:'0 0 120 70',svg:`<rect x="4" y="6" width="112" height="12" rx="4" fill="#5a8ff0" stroke="#2b2622" stroke-width="3"/>
    <g stroke="#2b2622" stroke-width="6" stroke-linecap="round"><path d="M16 20v46M104 20v46"/></g>`},
  computer:{vb:'0 0 80 72',svg:`<rect x="4" y="4" width="72" height="48" rx="5" fill="#3b3f4a" stroke="#2b2622" stroke-width="3"/>
    <rect x="10" y="10" width="60" height="36" rx="2" fill="#8fd3ff"/><circle cx="28" cy="26" r="6" fill="#ffd23f"/><path d="M10 46l18-14 12 8 14-12 16 18z" fill="#3fae5f"/>
    <rect x="34" y="52" width="12" height="10" fill="#8b919e"/><rect x="20" y="62" width="40" height="7" rx="3" fill="#3b3f4a" stroke="#2b2622" stroke-width="2"/>`},
  bag:{vb:'0 0 60 74',svg:`<path d="M18 22q0-16 12-16t12 16" fill="none" stroke="#2b2622" stroke-width="4"/>
    <rect x="6" y="20" width="48" height="50" rx="10" fill="#ff7a45" stroke="#2b2622" stroke-width="3"/>
    <rect x="14" y="40" width="32" height="20" rx="5" fill="#ffa070" stroke="#2b2622" stroke-width="2.5"/><rect x="26" y="38" width="8" height="6" rx="2" fill="#ffd23f" stroke="#2b2622" stroke-width="1.5"/>`},
  'pencil case':{vb:'0 0 90 40',svg:`<rect x="4" y="6" width="82" height="30" rx="13" fill="#b07de0" stroke="#2b2622" stroke-width="3"/>
    <path d="M10 18h70" stroke="#2b2622" stroke-width="2.5" stroke-dasharray="4 3"/><circle cx="78" cy="18" r="4" fill="#ffd23f" stroke="#2b2622" stroke-width="1.5"/>
    <path d="M14 6l6-5h8l-4 5z" fill="#ffd23f" stroke="#2b2622" stroke-width="1.5"/>`},
  pegs:{vb:'0 0 110 36',svg:`<rect x="3" y="4" width="104" height="12" rx="4" fill="#c98547" stroke="#2b2622" stroke-width="3"/>
    <g fill="#e8483d" stroke="#2b2622" stroke-width="2.5"><path d="M19 16v10q0 6 7 6"/><path d="M52 16v10q0 6 7 6"/><path d="M85 16v10q0 6 7 6"/></g>`},
  board:{vb:'0 0 140 90',svg:`<rect x="3" y="3" width="134" height="80" rx="4" fill="#fff" stroke="#c0502f" stroke-width="5"/>
    <text x="16" y="34" font-family="Fredoka,sans-serif" font-size="20" font-weight="600" fill="#2b2622">5+5=10</text>
    <text x="16" y="62" font-family="Fredoka,sans-serif" font-size="20" font-weight="600" fill="#2b2622">6+6=12</text>
    <rect x="40" y="83" width="60" height="5" rx="2" fill="#c0502f"/>`}
};

const PLURAL = ['drawers','pegs'];
const $ = s => document.querySelector(s);
const stage = $('#stage'), grid = $('#grid'), card = $('#card');
let oral = true, sound = true, rounds = [], idx = 0, results = [], cur = null, tries = 0, hinted = false;

function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}

function build(){
  const all = [...CONFIG.newWords, ...CONFIG.oldWords];
  // кто пропадает: сначала новые слова, потом старые, без повторов
  const missQueue = [...shuffle(CONFIG.newWords), ...shuffle(CONFIG.oldWords)];
  rounds = CONFIG.sizes.map((n,i)=>{
    const miss = missQueue[i % missQueue.length];
    const others = shuffle(all.filter(w=>w!==miss)).slice(0, n-1);
    return {miss, items: shuffle([miss, ...others])};
  });
  idx = 0; results = []; start();
}

/* ===================== звук ===================== */
let voice = null;
function loadVoice(){ const vs = speechSynthesis.getVoices(); voice = vs.find(v=>/en-GB/i.test(v.lang)) || vs.find(v=>/^en/i.test(v.lang)) || null; }
if('speechSynthesis' in window){ loadVoice(); speechSynthesis.onvoiceschanged = loadVoice; }
function say(t, force){
  if((!sound && !force) || !('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t); u.lang = 'en-GB'; u.rate = .85; if(voice) u.voice = voice;
  speechSynthesis.speak(u);
}

function drawStars(){
  const s = $('#stars'); s.innerHTML = '';
  rounds.forEach((r,i)=>{
    const e = document.createElement('span'); e.textContent = '⭐';
    if(results[i]===2) e.className='on'; else if(results[i]===1) e.className='half'; else if(i===idx) e.className='cur';
    s.appendChild(e);
  });
}

/* ===================== сцена ===================== */
function layout(n){
  const cols = n<=4 ? n : 3, rows = Math.ceil(n/cols);
  const narrow = window.innerWidth < 560;
  const c = narrow && n>4 ? 3 : (narrow && n===4 ? 2 : cols), r = Math.ceil(n/c);
  grid.style.gridTemplateColumns = `repeat(${c}, minmax(0, ${narrow?28:Math.min(22, 80/c)}%))`;
  grid.style.gridTemplateColumns = `repeat(${c}, 1fr)`;
  grid.style.gridTemplateRows = `repeat(${r}, 1fr)`;
  grid.style.left = grid.style.right = (c===4 ? 6 : c===3 ? 14 : 22) + '%';
}
function slotEl(k){
  const d = document.createElement('div'); d.className = 'slot in'; d.dataset.k = k;
  d.innerHTML = `<div class="pic"><svg viewBox="${ART[k].vb}">${ART[k].svg}</svg></div><span class="qm">?</span><span class="lab">${k}</span>`;
  return d;
}
function drawItems(items){
  grid.innerHTML = ''; layout(items.length);
  items.forEach((k,i)=>{ const s = slotEl(k); s.querySelector('.pic').style.animationDelay = (i*0.08)+'s'; grid.appendChild(s); });
}

/* ===================== раунд ===================== */
function head(){ return `<div class="tag">🙈 Что пропало? · ${idx+1} / ${rounds.length}</div>`; }
function start(){
  cur = rounds[idx]; tries = 0; hinted = false; drawStars();
  stage.classList.remove('closed');
  drawItems(cur.items);
  card.innerHTML = head() + `
    <p class="q">Look and remember! 👀<span class="ru">Посмотри и запомни. Можно назвать всё вслух</span></p>
    <div class="row"><button class="btn big" id="close">🙈 Закрываем глаза</button></div>`;
  say('Look and remember!');
  $('#close').onclick = hide;
}
function hide(){
  card.querySelector('.row').remove();
  stage.classList.add('closed'); say('Close your eyes!');
  setTimeout(()=>{
    let items = cur.items;
    if(CONFIG.shuffleAfter){ items = shuffle(items); }
    drawItems(items);
    grid.querySelectorAll('.slot').forEach(s=>{ s.classList.remove('in'); if(s.dataset.k===cur.miss) s.classList.add('empty'); });
    setTimeout(()=>{ stage.classList.remove('closed'); ask(); }, 500);
  }, 1300);
}
function ask(){
  card.innerHTML = head() + `
    <p class="q">What's missing?<span class="ru">Чего не хватает?</span></p>
    ${answerZone()}
    <div class="row"><button class="btn ghost" id="hintB">💡 Подсказка</button><button class="btn ghost" id="peek">👀 Ещё раз посмотреть</button></div>
    <div id="hintBox"></div><p class="fb" id="fb"></p>`;
  say("What's missing?");
  $('#hintB').onclick = showHint;
  $('#peek').onclick = peek;
  wireAnswer();
}
function peek(){
  hinted = true;
  const e = grid.querySelector('.slot.empty'); if(!e) return;
  e.classList.remove('empty'); e.classList.add('in');
  setTimeout(()=>{ e.classList.remove('in'); e.classList.add('empty'); }, 1200);
}
function showHint(){
  hinted = true;
  const all = [...CONFIG.newWords, ...CONFIG.oldWords];
  const other = shuffle(all.filter(w=>!cur.items.includes(w)))[0] || shuffle(all.filter(w=>w!==cur.miss))[0];
  const pair = shuffle([cur.miss, other]);
  $('#hintBox').innerHTML = `<div class="hint">Пропало… <div class="pair"><b>${pair[0]}</b> или <b>${pair[1]}</b>?</div></div>`;
}

/* ===================== ответы ===================== */
function norm(s){ return s.toLowerCase().replace(/[’']/g,'').replace(/^(the|a|an)\s+/,'').replace(/\s+(is|are)\s+missing.*$/,'').replace(/^(the|a|an)\s+/,'').replace(/[^a-z]/g,''); }
function answerZone(){
  if(oral) return `<div class="row"><button class="btn ok big" id="yes">✓ Верно</button><button class="btn no big" id="no">✗ Не так</button></div>`;
  return `<div class="row"><input class="ans" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="пиши здесь"><button class="btn" id="check">Проверить</button></div>`;
}
function wireAnswer(){
  const miss = ()=>{
    tries++; $('#fb').className='fb bad';
    $('#fb').textContent = tries>=2 ? 'Почти! Смотри подсказку 👇' : 'Попробуй ещё раз!';
    showHint();
  };
  if(oral){ $('#yes').onclick = right; $('#no').onclick = miss; }
  else {
    const inp = $('#ans'); inp.focus();
    const go = ()=>{
      if(!inp.value.trim()) return;
      if(norm(inp.value)===norm(cur.miss)) right();
      else { inp.classList.remove('bad'); void inp.offsetWidth; inp.classList.add('bad'); miss(); }
    };
    $('#check').onclick = go; inp.onkeydown = e=>{ if(e.key==='Enter') go(); };
  }
}
function right(){
  card.querySelectorAll('.row').forEach(r=>r.remove()); $('#hintBox').innerHTML = '';
  const e = grid.querySelector('.slot.empty'); e.classList.remove('empty'); e.classList.add('back');
  const phrase = PLURAL.includes(cur.miss) ? `The ${cur.miss} are missing!` : `The ${cur.miss} is missing!`;
  say(phrase);
  results[idx] = (tries===0 && !hinted) ? 2 : 1; drawStars();
  $('#fb').className='fb good'; $('#fb').textContent = '🎉 '+phrase;
  const nx = document.createElement('div'); nx.className='row';
  nx.innerHTML = `<button class="btn big" id="next">${idx<rounds.length-1?'Дальше ➜':'Финиш 🏁'}</button>`;
  card.appendChild(nx); $('#next').focus();
  $('#next').onclick = ()=>{ idx++; idx<rounds.length ? start() : finish(); };
  if(results[idx]===2) confetti(25);
}
function finish(){
  drawStars(); stage.classList.remove('closed');
  const all = [...CONFIG.newWords]; drawItems(all); stage.classList.add('labels');
  const full = results.filter(x=>x===2).length, half = results.filter(x=>x===1).length;
  card.innerHTML = `<div class="end"><h2>Great job${CONFIG.studentName?', '+CONFIG.studentName:''}! 🏆</h2>
    <p class="q" style="font-size:22px">⭐ ${full} ${half?`&nbsp; ✨ ${half} с подсказкой`:''}</p>
    <div class="row" style="margin-top:12px"><button class="btn big" id="again2">↺ Ещё раз</button></div></div>`;
  $('#again2').onclick = ()=>{ stage.classList.toggle('labels', $('#labelBtn').getAttribute('aria-pressed')==='true'); build(); };
  say('Great job'+(CONFIG.studentName?', '+CONFIG.studentName:'')+'!'); confetti(90);
}
function confetti(n){
  const box = $('#confetti'), cs = ['#ffb81c','#e8483d','#5a8ff0','#2fb36b','#ff7a45'];
  for(let i=0;i<n;i++){
    const c = document.createElement('i');
    c.style.left = Math.random()*100+'vw'; c.style.background = cs[i%cs.length];
    c.style.animationDuration = (1.6+Math.random()*1.6)+'s'; c.style.animationDelay = Math.random()*.4+'s';
    box.appendChild(c); setTimeout(()=>c.remove(), 3800);
  }
}

/* ===================== кнопки ===================== */
$('#answerBtn').onclick = e=>{
  oral = !oral; e.currentTarget.setAttribute('aria-pressed', oral);
  e.currentTarget.textContent = oral ? '🗣️ Отвечаем устно' : '✍️ Отвечаем письменно';
  if($('#yes')||$('#ans')){ const z = card.querySelector('.row'); z.outerHTML = answerZone(); wireAnswer(); }
};
$('#labelBtn').onclick = e=>{ const on = e.currentTarget.getAttribute('aria-pressed')!=='true'; e.currentTarget.setAttribute('aria-pressed', on); stage.classList.toggle('labels', on); };
$('#soundBtn').onclick = e=>{ sound = !sound; e.currentTarget.setAttribute('aria-pressed', sound); e.currentTarget.textContent = sound?'🔊 Звук':'🔇 Без звука'; };
$('#restartBtn').onclick = build;
window.addEventListener('resize', ()=>{ if(cur) layout(grid.children.length); });
build();
</script>
</body>
</html>
