<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Magic Wand</title>
<style>
  :root{--bg1:#241a52;--bg2:#4a2f8a;--ink:#2b2350;--gold:#ffd166;--soft:#f1ecff;--violet:#6d4bd1}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:"Nunito","Segoe UI",Arial,sans-serif;color:#fff;
    background:radial-gradient(circle at 15% 8%,rgba(140,110,255,.45) 0,transparent 38%),
               radial-gradient(circle at 85% 90%,rgba(255,209,102,.18) 0,transparent 35%),
               linear-gradient(160deg,var(--bg1),var(--bg2));
    display:flex;flex-direction:column;align-items:center;padding:24px 14px 40px}
  h1{margin:4px 0 6px;font-size:clamp(28px,5vw,42px);text-align:center;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
  .wand{width:1.1em;height:1.1em;flex:none}
  .big-wand{width:64px;height:64px;vertical-align:middle}
  .lead{margin:0;font-size:clamp(16px,2.6vw,20px);text-align:center;max-width:560px;line-height:1.4}
  .counter{margin:12px 0 18px;font-weight:800;color:var(--gold)}
  .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;width:100%;max-width:820px}
  @media(max-width:700px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
  @media(max-width:460px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .card{background:#fff;color:var(--ink);border:none;border-radius:18px;padding:18px 8px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:8px;font:inherit;
    box-shadow:0 6px 0 rgba(0,0,0,.2);transition:transform .15s}
  .card:hover{transform:translateY(-3px)}
  .card .e{font-size:40px;line-height:1}
  .card .w{font-weight:800;font-size:17px;text-align:center}
  .card.done{background:rgba(255,255,255,.12);color:#fff;box-shadow:none;cursor:default}
  .card.done:hover{transform:none}
  .card.done .e{filter:grayscale(.3);opacity:.8}

  .overlay{position:fixed;inset:0;background:rgba(15,10,40,.72);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
  .overlay.show{display:flex}
  .panel{position:relative;background:#fff;color:var(--ink);border-radius:24px;padding:26px 22px 22px;width:100%;max-width:520px;text-align:center;overflow:hidden}
  .panel .e{font-size:64px;line-height:1}
  .panel .topic{font-size:clamp(26px,5vw,34px);font-weight:900;margin:8px 0 14px}
  .frame{background:var(--soft);border-radius:16px;padding:14px 12px;font-size:clamp(18px,3.4vw,22px);line-height:1.7}
  .frame b{color:var(--violet)}
  .frame .dots{letter-spacing:2px;color:#9a8fc4}
  .ideas-btn{margin-top:14px;background:none;border:2px dashed #b9aee6;color:var(--violet);border-radius:999px;padding:7px 16px;font:inherit;font-weight:700;cursor:pointer}
  .hints{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
  .hints .ideas-btn{margin-top:14px}
  .frame.help{display:none;margin-top:12px;background:#fff4d6}
  .frame.help.show{display:block}
  .chips{display:none;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:10px}
  .chips.show{display:flex}
  .chip{background:#fff4d6;border-radius:999px;padding:6px 14px;font-weight:700}
  .btns{display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap}
  .btn{border:none;border-radius:14px;padding:12px 20px;font:inherit;font-weight:800;font-size:17px;cursor:pointer}
  .back{background:#ece9f5;color:var(--ink)}
  .cast{background:var(--violet);color:#fff;box-shadow:0 4px 0 #4a2f9c}
  .spark{position:absolute;font-size:24px;pointer-events:none;animation:fly .9s ease-out forwards}
  @keyframes fly{from{opacity:1;transform:translate(0,0) scale(.6)}to{opacity:0;transform:translate(var(--x),var(--y)) scale(1.3)}}

  .finish{display:none;text-align:center;margin-top:30px}
  .finish.show{display:block}
  .finish .big{font-size:64px}
  .finish p{font-size:22px;font-weight:800}
  .again{background:var(--gold);color:var(--ink)}
</style>
</head>
<body>
  <h1><svg class="wand" viewBox="0 0 64 64" aria-hidden="true"><line x1="10" y1="56" x2="38" y2="28" stroke="#3a2a6e" stroke-width="7" stroke-linecap="round"/><line x1="10" y1="56" x2="17" y2="49" stroke="#fff" stroke-width="7" stroke-linecap="round"/><path d="M46 6 L49.5 15 L59 16 L51.5 22 L54 31 L46 26 L38 31 L40.5 22 L33 16 L42.5 15 Z" fill="#ffd166" stroke="#f4a940" stroke-width="1.5" stroke-linejoin="round"/><circle cx="26" cy="12" r="2.5" fill="#ffd166"/><circle cx="58" cy="40" r="2" fill="#ffd166"/></svg> The Magic Wand</h1>
  <p class="lead">You have a magic wand. Pick a card and decide what happens. Say your spell!</p>
  <div class="counter" id="counter"></div>
  <div class="grid" id="grid"></div>
  <div class="finish" id="finish">
    <div class="big">✨<svg class="wand big-wand" viewBox="0 0 64 64" aria-hidden="true"><line x1="10" y1="56" x2="38" y2="28" stroke="#3a2a6e" stroke-width="7" stroke-linecap="round"/><line x1="10" y1="56" x2="17" y2="49" stroke="#fff" stroke-width="7" stroke-linecap="round"/><path d="M46 6 L49.5 15 L59 16 L51.5 22 L54 31 L46 26 L38 31 L40.5 22 L33 16 L42.5 15 Z" fill="#ffd166" stroke="#f4a940" stroke-width="1.5" stroke-linejoin="round"/><circle cx="26" cy="12" r="2.5" fill="#ffd166"/><circle cx="58" cy="40" r="2" fill="#ffd166"/></svg>✨</div>
    <p>All spells cast! The future is yours.</p>
    <button class="btn again" id="again">Play again</button>
  </div>

  <div class="overlay" id="overlay">
    <div class="panel" id="panel">
      <div class="e" id="pEmoji"></div>
      <div class="topic" id="pTopic"></div>
      <div class="frame" id="pFrame"></div>
      <div class="hints">
        <button class="ideas-btn" id="ideasBtn">Need an idea?</button>
        <button class="ideas-btn" id="helpBtn">Help with the spell</button>
      </div>
      <div class="chips" id="chips"></div>
      <div class="frame help" id="pHelp"></div>
      <div class="btns">
        <button class="btn back" id="backBtn">Back</button>
        <button class="btn cast" id="castBtn">Cast the spell ✨</button>
      </div>
    </div>
  </div>

<script>
  // [emoji, word on card, subject for the frame, idea verbs]
  const CARDS = [
    ["🤖","robot","My robot",["cook","clean","help","dance"]],
    ["🍕","pizza","Pizza",["taste","be","grow","cost"]],
    ["🏫","school","School",["start","finish","be","have"]],
    ["📚","homework","Homework",["be","do","take"]],
    ["📱","my phone","My phone",["talk","fly","break","know"]],
    ["🛏️","my room","My room",["clean","be","change"]],
    ["👩‍🏫","teachers","Teachers",["give","let","be"]],
    ["📅","weekends","Weekends",["last","be","start"]],
    ["🐱","my pet","My pet",["talk","go","help"]],
    ["☀️","the weather","The weather",["be","rain","snow"]],
    ["🏖️","summer holidays","Summer holidays",["last","start","be"]],
    ["🎮","video games","Video games",["teach","be","let"]]
  ];

  const done = new Set();
  let current = null;
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  function render(){
    const grid = $("grid");
    grid.innerHTML = "";
    CARDS.forEach((c, i) => {
      const b = document.createElement("button");
      b.className = "card" + (done.has(i) ? " done" : "");
      b.innerHTML = `<span class="e">${done.has(i) ? "✨" : c[0]}</span><span class="w">${esc(c[1])}</span>`;
      if (!done.has(i)) b.onclick = () => openCard(i);
      grid.appendChild(b);
    });
    $("counter").textContent = `Spells cast: ${done.size} / ${CARDS.length}`;
    const finished = done.size === CARDS.length;
    grid.style.display = finished ? "none" : "";
    $("finish").classList.toggle("show", finished);
  }

  function helpHTML(subject){
    const s = esc(subject);
    return `<b>${s}</b> will <span class="dots">…</span> / <b>${s}</b> won't <span class="dots">…</span><br>I'll <span class="dots">…</span> / I won't <span class="dots">…</span>`;
  }

  function openCard(i){
    current = i;
    const c = CARDS[i];
    $("pEmoji").textContent = c[0];
    $("pTopic").textContent = c[1];
    $("pFrame").innerHTML = "✨ Your spell! ✨";
    $("pHelp").innerHTML = helpHTML(c[2]);
    $("pHelp").classList.remove("show");
    $("helpBtn").textContent = "Help with the spell";
    $("chips").innerHTML = c[3].map(v => `<span class="chip">${esc(v)}</span>`).join("");
    $("chips").classList.remove("show");
    $("ideasBtn").textContent = "Need an idea?";
    $("overlay").classList.add("show");
  }

  function closeCard(){ $("overlay").classList.remove("show"); current = null; }

  function sparkle(){
    const p = $("panel");
    const marks = ["✨","⭐","💫","🌟"];
    for (let k = 0; k < 14; k++){
      const s = document.createElement("span");
      s.className = "spark";
      s.textContent = marks[k % marks.length];
      s.style.left = "50%"; s.style.top = "40%";
      const a = Math.random() * Math.PI * 2, d = 90 + Math.random() * 120;
      s.style.setProperty("--x", Math.cos(a) * d + "px");
      s.style.setProperty("--y", Math.sin(a) * d + "px");
      p.appendChild(s);
      setTimeout(() => s.remove(), 950);
    }
  }

  $("ideasBtn").onclick = () => {
    const open = $("chips").classList.toggle("show");
    $("ideasBtn").textContent = open ? "Hide ideas" : "Need an idea?";
  };
  $("helpBtn").onclick = () => {
    const open = $("pHelp").classList.toggle("show");
    $("helpBtn").textContent = open ? "Hide help" : "Help with the spell";
  };
  $("backBtn").onclick = closeCard;
  $("castBtn").onclick = () => {
    if (current === null) return;
    sparkle();
    const i = current;
    current = null;
    setTimeout(() => { done.add(i); closeCard(); render(); }, 900);
  };
  $("overlay").addEventListener("click", e => { if (e.target.id === "overlay") closeCard(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeCard(); });
  $("again").onclick = () => { done.clear(); render(); };

  render();
</script>
</body>
</html>
