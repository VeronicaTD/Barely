<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Урок рекордов 2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Unbounded:wght@500;700;800&display=swap">
<style>
html{-webkit-text-size-adjust:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: тетрадь в клетку; сверху полоса уровней, ниже одна рабочая зона уровня. Открытая дверь — зелёная, закрытая — синяя */
:root{
  --paper:#F3F6FA; --grid:#DCE5F0; --card:#FFFFFF; --ink:#18223A; --muted:#5B6782;
  --pen:#2B47C9; --pen-soft:#E3E8FB; --red:#D2402F; --red-soft:#FBE4E0;
  --ok:#1E8A55; --ok-soft:#DDF3E7; --dg:#C2410C; --dg-soft:#FFE7D6;
  --magic:#7A3FB8; --magic-soft:#EFE5FA; --line:#C9D4E3; --gold:#B7791F; --gold-soft:#FDF1D8;
  --f-word:"Andika","Comic Sans MS",system-ui,sans-serif;
  --f-head:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Andika",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#131A2B; --grid:#1D2740; --card:#1B2438; --ink:#EEF2FA; --muted:#9AA6C2;
  --pen:#8EA2FF; --pen-soft:#25305A; --red:#FF7B6B; --red-soft:#4A2221;
  --ok:#5BD69A; --ok-soft:#173A2B; --dg:#FF9F5A; --dg-soft:#47290F;
  --magic:#C79BFF; --magic-soft:#33224D; --line:#2C3956; --gold:#F2C060; --gold-soft:#3D3115; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#131A2B; --grid:#1D2740; --card:#1B2438; --ink:#EEF2FA; --muted:#9AA6C2;
  --pen:#8EA2FF; --pen-soft:#25305A; --red:#FF7B6B; --red-soft:#4A2221;
  --ok:#5BD69A; --ok-soft:#173A2B; --dg:#FF9F5A; --dg-soft:#47290F;
  --magic:#C79BFF; --magic-soft:#33224D; --line:#2C3956; --gold:#F2C060; --gold-soft:#3D3115; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
input{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:8px;padding:6px 10px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);
  margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  border-bottom:2px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.brand{font-family:var(--f-head);font-weight:800;font-size:15px;letter-spacing:.02em;margin-right:4px}
.brand b{color:var(--pen)}
.chips{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.chip{font-family:var(--f-head);font-weight:700;font-size:13px;width:34px;height:34px;border-radius:50%;
  border:2px solid var(--line);background:var(--card);display:grid;place-items:center;font-variant-numeric:tabular-nums}
.chip.on{background:var(--pen);border-color:var(--pen);color:var(--card)}
.chip.done{border-color:var(--ok);color:var(--ok)}
.chip.on.done{color:var(--card)}
.tool{font-size:14px;padding:6px 12px;border-radius:999px;border:2px solid var(--line);background:var(--card)}
.tool.on{border-color:var(--pen);background:var(--pen-soft)}

main{max-width:980px;margin:22px auto 0}
.head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.lvl{font-family:var(--f-head);font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--pen)}
h1{font-family:var(--f-head);font-weight:700;font-size:clamp(22px,4vw,32px);margin:0;text-wrap:balance}
.mins{font-size:14px;color:var(--muted)}
.lead{color:var(--muted);margin:4px 0 16px;max-width:62ch}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;min-width:0}
.teacher{background:var(--gold-soft);border:2px dashed var(--gold);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:15px}
.teacher i{display:block}
.teacher::before{content:"учитель";display:block;font-family:var(--f-head);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}

.word{font-family:var(--f-word);font-weight:700;font-size:clamp(26px,4.4vw,38px);line-height:1.15;letter-spacing:.02em}
.me{color:var(--magic);text-decoration:underline wavy;text-underline-offset:6px}
.dg{color:var(--dg)}
.hints-off .me{color:inherit;text-decoration:none}
.hints-off .dg{color:inherit}

.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.w{border:2px solid transparent;border-radius:10px;padding:6px 10px;text-align:left;background:var(--paper)}
.w:hover{border-color:var(--line)}
.w.err{background:var(--red-soft);border-color:var(--red)}
.w.err2{background:var(--ok-soft);border-color:var(--ok)}
.w .n{font-family:var(--f-head);font-size:11px;color:var(--muted);display:block;font-variant-numeric:tabular-nums}

.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.btn{font-family:var(--f-head);font-weight:700;font-size:14px;padding:10px 18px;border-radius:12px;background:var(--pen);color:var(--card)}
.btn.ghost{background:var(--card);color:var(--pen);border:2px solid var(--pen)}
.btn.red{background:var(--red)}
.btn.ok{background:var(--ok)}
.btn:disabled{opacity:.4;cursor:default}
.clock{font-family:var(--f-head);font-weight:800;font-size:34px;font-variant-numeric:tabular-nums;min-width:4ch}
.clock.run{color:var(--red)}
.passes{display:flex;gap:6px;flex-wrap:wrap}
.pass{font-size:14px;padding:4px 10px;border-radius:999px;background:var(--pen-soft);font-variant-numeric:tabular-nums}
.pass.best{background:var(--ok-soft);color:var(--ok);font-weight:700}
.errc{font-size:14px;color:var(--red);font-weight:700}

/* двери */
.doors{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.door{border-radius:16px;padding:22px 12px;text-align:center;border:3px solid;font-family:var(--f-head);font-weight:700;font-size:18px}
.door svg{display:block;margin:0 auto 8px}
.door.closed{border-color:var(--pen);background:var(--pen-soft);color:var(--pen)}
.door.open{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.door.flash-ok{outline:5px solid var(--ok)}
.door.flash-bad{outline:5px solid var(--red)}
.big{font-family:var(--f-word);font-weight:700;font-size:clamp(44px,9vw,76px);text-align:center;min-height:1.3em}
.score{font-family:var(--f-head);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}

table.dt{width:100%;border-collapse:separate;border-spacing:6px}
.dt th{font-family:var(--f-head);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:0 6px}
.dt td{background:var(--paper);border-radius:10px;padding:10px;vertical-align:middle}
.dt td.letter{font-family:var(--f-word);font-weight:700;font-size:36px;text-align:center;width:70px;background:var(--card)}
.cell{width:100%;text-align:left;min-height:52px}
.cell .q{font-family:var(--f-head);font-size:24px;color:var(--line)}
.cell .ex{font-family:var(--f-word);font-weight:700;font-size:26px}
.cell .snd{font-size:16px;color:var(--muted);margin-left:8px}
.tbl-wrap{overflow-x:auto}

.pairs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.pair{display:grid;grid-template-columns:28px 1fr 18px 1fr;align-items:center;gap:6px;background:var(--paper);border-radius:10px;padding:4px 8px}
.pair .n{font-family:var(--f-head);font-size:11px;color:var(--muted)}
.pair .arr{color:var(--muted);text-align:center}
.pair .w{background:transparent;padding:4px 6px}
.only-open .pair .left,.only-open .pair .arr{visibility:hidden}

.ladders{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.ladder{background:var(--paper);border-radius:12px;padding:12px}
.ladder h3{font-family:var(--f-head);font-size:13px;margin:0 0 8px;color:var(--muted);font-weight:700}
.steps{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.step{display:flex;align-items:center;gap:10px}
.step .k{font-family:var(--f-head);font-size:11px;color:var(--muted);width:18px}
.step .word{font-size:30px}
.step.hidden-step .word{color:var(--line)}
.ch{background:var(--gold-soft);color:var(--gold);border-radius:4px;padding:0 2px}

.txt .line{display:flex;gap:12px;align-items:baseline;padding:4px 0}
.txt .ln{font-family:var(--f-head);font-size:12px;color:var(--muted);width:22px;flex:none}
.txt .line .word{font-size:clamp(24px,3.6vw,34px);font-weight:700}
.txt .line.dim{opacity:.18}
.tw{cursor:pointer;border-radius:6px;padding:0 2px}
.tw.err{background:var(--red-soft);color:var(--red)}

.list{margin:0;padding-left:20px}
.list li{margin:4px 0}

.sum{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.st{background:var(--paper);border-radius:12px;padding:12px}
.st .l{font-size:13px;color:var(--muted)}
.st .v{font-family:var(--f-head);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums}
.st .s{font-size:14px;color:var(--muted)}
.chart{width:100%;max-width:100%;height:auto;display:block}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
.fb{font-family:var(--f-head);font-weight:700;font-size:18px;text-align:center;min-height:1.6em}
.fb.good{color:var(--ok)} .fb.bad{color:var(--red)}
@media (max-width:520px){.doors{grid-template-columns:1fr 1fr}.door{padding:14px 6px;font-size:14px}.clock{font-size:28px}}
@media (prefers-reduced-motion:no-preference){.chip,.w,.door{transition:background .15s,border-color .15s,outline-color .15s}}
</style>

</head>
<body>
<div class="top">
  <div class="brand">Урок <b>рекордов 2</b></div>
  <div class="chips" id="chips"></div>
  <button class="tool" id="hints">✨ подсказки</button>
  <button class="tool" id="tts">🔊 голос</button>
  <button class="tool" id="tch">учитель</button>
</div>
<main id="app"></main>

<script>
(()=>{
/* ---------- хранилище ---------- */
const P='rekordy2_';
const store={get(k,d){try{const v=localStorage.getItem(P+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(P+k,JSON.stringify(v))}catch(e){}}};
let R=store.get('res',{});            // результаты этого урока
let BEST=store.get('best',{});        // рекорды (не стираются)
const save=()=>{store.set('res',R);store.set('best',BEST)};
let ttsOn=store.get('tts',true),teacherOn=store.get('teacher',true),hintsOn=store.get('hints',true);
let cur=store.get('cur',0);

/* ---------- утилиты ---------- */
const $=s=>document.querySelector(s);
function h(tag,attrs={},...kids){const el=document.createElement(tag);
  for(const[k,v]of Object.entries(attrs||{})){if(v==null)continue;
    if(k==='class')el.className=v;else if(k==='html')el.innerHTML=v;else if(k.startsWith('on'))el.addEventListener(k.slice(2),v);else el.setAttribute(k,v)}
  for(const c of kids.flat()){if(c==null||c===false)continue;el.append(c.nodeType?c:document.createTextNode(c))}return el}
let voice=null;
function pickVoice(){if(!('speechSynthesis'in window))return;const vs=speechSynthesis.getVoices();
  voice=vs.find(v=>/en-GB/i.test(v.lang)&&/female|Google UK|Serena|Kate|Martha|Libby/i.test(v.name))||vs.find(v=>/en-GB/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null}
if('speechSynthesis'in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(t,force){if(!(ttsOn||force)||!('speechSynthesis'in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);
  u.lang=voice?voice.lang:'en-GB';if(voice)u.voice=voice;u.rate=.8;speechSynthesis.speak(u)}catch(e){}}

/* подсветка: диграфы sh ch th ck ng nk — оранжевым; волшебная e — фиолетовой */
function mark(w){
  const esc=w.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  let s=esc.replace(/(sh|ch|th|ck|ng|nk)/gi,'<span class="dg">$1</span>');
  // гласная + согласная + e на конце слова (кроме самого e в коротких словах типа he)
  s=s.replace(/([aeiouAEIOU](?:<span class="dg">[a-z]{2}<\/span>|[b-df-hj-np-tv-z]))e(?=s?(\b|$))/g,'$1<span class="me">e</span>');
  return s}
const fmt=t=>t==null?'—':(t<60?t.toFixed(1)+' с':Math.floor(t/60)+':'+String(Math.round(t%60)).padStart(2,'0'));

/* ---------- таймер с заходами ---------- */
function timer(key,labels,opts={}){
  const box=h('div',{class:'bar'});const clock=h('div',{class:'clock'},'0.0');
  const passes=h('div',{class:'passes'});let run=false,t0=0,raf=0;
  const btn=h('button',{class:'btn'},'▶ старт');
  const reset=h('button',{class:'btn ghost'},'сброс');
  function tick(){clock.textContent=((performance.now()-t0)/1000).toFixed(1);raf=requestAnimationFrame(tick)}
  function draw(){passes.innerHTML='';const arr=(R[key]||[]);const best=BEST[key];
    labels.forEach((lb,i)=>{const t=arr[i];passes.append(h('span',{class:'pass'+(t!=null&&best!=null&&Math.abs(t-best)<.05?' best':'')},lb+': '+fmt(t)))});
    if(best!=null)passes.append(h('span',{class:'pass best'},'🏆 рекорд '+fmt(best)))}
  btn.onclick=()=>{if(!run){run=true;t0=performance.now();clock.classList.add('run');btn.textContent='■ стоп';btn.classList.add('red');opts.onStart&&opts.onStart();tick()}
    else{run=false;cancelAnimationFrame(raf);clock.classList.remove('run');btn.textContent='▶ старт';btn.classList.remove('red');
      const t=(performance.now()-t0)/1000;clock.textContent=t.toFixed(1);
      const arr=R[key]||[];const i=arr.findIndex((x,j)=>x==null&&j<labels.length);const idx=i>=0?i:(arr.length<labels.length?arr.length:labels.length-1);
      arr[idx]=t;R[key]=arr;if(BEST[key]==null||t<BEST[key])BEST[key]=t;save();draw();refreshChips();opts.onStop&&opts.onStop(t,idx)}};
  reset.onclick=()=>{R[key]=[];save();draw();clock.textContent='0.0'};
  box.toggle=()=>btn.click();
  box.append(btn,clock,passes,reset);draw();return box}

/* ---------- столбик слов с отметкой ошибок ---------- */
function wordGrid(words,key,{numbered=true,cls='cols',speak=true}={}){
  const errs=R[key+'_e']||{};const wrap=h('div',{class:cls});const cnt=h('span',{class:'errc'});
  const upd=()=>{const n=Object.values(errs).filter(Boolean).length;cnt.textContent='ошибок: '+n;R[key+'_e']=errs;R[key+'_n']=n;save()};
  words.forEach((w,i)=>{const b=h('button',{class:'w'+(errs[i]?' err':''),title:'нажми — отметить ошибку'},
      numbered?h('span',{class:'n'},String(i+1)):null,h('span',{class:'word',html:mark(w)}));
    b.onclick=()=>{errs[i]=!errs[i];b.classList.toggle('err',errs[i]);upd()};
    b.oncontextmenu=e=>{e.preventDefault();say(w,true)};
    wrap.append(b)});
  upd();wrap.counter=cnt;return wrap}

/* ---------- данные урока ---------- */
const PAIRS=[['cap','cape'],['tap','tape'],['mad','made'],['hat','hate'],['can','cane'],['plan','plane'],['Sam','same'],
 ['kit','kite'],['pin','pine'],['bit','bite'],['rid','ride'],['fin','fine'],['slim','slime'],['Tim','time'],
 ['hop','hope'],['not','note'],['rob','robe'],['cod','code'],['slop','slope'],
 ['cut','cute'],['tub','tube'],['cub','cube'],['pet','Pete']];
const OPEN0=['he','she','we','me','be','go','no','so','hi','I','my','by','fly','sky','try','dry'];
const LADDERS=[['hop','hope','rope','ripe','ride','rid','red'],
 ['cut','cute','mute','mule','mole','pole','pile','pine'],
 ['mad','made','make','bake','bike','like','lime','time'],
 ['cap','chap','chip','ship','shin','shine','spine','spin'],
 ['ring','rang','rank','tank','thank','think','thin','shin','shine']];
const CATCH=[{w:'cape',say:'cap',bad:1},{w:'ride',say:'ride'},{w:'note',say:'not',bad:1},{w:'cute',say:'cute'},{w:'she',say:'she'},
 {w:'hop',say:'hope',bad:1},{w:'shine',say:'shine'},{w:'time',say:'time'},{w:'me',say:'meh',bad:1,tSay:'«мэ»'},{w:'plane',say:'plane'}];
const NONS_O=['dake','fime','pobe','nube','jate','shime','chobe','thape','wike'];
const NONS_C=['dack','fim','pob','nub','jat','shim','chob','thap','wib'];
const NONS_MIX=['fime','dack','nub','jate','shim','pobe','thap','wike','dake','chob','nube','fim','shime','jat','wib','chobe','pob','thape'];
const MIX30=['cape','ship','kite','duck','he','think','moth','home','chin','cute','sing','plane','stop','my','rock','Pete','bell','shine','frog','go','much','tube','jump','ride','bank','she','hope','lunch','time','thick'];
const OPENSET=new Set(['cape','kite','he','home','cute','plane','my','Pete','shine','go','tube','ride','she','hope','time']);
const TWINS=[['Kate has a cap.','Kate has a cape.'],['Tim has a kit.','Tim has a kite.'],['It is a pin.','It is a pine.'],['The cub is red.','The cube is red.'],['The man is mad.','The man made it.']];
const WARM=['June has a cute mule.','Pete rides the mule to the lake.','The mule is rude! It stops.','«Mule, go!» yells Pete.','The mule will not go. June and Pete sit by the lake.'];
const TEXT=['Kate has a red kite.','She and Mike go to the hill.','The wind is strong.','«Run, Mike! Let the kite go!»','The kite is up in the sky.','It is so fine!','Then the kite hits a pine.','Mike is sad.','«No, no! Not the pine!»','Kate has a plan.','She gets a long stick and pokes the kite.','The kite drops on a rock.','Is it fine? Yes!','«Let me fly it!» yells Mike.','Kate and Mike ride home with the kite.'];
const TEXT_Q=['What has Kate got?','Where do they go?','—','—','Where is the kite?','—','What does the kite hit?','Is Mike sad?','—','What has Kate got? A plan!','What does she get?','Where is the kite?','Is it fine?','What does Mike yell?','Where do they go?'];
const countWords=a=>a.join(' ').replace(/[«»!?.,]/g,' ').split(/\s+/).filter(Boolean).length;
const WARM_N=countWords(WARM),TEXT_N=countWords(TEXT);

/* ---------- текст: строки со словами-кнопками ---------- */
function textBlock(lines,key){
  const errs=R[key+'_e']||{};const box=h('div',{class:'txt'});const cnt=h('span',{class:'errc'});
  const upd=()=>{const n=Object.values(errs).filter(Boolean).length;cnt.textContent='ошибок: '+n;R[key+'_e']=errs;R[key+'_n']=n;save()};
  lines.forEach((ln,li)=>{const row=h('div',{class:'line'},h('span',{class:'ln'},String(li+1)));
    const wd=h('div',{class:'word'});
    ln.split(' ').forEach((tok,ti)=>{const id=li+'_'+ti;const s=h('span',{class:'tw'+(errs[id]?' err':''),html:mark(tok)});
      s.onclick=()=>{errs[id]=!errs[id];s.classList.toggle('err',errs[id]);upd()};
      s.oncontextmenu=e=>{e.preventDefault();say(tok.replace(/[«»!?.,]/g,''),true)};
      wd.append(s,' ')});
    row.append(wd);box.append(row)});
  upd();box.counter=cnt;return box}

/* ---------- уровни ---------- */
const L=[];
const T=(...lines)=>h('div',{class:'teacher'},...lines.map(l=>h('i',{},l)));

L.push({t:'Разгон: текст про u_e и e_e',m:'4 мин',lead:`Пять строк по прошлой теме, ${WARM_N} слов. Два захода на время, палец под словом.`,
 r(){const tb=textBlock(WARM,'L1');return[

  return Array.isArray(R[k])&&R[k].some(x=>x!=null)};
function refreshChips(){const c=$('#chips');c.innerHTML='';L.forEach((l,i)=>c.append(h('button',{class:'chip'+(i===cur?' on':'')+(doneLevel(i)?' done':''),title:l.t,onclick:()=>go(i)},String(i+1))))}
function render(){const app=$('#app');app.innerHTML='';const l=L[cur];
  app.append(h('div',{class:'head'},h('span',{class:'lvl'},`Уровень ${cur+1} из ${L.length}`),h('span',{class:'mins'},l.m)),h('h1',{},l.t),h('p',{class:'lead'},l.lead),...l.r());
  const prev=h('button',{class:'btn ghost',disabled:cur===0?'':null,onclick:()=>go(cur-1)},'← назад');
  const next=h('button',{class:'btn',disabled:cur===L.length-1?'':null,onclick:()=>go(cur+1)},'следующий уровень →');
  app.append(h('div',{class:'nav'},prev,next));syncTools();refreshChips()}
function go(n){if(n<0||n>=L.length)return;if('speechSynthesis'in window)speechSynthesis.cancel();cur=n;store.set('cur',n);render();window.scrollTo(0,0)}

const tb=$('#tts'),tc=$('#tch'),th=$('#hints');
function syncTools(){tb.className='tool'+(ttsOn?' on':'');tb.textContent=ttsOn?'🔊 голос':'🔇 голос';
  tc.className='tool'+(teacherOn?' on':'');document.querySelectorAll('.teacher').forEach(t=>t.hidden=!teacherOn);
  th.className='tool'+(hintsOn?' on':'');document.body.classList.toggle('hints-off',!hintsOn)}
tb.onclick=()=>{ttsOn=!ttsOn;store.set('tts',ttsOn);syncTools()};
tc.onclick=()=>{teacherOn=!teacherOn;store.set('teacher',teacherOn);syncTools()};
th.onclick=()=>{hintsOn=!hintsOn;store.set('hints',hintsOn);syncTools()};
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea'))return;
  if(e.altKey&&e.key==='ArrowRight')go(cur+1);if(e.altKey&&e.key==='ArrowLeft')go(cur-1)});
if(cur>=L.length)cur=0;render();
})();
</script>
</body>
</html>
