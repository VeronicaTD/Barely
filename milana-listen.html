<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Слушай и выбирай — Милана</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --mint:#c3ddb4;
    --mint-deep:#a9cd96;
    --bark:#4a2c1d;
    --bark-soft:#6b4430;
    --cream:#f7f3e6;
    --ok:#3f7d45;
    --no:#b4482f;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:inherit}
  html,body{margin:0;background:var(--mint)}
  body{
    font-family:"Nunito",system-ui,sans-serif;
    color:var(--bark);
    min-height:100%;
    padding:18px 16px 40px;
  }
  .wrap{max-width:760px;margin:0 auto}

  header{display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;justify-content:space-between;margin-bottom:14px}
  h1{font-family:"Baloo 2",cursive;font-weight:800;font-size:clamp(26px,6vw,38px);margin:0;letter-spacing:-.5px}
  .rec{font-weight:700;font-size:15px;color:var(--bark-soft)}

  .blocks{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
  .blk{
    font-family:"Baloo 2",cursive;font-weight:600;font-size:17px;
    background:var(--cream);color:var(--bark);
    border:2px solid transparent;border-radius:999px;
    padding:8px 18px;cursor:pointer;
  }
  .blk[aria-pressed="true"]{background:var(--bark);color:var(--cream)}
  .blk:focus-visible,.big:focus-visible,.opt:focus-visible,.ghost:focus-visible{outline:3px solid var(--bark);outline-offset:3px}

  .stage{
    background:var(--cream);
    border-radius:28px;
    padding:28px 22px 26px;
    text-align:center;
    min-height:330px;
    display:flex;flex-direction:column;justify-content:center;gap:22px;
  }
  .hint{font-size:16px;color:var(--bark-soft);margin:0}

  .big{
    font-family:"Baloo 2",cursive;font-weight:800;font-size:22px;
    background:var(--bark);color:var(--cream);
    border:0;border-radius:999px;padding:16px 34px;cursor:pointer;
    align-self:center;
  }
  .big:active{transform:translateY(1px)}
  .big.small{font-size:17px;padding:11px 24px;background:var(--bark-soft)}

  .opts{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
  .opt{
    font-family:"Baloo 2",cursive;font-weight:800;
    font-size:clamp(28px,7vw,42px);
    background:#fff;color:var(--bark);
    border:3px solid var(--mint-deep);border-radius:22px;
    padding:14px 30px;min-width:150px;cursor:pointer;
  }
  .opt.good{background:var(--ok);border-color:var(--ok);color:#fff}
  .opt.bad{background:var(--no);border-color:var(--no);color:#fff}
  .opt[disabled]{cursor:default}

  .word{font-family:"Baloo 2",cursive;font-weight:800;font-size:clamp(44px,13vw,80px);line-height:1}
  .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .ghost{
    font-family:"Baloo 2",cursive;font-weight:600;font-size:18px;
    background:transparent;color:var(--bark);
    border:2px solid var(--bark);border-radius:999px;padding:10px 22px;cursor:pointer;
  }
  .ghost.yes{border-color:var(--ok);color:var(--ok)}
  .ghost.no{border-color:var(--no);color:var(--no)}

  .score{display:flex;gap:26px;justify-content:center;margin-top:18px;font-weight:700;font-size:17px}
  .score b{font-family:"Baloo 2",cursive;font-size:26px;display:block;line-height:1.1}
  .score span{color:var(--bark-soft);font-size:14px;font-weight:400}

  .done{font-family:"Baloo 2",cursive;font-size:clamp(30px,8vw,46px);line-height:1.15}
  .miss{font-size:17px;color:var(--bark-soft)}
  .warn{background:#fff3cd;border-radius:14px;padding:10px 14px;font-size:14px;margin-top:16px;display:none}
  @media (prefers-reduced-motion:no-preference){.opt{transition:background .12s,border-color .12s}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Слушай и выбирай</h1>
    <div class="rec" id="rec"></div>
  </header>

  <div class="blocks" id="blocks"></div>

  <div class="stage" id="stage"></div>

  <div class="score" id="score"></div>
  <div class="warn" id="warn">Браузер не нашёл английский голос. Включите в системе английский язык озвучки или откройте в Chrome.</div>
</div>

<script>
const BLOCKS = [
  {id:'shch', name:'sh / ch', pairs:[['ship','chip'],['shop','chop'],['shin','chin'],['mush','much'],['cash','catch'],['wish','witch']]},
  {id:'th',   name:'th',      pairs:[['thin','tin'],['thick','tick'],['moth','moss'],['bath','bat'],['then','den'],['thin','win'],['thick','sick'],['with','wish']]},
  {id:'ngnk', name:'ng / nk', pairs:[['sing','sink'],['thing','think'],['wing','wink'],['bang','bank'],['ring','rink'],['sung','sunk']]},
  {id:'start',name:'две в начале', pairs:[['top','stop'],['tick','stick'],['pin','spin'],['lag','flag'],['rum','drum'],['lock','clock']]},
  {id:'ck',   name:'ck',      pairs:[['back','bag'],['lock','log'],['pick','pig'],['kick','kid'],['duck','dug'],['sock','sod']]},
  {id:'vow',  name:'гласные',  pairs:[['bag','bug'],['hat','hut'],['cap','cup'],['pen','pin'],['ten','tin'],['bed','bid']]},
  {id:'all',  name:'всё вместе', pairs:[]}
];
BLOCKS.find(b=>b.id==='all').pairs = BLOCKS.filter(b=>b.id!=='all').flatMap(b=>b.pairs);

const ROUNDS = 10;
let block = BLOCKS[0], queue = [], idx = 0, right = 0, missed = [], t0 = 0, locked = false;

const $stage = document.getElementById('stage');
const $score = document.getElementById('score');
const $rec   = document.getElementById('rec');

/* ---- голос ---- */
let voice = null;
function pickVoice(){
  const vs = speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));
  if(!vs.length){ document.getElementById('warn').style.display='block'; return; }
  document.getElementById('warn').style.display='none';
  voice = vs.find(v=>/en-GB/i.test(v.lang)) || vs.find(v=>/en-US/i.test(v.lang)) || vs[0];
}
pickVoice();
speechSynthesis.onvoiceschanged = pickVoice;

function say(w, rate){
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(w);
    u.lang = voice ? voice.lang : 'en-GB';
    if(voice) u.voice = voice;
    u.rate = rate || .78;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ---- рекорды ---- */
function recKey(){ return 'milana:'+block.id; }
function getRec(){ try{ return JSON.parse(localStorage.getItem(recKey())||'null'); }catch(e){ return null; } }
function setRec(r){ try{ localStorage.setItem(recKey(), JSON.stringify(r)); }catch(e){} }
function showRec(){
  const r = getRec();
  $rec.textContent = r ? ('рекорд: '+r.right+' из '+ROUNDS+' · '+r.sec+' сек') : 'рекорда пока нет';
}

/* ---- кнопки блоков ---- */
const $blocks = document.getElementById('blocks');
BLOCKS.forEach(b=>{
  const btn = document.createElement('button');
  btn.className='blk'; btn.textContent=b.name; btn.setAttribute('aria-pressed', b===block);
  btn.onclick=()=>{ block=b; [...$blocks.children].forEach(c=>c.setAttribute('aria-pressed','false')); btn.setAttribute('aria-pressed','true'); start(); };
  $blocks.appendChild(btn);
});

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; }

function start(){
  queue = shuffle(block.pairs);
  while(queue.length < ROUNDS) queue = queue.concat(shuffle(block.pairs));
  queue = queue.slice(0,ROUNDS);
  idx=0; right=0; missed=[]; t0=0; locked=false;
  showRec(); $score.innerHTML=''; round();
}

function round(){
  if(idx>=ROUNDS) return finish();
  if(!t0) t0 = Date.now();
  locked = false;
  const pair = queue[idx];
  const target = pair[Math.random()<.5?0:1];
  const order = shuffle(pair);

  $stage.innerHTML = '';
  const hint = document.createElement('p');
  hint.className='hint';
  hint.textContent = 'Слово ' + (idx+1) + ' из ' + ROUNDS + ' — слушай и нажимай';
  const play = document.createElement('button');
  play.className='big'; play.textContent='🔊 Слушать ещё раз';
  play.onclick = ()=> say(target);
  const opts = document.createElement('div');
  opts.className='opts';

  order.forEach(w=>{
    const b = document.createElement('button');
    b.className='opt'; b.textContent=w;
    b.onclick = ()=>{
      if(locked) return;
      locked = true;
      [...opts.children].forEach(c=>c.disabled=true);
      if(w===target){ b.classList.add('good'); right++; }
      else{
        b.classList.add('bad');
        [...opts.children].find(c=>c.textContent===target).classList.add('good');
        missed.push(target+' — '+w);
      }
      say(target, .7);
      setTimeout(()=>{ idx++; round(); }, w===target ? 850 : 1500);
    };
    opts.appendChild(b);
  });

  $stage.append(hint, play, opts);
  setTimeout(()=>say(target), 260);
}

function finish(){
  const sec = Math.round((Date.now()-t0)/1000);
  const r = getRec();
  const better = !r || right>r.right || (right===r.right && sec<r.sec);
  if(better) setRec({right:right, sec:sec});
  showRec();

  $stage.innerHTML='';
  const d = document.createElement('div');
  d.className='done';
  d.textContent = right + ' из ' + ROUNDS + (better ? ' — рекорд!' : '');
  const time = document.createElement('p');
  time.className='hint'; time.textContent = sec + ' секунд';
  $stage.append(d, time);

  if(missed.length){
    const m = document.createElement('p');
    m.className='miss'; m.textContent = 'Повторить: ' + missed.join(' · ');
    $stage.appendChild(m);
  }
  const row = document.createElement('div');
  row.className='row';
  const again = document.createElement('button');
  again.className='big'; again.textContent='Ещё раз';
  again.onclick = start;
  row.appendChild(again);

  if(missed.length){
    const fix = document.createElement('button');
    fix.className='ghost'; fix.textContent='Прослушать ошибки';
    fix.onclick = ()=>{
      const list = missed.map(s=>s.split(' — ')[0]);
      list.forEach((w,i)=> setTimeout(()=>say(w,.65), i*1100));
    };
    row.appendChild(fix);
  }
  $stage.appendChild(row);

  $score.innerHTML =
    '<div><b>'+right+'</b><span>верно из '+ROUNDS+'</span></div>' +
    '<div><b>'+sec+'</b><span>секунд</span></div>' +
    '<div><b>'+missed.length+'</b><span>ошибок</span></div>';
}

start();
</script>
</body>
</html>
