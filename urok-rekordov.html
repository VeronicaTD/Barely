<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Урок рекордов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Unbounded:wght@500;700;800&display=swap">
<style>
html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: школьная тетрадь в клетку; сверху полоса уровней, ниже одна большая рабочая зона уровня */
:root{
  --paper:#F3F6FA; --grid:#DCE5F0; --card:#FFFFFF; --ink:#18223A; --muted:#5B6782;
  --pen:#2B47C9; --pen-soft:#E3E8FB; --red:#D2402F; --red-soft:#FBE4E0;
  --ok:#1E8A55; --ok-soft:#DDF3E7; --dg:#C2410C; --dg-soft:#FFE7D6;
  --vowel:#7A3FB8; --vowel-soft:#EFE5FA; --line:#C9D4E3;
  --f-word:"Andika","Comic Sans MS",system-ui,sans-serif;
  --f-head:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Andika",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#131A2B; --grid:#1D2740; --card:#1B2438; --ink:#EEF2FA; --muted:#9AA6C2;
  --pen:#8EA2FF; --pen-soft:#25305A; --red:#FF7B6B; --red-soft:#4A2221;
  --ok:#5BD69A; --ok-soft:#173A2B; --dg:#FF9F5A; --dg-soft:#47290F;
  --vowel:#C79BFF; --vowel-soft:#33224D; --line:#2C3956; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#131A2B; --grid:#1D2740; --card:#1B2438; --ink:#EEF2FA; --muted:#9AA6C2;
  --pen:#8EA2FF; --pen-soft:#25305A; --red:#FF7B6B; --red-soft:#4A2221;
  --ok:#5BD69A; --ok-soft:#173A2B; --dg:#FF9F5A; --dg-soft:#47290F;
  --vowel:#C79BFF; --vowel-soft:#33224D; --line:#2C3956; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;padding-inline:16px;padding-block:0 40px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--pen);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);
  margin-inline:-16px;padding:10px 16px;border-bottom:2px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.brand{font-family:var(--f-head);font-weight:800;font-size:15px;letter-spacing:.02em;margin-right:6px;white-space:nowrap}
.brand b{color:var(--red)}
.pills{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.pill{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);background:var(--card);font-family:var(--f-head);font-size:13px;font-weight:700}
.pill.on{background:var(--pen);border-color:var(--pen);color:var(--card)}
.pill.done{border-color:var(--ok);color:var(--ok)}
.tool{padding:7px 12px;border-radius:999px;border:2px solid var(--line);background:var(--card);font-size:14px;white-space:nowrap}
.tool.on{border-color:var(--pen);color:var(--pen)}

main{max-width:1100px;margin:0 auto;padding-top:22px}
.lvlhead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.lvlnum{font-family:var(--f-head);font-weight:800;font-size:56px;line-height:.9;color:var(--pen)}
.lvlttl{font-family:var(--f-head);font-weight:700;font-size:clamp(20px,3vw,30px);line-height:1.1;text-wrap:balance}
.lvlsub{color:var(--muted);font-size:16px}
.teacher{background:var(--card);border:2px dashed var(--line);border-radius:12px;padding:10px 14px;margin-bottom:16px;font-size:15px;color:var(--muted)}
.teacher i{color:var(--ink)}
.teacher[hidden]{display:none!important}

.panel{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:clamp(14px,3vw,26px)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.gap{height:16px}
.btn{padding:12px 20px;border-radius:12px;background:var(--pen);color:var(--card);font-weight:700;font-size:17px}
.btn.ghost{background:var(--pen-soft);color:var(--pen)}
.btn.red{background:var(--red);color:var(--card)}
.btn.big{font-size:20px;padding:14px 26px}
.navbar{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}

.word{font-family:var(--f-word);font-weight:700;letter-spacing:.02em}
.dg{color:var(--dg);background:var(--dg-soft);border-radius:6px;padding:0 2px}
.chg{color:var(--red);text-decoration:underline;text-decoration-thickness:4px;text-underline-offset:6px}
.vw{color:var(--vowel)}

/* speed column */
.speedgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.sw{font-family:var(--f-word);font-weight:700;font-size:clamp(28px,4vw,40px);padding:10px 8px;border-radius:12px;border:2px solid transparent;text-align:center;background:var(--paper)}
.sw.e1{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.sw.e2{border-color:var(--vowel);background:var(--vowel-soft);color:var(--vowel)}
.timer{font-family:var(--f-head);font-weight:800;font-size:44px;font-variant-numeric:tabular-nums;min-width:4.2ch}
.stat{display:inline-flex;flex-direction:column;padding:8px 14px;border-radius:12px;background:var(--paper);border:2px solid var(--line)}
.stat small{font-size:13px;color:var(--muted)}
.stat b{font-family:var(--f-head);font-size:22px;font-variant-numeric:tabular-nums}
.legend{font-size:14px;color:var(--muted)}

/* choice cards */
.choices{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.choice{font-family:var(--f-word);font-weight:700;font-size:clamp(30px,5vw,48px);padding:18px 10px;border-radius:16px;border:3px solid var(--line);background:var(--card);text-align:center}
.choice.good{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.choice.bad{border-color:var(--red);background:var(--red-soft);color:var(--red);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.progress{font-family:var(--f-head);font-weight:700;color:var(--muted)}

/* mouths */
.mouths{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.mouth{border:3px solid var(--line);border-radius:18px;padding:16px;background:var(--card);text-align:left;display:flex;flex-direction:column;gap:6px}
.mouth .L{font-family:var(--f-word);font-weight:700;font-size:72px;line-height:1;color:var(--pen)}
.mouth .d{font-size:16px}
.mouth .ex{font-family:var(--f-word);font-size:20px;color:var(--muted)}
.mouth.good{border-color:var(--ok);background:var(--ok-soft)}
.mouth.bad{border-color:var(--red);background:var(--red-soft)}
.warn{color:var(--red);font-weight:700}

/* sort */
.current{font-family:var(--f-word);font-weight:700;font-size:clamp(54px,9vw,90px);text-align:center;padding:10px 0 18px}
.cols{display:grid;gap:10px;grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:560px){.cols{grid-template-columns:repeat(2,minmax(0,1fr))}}
.col{border:3px solid var(--line);border-radius:16px;min-height:200px;display:flex;flex-direction:column;background:var(--paper)}
.col>button{font-family:var(--f-word);font-weight:700;font-size:34px;padding:10px;border-bottom:3px solid var(--line);color:var(--dg)}
.col.bad{border-color:var(--red);animation:shake .35s}
.col ul{list-style:none;margin:0;padding:8px;display:flex;flex-direction:column;gap:4px}
.col li{font-family:var(--f-word);font-weight:700;font-size:24px;text-align:center}

/* ladder */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tab{padding:8px 14px;border-radius:999px;border:2px solid var(--line);background:var(--card);font-weight:700}
.tab.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.ladder{display:flex;flex-direction:column;gap:6px}
.step{display:flex;align-items:center;gap:14px;font-family:var(--f-word);font-weight:700;font-size:clamp(30px,5vw,46px)}
.step .ch{font-family:var(--f-body);font-size:18px;color:var(--muted);font-weight:400}
.step.hid{opacity:.15}
.ladderwrap{display:grid;grid-template-columns:minmax(0,1fr);gap:4px}

/* vowels */
.anchors{display:grid;gap:12px;grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:620px){.anchors{grid-template-columns:repeat(3,minmax(0,1fr))}}
.anchor{border:3px solid var(--line);border-radius:18px;padding:12px 6px;background:var(--card);display:flex;flex-direction:column;align-items:center;gap:2px}
.anchor .e{font-size:46px;line-height:1.1}
.anchor .v{font-family:var(--f-word);font-weight:700;font-size:48px;line-height:1;color:var(--vowel)}
.anchor .w{font-family:var(--f-word);font-size:20px}
.anchor.good{border-color:var(--ok);background:var(--ok-soft)}
.anchor.bad{border-color:var(--red);background:var(--red-soft);animation:shake .35s}
.frame{font-family:var(--f-word);font-weight:700;font-size:clamp(60px,11vw,110px);text-align:center;line-height:1.1;padding:8px 0}
.slot{display:inline-block;min-width:.8em;border-bottom:6px solid var(--vowel);color:var(--vowel)}
.vbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.vbtn{width:68px;height:68px;border-radius:16px;border:3px solid var(--vowel);color:var(--vowel);background:var(--vowel-soft);font-family:var(--f-word);font-weight:700;font-size:38px}
.vbtn.used{background:var(--vowel);color:var(--card)}
.vbtn.no{border-color:var(--line);color:var(--muted);background:var(--paper);text-decoration:line-through}
.found{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;min-height:52px;margin-top:12px}
.found span{font-family:var(--f-word);font-weight:700;font-size:32px;padding:2px 12px;border-radius:10px;background:var(--paper)}
.note{text-align:center;color:var(--muted);min-height:26px}
.pic{font-size:clamp(70px,12vw,120px);text-align:center;line-height:1.1}

/* dictation */
.dict{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.ditem{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:14px;padding:10px;background:var(--paper)}
.ditem .n{font-family:var(--f-head);font-weight:700;color:var(--muted);width:1.6em}
.ditem .ans{font-family:var(--f-word);font-weight:700;font-size:28px;flex:1;text-align:right;min-width:0}
.ico{width:44px;height:44px;border-radius:12px;background:var(--pen-soft);color:var(--pen);font-size:20px;flex:none}

/* catch */
.catch{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.citem{border:3px solid var(--line);border-radius:16px;padding:12px;background:var(--card);display:flex;flex-direction:column;gap:10px;align-items:center}
.citem .word{font-size:44px}
.citem.good{border-color:var(--ok);background:var(--ok-soft)}
.citem.bad{border-color:var(--red);background:var(--red-soft)}
.citem .row{justify-content:center}
.small{font-size:14px;color:var(--muted);text-align:center}

/* text */
.textlines{display:flex;flex-direction:column;gap:6px}
.tl{display:flex;gap:16px;align-items:center;padding:6px 10px;border-radius:14px}
.tl .p{font-size:clamp(34px,5vw,48px);width:2.6em;text-align:center;flex:none}
.tl .t{font-family:var(--f-word);font-weight:700;font-size:clamp(26px,4.2vw,42px);line-height:1.25;min-width:0}
.tl.cur{background:var(--pen-soft)}
.tl.hid .t{visibility:hidden}
.tl .q{font-size:15px;color:var(--pen);margin-top:2px;font-family:var(--f-body);font-weight:400}
.qa{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.qa div{padding:12px;border-radius:12px;background:var(--paper);font-family:var(--f-word);font-size:24px;font-weight:700}

/* results */
.results{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.res{border:2px solid var(--line);border-radius:16px;padding:14px;background:var(--paper)}
.res small{color:var(--muted);font-size:14px;display:block}
.res b{font-family:var(--f-head);font-size:30px;font-variant-numeric:tabular-nums;display:block;line-height:1.2}
.res span{font-size:15px}
.bars{display:flex;gap:14px;align-items:flex-end;height:180px;margin-top:10px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-end;height:100%}
.bar i{display:block;width:100%;max-width:90px;border-radius:10px 10px 0 0;background:var(--pen-soft);border:2px solid var(--pen)}
.bar.now i{background:var(--pen)}
.bar b{font-family:var(--f-head);font-size:20px}
.bar small{color:var(--muted);font-size:13px}

/* home */
.map{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.mcard{border:2px solid var(--line);border-radius:16px;padding:14px;background:var(--card);text-align:left;display:flex;gap:12px;align-items:flex-start}
.mcard .n{font-family:var(--f-head);font-weight:800;font-size:30px;color:var(--pen);line-height:1;min-width:1.4em}
.mcard b{display:block;font-size:17px}
.mcard small{color:var(--muted);font-size:14px}
.mcard.done{border-color:var(--ok)}
.mcard.done .n{color:var(--ok)}
.hero{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.hero h1{font-family:var(--f-head);font-weight:800;font-size:clamp(30px,6vw,56px);line-height:1;margin:0;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--red)}
.hero p{margin:6px 0 0;color:var(--muted);max-width:60ch}
</style>

</head>
<body>
<div class="top">
  <div class="brand">Урок <b>рекордов</b></div>
  <nav class="pills" id="pills"></nav>
  <button class="tool" id="tts" title="Озвучка слов">🔊 голос</button>
  <button class="tool" id="tch" title="Подсказки для учителя">учитель</button>
</div>
<main id="app"></main>

<script>
(()=>{
const $=(s,r=document)=>r.querySelector(s);
const h=(tag,attrs={},...kids)=>{const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs||{})){if(k==='class')e.className=v;else if(k==='html')e.innerHTML=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(v!==false&&v!=null)e.setAttribute(k,v)}for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(c))}return e};
const store={get(k,d){try{const v=localStorage.getItem('rekordy_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('rekordy_'+k,JSON.stringify(v))}catch(e){}}};
const R=store.get('results',{});
const saveR=()=>store.set('results',R);
let teacherOn=store.get('teacher',true), ttsOn=store.get('tts',true);

/* ---------- голос ---------- */
let voice=null;
function pickVoice(){if(!('speechSynthesis'in window))return;const vs=speechSynthesis.getVoices();voice=vs.find(v=>/en[-_]GB/i.test(v.lang)&&/female|Google UK|Serena|Kate|Libby|Sonia/i.test(v.name))||vs.find(v=>/en[-_]GB/i.test(v.lang))||vs.find(v=>/en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null}
if('speechSynthesis'in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(t,rate=.8){if(!ttsOn||!('speechSynthesis'in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);if(voice)u.voice=voice;u.lang=voice?voice.lang:'en-GB';u.rate=rate;speechSynthesis.speak(u)}catch(e){}}

/* ---------- разметка слов ---------- */
const DG=/(th|sh|ch|ck)/g;
const markDg=w=>w.replace(DG,'<span class="dg">$1</span>');
const VOW=/[aeiou]/g;
const markV=w=>w.replace(/(th|sh|ch|ck)|([aeiou])/g,(m,d,v)=>d?m:`<span class="vw">${v}</span>`);
const tok=w=>{const out=[];for(let i=0;i<w.length;){const two=w.slice(i,i+2);if(/^(th|sh|ch|ck|ss)$/.test(two)){out.push(two);i+=2}else{out.push(w[i]);i++}}return out};
function diffWords(a,b){const A=tok(a),B=tok(b);if(A.length!==B.length)return{html:b,from:'',to:''};let from='',to='';const html=B.map((t,i)=>{if(t!==A[i]){from=A[i];to=t;return`<span class="chg">${t}</span>`}return t}).join('');return{html,from,to}}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

/* ---------- таймер ---------- */
function makeTimer(onStop){let t0=0,acc=0,raf=0,run=false;const el=h('div',{class:'timer'},'0.0');
  const draw=()=>{el.textContent=((acc+(run?performance.now()-t0:0))/1000).toFixed(1);if(run)raf=requestAnimationFrame(draw)};
  return{el,start(){if(run)return;run=true;t0=performance.now();draw()},stop(){if(!run)return;acc+=performance.now()-t0;run=false;cancelAnimationFrame(raf);draw();onStop&&onStop(+(acc/1000).toFixed(1))},reset(){run=false;acc=0;cancelAnimationFrame(raf);draw()},get running(){return run},get value(){return +((acc+(run?performance.now()-t0:0))/1000).toFixed(1)}}}

/* ---------- данные урока ---------- */
const L1=['cat','duck','pen','fly','ship','sock','chip','nest','yes','hot','fish','bed','jump','much','sun','my','lock','bus','dish','hill'];
const L10=['thin','wet','sit','tin','with','bath','set','win','ten','that','sock','them','wish','tap','moth','web','sick','path','tub','then'];
const TEXT=[
 {p:'🐱',t:'Seth has a thin cat.',q:'Is the cat thin or big?'},
 {p:'🐱👧',t:'The cat is with Beth.',q:'Who is the cat with?'},
 {p:'🛁',t:'Beth sits in the bath.',q:'Where is Beth?'},
 {p:'🐈🧺',t:'The cat is on the bath mat.',q:'Where is the cat?'},
 {p:'💦',t:'Then the cat gets wet!',q:'Is the cat wet?'},
 {p:'😿',t:'It is sad. It is not fun.',q:'Is the cat sad?'},
 {p:'🐟🍽️',t:'Beth has fish in a dish.',q:'What has Beth got?'},
 {p:'🐱🐟',t:'The wet cat sits with Beth and has the fish.',q:'Has the cat got the fish?'}];
const TEXTWORDS=TEXT.reduce((n,l)=>n+l.t.split(/\s+/).length,0);

const LEVELS=[
 {n:1,t:'Столбик на скорость',s:'20 старых слов против рекорда',min:4},
 {n:2,t:'Что слышишь?',s:'thin · tin · sin · win',min:4},
 {n:3,t:'Четыре рта',s:'th · t · s · w',min:4},
 {n:4,t:'Две буквы — один звук',s:'th sh ch ck в цвете и без',min:5},
 {n:5,t:'Разложи по колонкам',s:'th · t · s · w',min:6},
 {n:6,t:'Лесенки: согласные',s:'меняем один звук',min:6},
 {n:7,t:'Пять гласных',s:'якоря, сетка, лесенки, пропуски',min:10},
 {n:8,t:'Диктант',s:'пишу только звук',min:4},
 {n:9,t:'Поймай ошибку',s:'учитель ошибается',min:2},
 {n:10,t:'Смешанный столбик',s:'20 слов, две цифры ошибок',min:4},
 {n:11,t:'Текст',s:`8 строк · ${TEXTWORDS} слов`,min:12},
 {n:12,t:'Цифра дня',s:'все рекорды урока',min:3},
 {n:13,t:'Бонус',s:'скороговорки и резерв',min:0}];

/* ---------- каркас ---------- */
let cur=store.get('cur',0);
const app=$('#app');
function renderPills(){const p=$('#pills');p.innerHTML='';p.append(h('button',{class:'pill'+(cur===0?' on':''),title:'Карта уровней',onclick:()=>go(0)},'⌂'));LEVELS.forEach(l=>p.append(h('button',{class:'pill'+(cur===l.n?' on':'')+(R['done'+l.n]?' done':''),title:l.t,onclick:()=>go(l.n)},l.n===13?'★':String(l.n))))}
function teacher(html){return h('div',{class:'teacher',hidden:!teacherOn,html})}
