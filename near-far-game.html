<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>This, That, These, Those</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbf4e6; --ink:#2b2622; --muted:#7a6f63; --card:#fffdf8; --line:#eadfcb;
  --sun:#ffb81c; --sun-d:#e09600; --ok:#2fb36b; --bad:#ef4b3f; --blue:#5a8ff0;
  --near:#ff7a45; --far:#5a8ff0;
  --r:18px; --r-s:12px;
  --shadow:0 4px 0 rgba(43,38,34,.12), 0 10px 24px rgba(43,38,34,.08);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;min-height:100dvh;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun-d);outline-offset:2px}

.wrap{max-width:980px;margin:0 auto;padding:16px 14px 30px;display:grid;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:'Fredoka';font-weight:700;margin:0;font-size:clamp(24px,4.4vw,38px);line-height:1}
h1 small{display:block;font-size:.45em;color:var(--muted);font-weight:600;margin-top:4px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.stars{display:flex;gap:4px;flex-wrap:wrap}
.stars span{font-size:20px;filter:grayscale(1);opacity:.3;transition:transform .3s}
.stars span.on{filter:none;opacity:1;transform:scale(1.12)}
.stars span.half{filter:none;opacity:.6}
.stars span.cur{opacity:.8;filter:none;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.2)}}

/* ---------------- 3D CLASSROOM ---------------- */
.stage{perspective:1100px}
.room{
  position:relative;aspect-ratio:16/10;border-radius:22px;overflow:hidden;box-shadow:var(--shadow);
  background:#f6e9cf;transform-style:preserve-3d;transition:transform .25s ease-out;
}
.wall{position:absolute;left:0;right:0;top:0;height:40%;
  background:linear-gradient(#cfe8d7,#bfe0ca);border-bottom:6px solid #9fc9ad}
.floor{position:absolute;left:0;right:0;bottom:0;height:60%;
  background:
    repeating-linear-gradient(90deg, transparent 0 calc(10% - 2px), rgba(120,80,40,.12) calc(10% - 2px) 10%),
    linear-gradient(#e7c99a,#d6a96b);
  transform-origin:50% 0;transform:perspective(500px) rotateX(38deg) scaleX(1.7);
}
.window{position:absolute;top:9%;width:13%;height:20%;background:linear-gradient(#bfe3ff,#e8f6ff);
  border:5px solid #fff;border-radius:6px;box-shadow:inset 0 0 0 2px #d9eefc}
.window::after{content:'';position:absolute;left:50%;top:0;bottom:0;width:4px;background:#fff;transform:translateX(-50%)}
.clock{position:absolute;top:8%;right:6%;width:6%;aspect-ratio:1;border-radius:50%;background:#fff;border:4px solid var(--ink)}
.clock::before,.clock::after{content:'';position:absolute;left:50%;bottom:50%;width:3px;background:var(--ink);transform-origin:50% 100%;border-radius:2px}
.clock::before{height:35%;transform:translateX(-50%) rotate(40deg)}
.clock::after{height:25%;transform:translateX(-50%) rotate(-70deg)}

.zone-tag{position:absolute;left:50%;transform:translateX(-50%);font-weight:800;font-size:12px;letter-spacing:.06em;
  color:rgba(43,38,34,.25);text-transform:uppercase;pointer-events:none}

.kid{position:absolute;left:3%;bottom:2%;width:20%;z-index:5;filter:drop-shadow(0 6px 6px rgba(0,0,0,.2))}
.hand{position:absolute;z-index:6;font-size:clamp(30px,5.5vw,52px);transform-origin:20% 50%;transition:transform .5s cubic-bezier(.2,1.4,.4,1)}

.objs{position:absolute;inset:0;z-index:3}
.obj{position:absolute;transform:translate(-50%,-100%);display:flex;gap:2%;align-items:flex-end;
  animation:land .55s cubic-bezier(.2,1.4,.4,1) backwards}
.obj .o{display:grid;place-items:center;line-height:1}
.obj.near .o{width:clamp(56px,11vw,110px);height:clamp(56px,11vw,110px);font-size:clamp(46px,9vw,92px)}
.obj.far  .o{width:clamp(26px,5vw,48px);height:clamp(26px,5vw,48px);font-size:clamp(22px,4vw,40px)}
.obj.wallitem{transform:translate(-50%,0)}
.obj.wallitem .o{width:clamp(70px,14vw,140px)!important;height:auto!important}
.obj .o svg{width:100%;height:100%;display:block}
.obj::after{content:'';position:absolute;left:10%;right:10%;bottom:-4px;height:8px;border-radius:50%;background:rgba(0,0,0,.15);z-index:-1}
.obj.wallitem::after{display:none}
@keyframes land{from{opacity:0;transform:translate(-50%,-160%) scale(.6)}}
.obj.wallitem{animation-name:landw}
@keyframes landw{from{opacity:0;transform:translate(-50%,-40%) scale(.6)}}

svg.ray{position:absolute;inset:0;width:100%;height:100%;z-index:4;pointer-events:none}
svg.ray line{stroke:var(--ink);stroke-width:3;stroke-dasharray:2 9;stroke-linecap:round;opacity:.35;
  animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-22}}

.bubble{position:absolute;left:3%;top:4%;z-index:7;background:#fff;border:3px solid var(--ink);border-radius:20px;
  padding:10px 16px;font-family:'Fredoka';font-weight:600;font-size:clamp(18px,3.2vw,30px);
  box-shadow:0 4px 0 var(--ink);max-width:46%;}
.bubble::after{content:'';position:absolute;left:18px;bottom:-14px;width:18px;height:18px;background:#fff;
  border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:rotate(45deg)}
.bubble .gap{display:inline-block;min-width:3.4em;border-bottom:3px dashed var(--muted);color:var(--ok)}
.bubble.pop{animation:bpop .4s cubic-bezier(.2,1.5,.4,1)}
@keyframes bpop{from{transform:scale(.6);opacity:0}}

/* ---------------- CONTROL CARD ---------------- */
.card{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:16px 18px;display:grid;gap:12px}
.task{font-family:'Fredoka';font-weight:600;font-size:clamp(20px,3.6vw,28px);margin:0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.task .ru{font-family:'Nunito';font-size:15px;color:var(--muted);font-weight:700}
.hints{display:flex;gap:8px;flex-wrap:wrap;min-height:0}
.hint-chip{border-radius:999px;padding:7px 14px;font-weight:800;font-size:15px;color:#fff;animation:bpop .35s}
.hint-chip.near{background:var(--near)} .hint-chip.far{background:var(--far)}
.hint-chip.one{background:#2fb36b} .hint-chip.many{background:#9b5de5}
.table4{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px;font-weight:800;font-size:14px;max-width:420px;animation:bpop .35s}
.table4 div{padding:6px 10px;border-radius:10px;background:#fff3d4;text-align:center}
.table4 .h{background:transparent;color:var(--muted)}
.table4 .hit{background:var(--ok);color:#fff}

.write{display:flex;gap:10px;flex-wrap:wrap}
.write input{flex:1 1 260px;font:inherit;font-size:22px;font-weight:800;padding:12px 14px;border-radius:var(--r-s);border:2px solid var(--line);background:#fff}
.write input.ok{border-color:var(--ok);background:#e6f7ed}
.write input.no{border-color:var(--bad);background:#fdecea;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.oral{color:var(--muted);font-weight:700;margin:0}
.verdict{font-weight:800;font-size:18px;min-height:24px}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.btn{background:var(--sun);border:none;border-radius:var(--r-s);padding:12px 18px;font-family:'Fredoka';font-weight:600;font-size:19px;
  box-shadow:0 5px 0 var(--sun-d);transition:transform .1s, box-shadow .1s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--sun-d)}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:#fff;border:2px solid var(--line);box-shadow:0 5px 0 var(--line)}
.btn.good{background:var(--ok);color:#fff;box-shadow:0 5px 0 #228c52}
.btn.bad{background:var(--bad);color:#fff;box-shadow:0 5px 0 #c9372d}

.final{text-align:center}
.final .big{font-family:'Fredoka';font-size:clamp(32px,6vw,48px);margin:0}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:3px;animation:fall 1.8s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>This, That, These, Those <small>Our new things</small></h1>
    <div class="tools">
      <button class="chip" id="answerBtn" aria-pressed="false">🗣️ Отвечаем устно</button>
      <button class="chip" id="soundBtn" aria-pressed="false">🔊 Звук</button>
      <button class="chip" id="restartBtn">↺ Заново</button>
    </div>
  </header>
  <div class="stars" id="stars"></div>

  <div class="stage">
    <div class="room" id="room">
      <div class="wall"></div>
      <div class="floor"></div>
      <div class="window" style="left:6%"></div>
      <div class="window" style="left:22%"></div>
      <div class="clock"></div>
      <div class="zone-tag" style="top:43%">far</div>
      <div class="zone-tag" style="bottom:3%">near</div>
      <svg class="ray" id="ray" viewBox="0 0 100 62.5" preserveAspectRatio="none"><line id="rayLine" x1="0" y1="0" x2="0" y2="0" vector-effect="non-scaling-stroke"/></svg>
      <div class="objs" id="objs"></div>
      <svg class="kid" viewBox="0 0 120 170" aria-hidden="true">
        <ellipse cx="60" cy="165" rx="40" ry="5" fill="rgba(0,0,0,.12)"/>
        <rect x="38" y="120" width="16" height="42" rx="7" fill="#33435c"/><rect x="66" y="120" width="16" height="42" rx="7" fill="#33435c"/>
        <path d="M28 82q0-22 32-22t32 22v44H28z" fill="#e8483d"/>
        <rect x="52" y="60" width="16" height="16" fill="#f7c9a0"/>
        <circle cx="60" cy="40" r="28" fill="#f7c9a0"/>
        <path d="M32 36q2-26 28-26t28 22q-8-8-20-8-10 8-36 12z" fill="#3b2a1f"/>
        <circle cx="50" cy="42" r="3.5" fill="#2b2622"/><circle cx="72" cy="42" r="3.5" fill="#2b2622"/>
        <path d="M50 54q10 9 22 0" stroke="#2b2622" stroke-width="3" fill="none" stroke-linecap="round"/>
        <circle cx="44" cy="51" r="4" fill="#f59b8a" opacity=".6"/><circle cx="78" cy="51" r="4" fill="#f59b8a" opacity=".6"/>
      </svg>
      <div class="hand" id="hand">👉</div>
      <div class="bubble" id="bubble"><span class="gap">?</span></div>
    </div>
  </div>

  <main class="card" id="card"></main>
</div>
<div class="confetti" id="confetti"></div>

<script>
/* ===================== НАСТРОЙКИ ===================== */
const ROUNDS_COUNT = 12;

/* Слова урока. one: ед. число, many: мн. число, e: картинка,
   wall: висит на стене, onlyOne: бывает только один (board) */
const WORDS = [
  { one:'computer',    many:'computers',    e:'🖥️' },
  { one:'table',       many:'tables',       e:'table' },
  { one:'chair',       many:'chairs',       e:'🪑' },
  { one:'peg',         many:'pegs',         e:'peg' },
  { one:'pencil case', many:'pencil cases', e:'pencilcase' },
  { one:'ruler',       many:'rulers',       e:'📏' },
  { one:'pencil',      many:'pencils',      e:'✏️' },
  { one:'bag',         many:'bags',         e:'🎒' },
  { one:'board',       many:'boards',       e:'board', onlyOne:true, onlyFar:true, wall:true }
];

const ICONS = {
  table:`<svg viewBox="0 0 48 48"><rect x="4" y="13" width="40" height="7" rx="2" fill="#b5703a"/><rect x="4" y="13" width="40" height="3" rx="1.5" fill="#d08a4e"/><rect x="8" y="20" width="4" height="22" rx="1" fill="#8f5428"/><rect x="36" y="20" width="4" height="22" rx="1" fill="#8f5428"/></svg>`,
  peg:`<svg viewBox="0 0 48 48"><rect x="3" y="8" width="42" height="14" rx="2" fill="#b5703a"/><line x1="3" y1="15" x2="45" y2="15" stroke="#8f5428"/><rect x="19" y="10" width="10" height="10" rx="2" fill="#9aa7b4"/><path d="M24 20v10c0 6 8 6 8 1" fill="none" stroke="#7d8a97" stroke-width="4" stroke-linecap="round"/></svg>`,
  pencilcase:`<svg viewBox="0 0 48 48"><path d="M14 8l3 10M22 6l1 12M30 7l-2 11" stroke="#e8483d" stroke-width="3" stroke-linecap="round"/><rect x="5" y="16" width="38" height="24" rx="8" fill="#ffd23f"/><rect x="11" y="16" width="6" height="24" fill="#5cc35c"/><rect x="23" y="16" width="6" height="24" fill="#5cc35c"/><rect x="35" y="16" width="6" height="24" fill="#5cc35c"/><rect x="5" y="16" width="38" height="24" rx="8" fill="none" stroke="#2b2622" stroke-width="2"/></svg>`,
  board:`<svg viewBox="0 0 64 44"><rect x="2" y="2" width="60" height="36" rx="3" fill="#fff" stroke="#3a6fd8" stroke-width="3"/><rect x="18" y="38" width="28" height="4" rx="2" fill="#9aa7b4"/><path d="M10 12h20M10 20h30" stroke="#d6dbe3" stroke-width="2.5" stroke-linecap="round"/></svg>`
};
const icon = e => ICONS[e] || e;
const ANSWER = { 'near-one':'This', 'far-one':'That', 'near-many':'These', 'far-many':'Those' };

/* ===================== STATE ===================== */
let rounds, r, results, written = false, sound = false, hintLevel, cur, tries;
const $ = id => document.getElementById(id);
const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
const rnd = (a,b) => a + Math.random()*(b-a);
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

let ac;
function beep(f=600,d=.12,type='sine',v=.12){ if(!sound) return;
  try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); const o=ac.createOscillator(),g=ac.createGain();
    o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);
    o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){} }
function speak(t){ try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang='en-GB'; u.rate=.85; speechSynthesis.speak(u);}catch(e){} }
function confetti(n){ if(reduce) return; const box=$('confetti'),cols=['#ffb81c','#ef4b3f','#5a8ff0','#2fb36b','#9b5de5'];
  for(let i=0;i<n;i++){const c=document.createElement('i');c.style.left=Math.random()*100+'vw';c.style.background=cols[i%cols.length];
    c.style.animationDelay=Math.random()*.4+'s';c.style.animationDuration=1.4+Math.random()+'s';box.appendChild(c);setTimeout(()=>c.remove(),2600);} }

/* ===================== ROUNDS ===================== */
function buildRounds(){
  const combos = [];
  const kinds = ['near-one','far-one','near-many','far-many'];
  for (let i = 0; i < ROUNDS_COUNT; i++) combos.push(kinds[i % 4]);
  shuffle(combos);
  // не больше двух одинаковых подряд
  for (let i = 2; i < combos.length; i++)
    if (combos[i] === combos[i-1] && combos[i] === combos[i-2]){ const j = (i+1) % combos.length; [combos[i],combos[j]]=[combos[j],combos[i]]; }
  let pool = [];
  return combos.map(k => {
    const [dist, num] = k.split('-');
    let w, tries = 0;
    do {
      if (!pool.length) pool = shuffle(WORDS.slice());
      w = pool.pop(); tries++;
    } while (tries < 30 && ((w.onlyOne && num === 'many') || (w.onlyFar && dist === 'near')));
    const count = num === 'one' ? 1 : (dist === 'near' ? 2 + Math.floor(Math.random()*2) : 3 + Math.floor(Math.random()*2));
    return { w, dist, num, count, key:k, ans: ANSWER[k] };
  });
}
function sentence(R){
  return R.num === 'one' ? `${R.ans} is a ${R.w.one}.` : `${R.ans} are ${R.w.many}.`;
}

/* ===================== SCENE ===================== */
function placeScene(R){
  const objs = $('objs'); objs.innerHTML = '';
  const el = document.createElement('div');
  el.className = `obj ${R.dist}` + (R.w.wall ? ' wallitem' : '');
  if (R.x == null){
    if (R.w.wall){ R.x = rnd(56, 74); R.y = 7; }
    else if (R.dist === 'far'){ R.x = rnd(58, 82); R.y = rnd(46, 50); }
    else { R.x = rnd(36, 46); R.y = rnd(92, 96); }
  }
  const x = R.x, y = R.y;
  el.style.left = x + '%'; el.style.top = y + '%';
  el.innerHTML = Array.from({length:R.count}, () => `<span class="o">${icon(R.w.e)}</span>`).join('');
  objs.appendChild(el);

  // рука и пунктир
  setTimeout(() => {
    const room = $('room').getBoundingClientRect();
    const ob = el.getBoundingClientRect();
    const hx = 17, hy = 77; // % точки руки
    const tx = ((ob.left + ob.width/2) - room.left) / room.width * 100;
    const ty = ((ob.top + ob.height/2) - room.top) / room.height * 100;
    const hand = $('hand');
    hand.style.left = hx + '%'; hand.style.top = hy + '%';
    const ang = Math.atan2((ty - hy) * room.height, (tx - hx) * room.width) * 180 / Math.PI;
    hand.style.transform = `translateY(-50%) rotate(${ang}deg)`;
    const L = $('rayLine'), k = 62.5/100;
    L.setAttribute('x1', hx + 4); L.setAttribute('y1', hy * k);
    L.setAttribute('x2', tx); L.setAttribute('y2', ty * k);
  }, reduce ? 0 : 600);

  const b = $('bubble');
  b.innerHTML = R.num === 'one'
    ? `<span class="gap">?</span> is a ${R.w.one}.`
    : `<span class="gap">?</span> are ${R.w.many}.`;
  b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop');
}

/* лёгкий 3D-наклон комнаты за мышкой */
$('room').addEventListener('pointermove', e => {
  if (reduce) return;
  const r = $('room').getBoundingClientRect();
  const dx = (e.clientX - r.left) / r.width - .5, dy = (e.clientY - r.top) / r.height - .5;
  $('room').style.transform = `rotateY(${dx*6}deg) rotateX(${-dy*5}deg)`;
});
$('room').addEventListener('pointerleave', () => $('room').style.transform = '');

/* ===================== FLOW ===================== */
function renderStars(){
  $('stars').innerHTML = rounds.map((_,i)=>`<span class="${results[i]==='star'?'on':results[i]==='ok'?'half':''} ${i===r?'cur':''}">⭐</span>`).join('');
}
function start(){ rounds = buildRounds(); r = 0; results = []; showRound(); }

function showRound(){
  cur = rounds[r]; hintLevel = 0; tries = 0;
  renderStars(); placeScene(cur);
  $('card').innerHTML = `
    <p class="task">What does he say? <span class="ru">Что он скажет?</span></p>
    ${written
      ? `<div class="write"><input id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Напиши предложение целиком" aria-label="Ответ"><button class="btn" id="checkBtn">Проверить</button></div>`
      : `<p class="oral">Подумай и скажи всё предложение вслух 🗣️</p>`}
    <div class="hints" id="hints"></div>
    <div class="verdict" id="verdict"></div>
    <div class="row" id="row">
      <button class="btn ghost" id="hintBtn">💡 Подсказка</button>
      ${written ? '' : '<button class="btn" id="showBtn">Показать ответ</button>'}
    </div>`;
  $('hintBtn').onclick = hint;
  if (written){
    $('inp').focus();
    $('checkBtn').onclick = checkWritten;
    $('inp').addEventListener('keydown', e => { if (e.key === 'Enter') checkWritten(); });
  } else {
    $('showBtn').onclick = () => {
      reveal();
      $('row').innerHTML = `<button class="btn bad" id="noBtn">❌ Ошибся</button><button class="btn good" id="yesBtn">✅ Сказал верно</button>`;
      $('yesBtn').onclick = () => done(true);
      $('noBtn').onclick = () => done(false);
    };
  }
}

/* Подсказка в 3 шага: рядом/далеко, потом 1/много, потом табличка */
function hint(){
  hintLevel++;
  const h = $('hints');
  if (hintLevel === 1)
    h.innerHTML += cur.dist === 'near' ? `<span class="hint-chip near">👉 рядом</span>` : `<span class="hint-chip far">🔭 далеко</span>`;
  if (hintLevel === 2)
    h.innerHTML += cur.num === 'one' ? `<span class="hint-chip one">1 предмет</span>` : `<span class="hint-chip many">много</span>`;
  if (hintLevel === 3){
    h.innerHTML += `<div class="table4">
      <div class="h"></div><div class="h">1</div><div class="h">много</div>
      <div class="h">рядом</div><div>this</div><div>these</div>
      <div class="h">далеко</div><div>that</div><div>those</div></div>`;
    $('hintBtn').disabled = true;
  }
  beep(520,.08);
}

function reveal(){
  $('bubble').querySelector('.gap').textContent = cur.ans;
  speak(sentence(cur));
  const v = $('verdict'); v.className = 'verdict'; v.textContent = sentence(cur);
}

function norm(s){
  return s.toLowerCase().replace(/[.,!?]/g,'').replace(/\bthat's\b/g,'that is').replace(/\bnew\b/g,'')
    .replace(/\bthe\b/g,'a').replace(/\ban\b/g,'a').replace(/\s+/g,' ').trim();
}
function checkWritten(){
  const inp = $('inp'), v = $('verdict');
  const got = norm(inp.value); if (!got) return;
  const want = norm(sentence(cur));
  const first = got.split(' ')[0];
  if (got === want){ inp.className = 'ok'; reveal(); return done(true); }
  tries++;
  inp.className=''; void inp.offsetWidth; inp.className='no';
  beep(200,.25,'sawtooth',.06);
  v.className = 'verdict no';
  const D = { this:['near','one'], that:['far','one'], these:['near','many'], those:['far','many'] };
  if (D[first]){
    const [d,n] = D[first];
    if (d !== cur.dist) v.textContent = cur.dist === 'near' ? 'Посмотри: это рядом или далеко?' : 'Посмотри: это далеко или рядом?';
    else if (n !== cur.num) v.textContent = 'Сколько их? Один или много?';
    else v.textContent = cur.num === 'one' ? 'Первое слово верное! Проверь: is a …' : 'Первое слово верное! Проверь: are … (и s в конце)';
  } else v.textContent = 'Начни с This, That, These или Those.';
  if (tries >= 2){ inp.disabled = true; $('checkBtn').disabled = true; reveal(); return done(false); }
  inp.select();
}

function done(ok){
  if (ok){
    results[r] = hintLevel === 0 && tries === 0 ? 'star' : 'ok';
    const v = $('verdict'); v.className = 'verdict ok'; v.textContent = `Yes! ${sentence(cur)} ⭐`;
    confetti(28); beep(660,.1); setTimeout(()=>beep(880,.15),110);
  } else {
    results[r] = 'miss';
    const v = $('verdict'); v.className = 'verdict no'; v.textContent = `Правильно: ${sentence(cur)}`;
  }
  renderStars();
  $('row').innerHTML = `<button class="btn" id="nextBtn">${r === rounds.length-1 ? 'Финиш!' : 'Дальше'}</button>`;
  $('nextBtn').focus();
  $('nextBtn').onclick = () => { r++; r < rounds.length ? showRound() : finish(); };
}

function finish(){
  const stars = results.filter(x=>x==='star').length, ok = results.filter(x=>x==='ok').length;
  renderStars(); confetti(90); speak('Well done!');
  $('objs').innerHTML = ''; $('bubble').innerHTML = 'Well done! 🎉'; $('rayLine').setAttribute('x2', $('rayLine').getAttribute('x1'));
  $('card').innerHTML = `<div class="final">
    <p class="big">Well done! 🎉</p>
    <p>Сам, без подсказок: <b>${stars} из ${rounds.length}</b> ⭐<br>С подсказкой: <b>${ok}</b></p>
    <button class="btn" id="againBtn">Играть ещё</button></div>`;
  $('againBtn').onclick = start;
}

$('restartBtn').onclick = start;
$('answerBtn').onclick = () => {
  written = !written; $('answerBtn').setAttribute('aria-pressed', written);
  $('answerBtn').textContent = written ? '✍️ Отвечаем письменно' : '🗣️ Отвечаем устно';
  showRound();
};
$('soundBtn').onclick = () => { sound=!sound; $('soundBtn').setAttribute('aria-pressed',sound); $('soundBtn').textContent = sound?'🔊 Звук вкл':'🔊 Звук'; beep(700,.1); };
addEventListener('resize', () => cur && placeScene(cur));
start();
</script>
</body>
</html>
