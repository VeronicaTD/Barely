<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ghostbasket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Grandstander:wght@700;800&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --sky1:#1B1035; --sky2:#3A1C5C; --ink:#FFF4E6; --muted:#D9C7F2;
  --card:#2A1748; --line:#5B3A86; --pumpkin:#FF8A1F; --pumpkin2:#C85A00;
  --moon:#FFE7A3; --slime:#8BE04E; --ok:#8BE04E; --okbg:#2E4A1E;
  --hint:#FFE7A3; --hintink:#3A2600;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%}
body{color:var(--ink);font-family:"Nunito",system-ui,sans-serif;font-size:18px;line-height:1.45;
  background:radial-gradient(circle at 82% 8%, rgba(255,231,163,.25) 0 60px, transparent 140px), linear-gradient(180deg,var(--sky1),var(--sky2) 70%,#2B1240);
  background-attachment:fixed;overflow-x:hidden}
.moon{position:fixed;top:24px;right:24px;width:72px;height:72px;border-radius:50%;background:var(--moon);box-shadow:0 0 40px rgba(255,231,163,.6);z-index:0}
.moon::after{content:"";position:absolute;top:14px;left:18px;width:14px;height:14px;border-radius:50%;background:rgba(0,0,0,.08);box-shadow:24px 18px 0 -2px rgba(0,0,0,.07)}
.stars{position:fixed;inset:0;pointer-events:none;z-index:0;background-image:radial-gradient(2px 2px at 10% 20%,#fff8,transparent),radial-gradient(2px 2px at 30% 60%,#fff6,transparent),radial-gradient(1.5px 1.5px at 55% 15%,#fff9,transparent),radial-gradient(2px 2px at 70% 40%,#fff5,transparent),radial-gradient(1.5px 1.5px at 85% 70%,#fff7,transparent),radial-gradient(2px 2px at 20% 85%,#fff5,transparent)}
.bat{position:fixed;font-size:28px;z-index:0;pointer-events:none;animation:batfly 14s linear infinite}
.bat.b2{animation-duration:19s;animation-delay:-7s;font-size:22px}
@keyframes batfly{0%{transform:translate(-60px,120px)}25%{transform:translate(30vw,60px)}50%{transform:translate(60vw,150px)}75%{transform:translate(85vw,70px)}100%{transform:translate(110vw,130px)}}
.wrap{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:20px 16px 40px}
h1{font-family:"Creepster","Grandstander",cursive;font-weight:400;font-size:clamp(46px,11vw,78px);line-height:1;margin:18px 0 6px;color:var(--pumpkin);letter-spacing:2px;text-shadow:0 4px 0 #000a}
.sub{color:var(--muted);margin:0 0 18px;font-weight:800}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--slime);outline-offset:3px}

/* house */
.house{position:relative;max-width:520px;margin:10px auto 0}
.roof{height:clamp(70px,16vw,110px);background:#140B26;clip-path:polygon(50% 0,100% 100%,0 100%);margin:0 -14px}
.walls{background:#2A1A3E;border:4px solid #140B26;border-top:0;padding:12px;display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.room{position:relative;border:0;border-radius:14px;background:#120A22;color:var(--ink);padding:12px 6px;min-height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:inset 0 0 0 4px #4B2E72;transition:transform .12s}
.room:hover{transform:translateY(-3px)}
.room .re{font-size:42px;line-height:1}
.room .rn{font-family:"Grandstander",sans-serif;font-weight:800;font-size:18px}
.room .rs{font-size:14px;min-height:1.2em}
.room.done{background:radial-gradient(circle,#FFB347,#FF8A1F 70%);color:#2A1300;box-shadow:0 0 28px rgba(255,138,31,.7)}
.pumpkins{display:flex;justify-content:space-between;margin:-8px 4px 0;font-size:42px}
.ghost-float{position:absolute;left:-10px;top:10px;width:clamp(64px,16vw,90px);animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(-5deg)}}
.final{display:block;margin:22px auto 0;background:var(--pumpkin);color:#2A1300;border:0;border-radius:999px;padding:16px 28px;font-family:"Grandstander",sans-serif;font-weight:800;font-size:20px;box-shadow:inset 0 -5px 0 var(--pumpkin2),0 0 30px rgba(255,138,31,.5)}
.final:disabled{opacity:.45;box-shadow:none;cursor:default}
.note{text-align:center;color:var(--muted);font-weight:800;margin:10px 0 0}

/* round */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.back{background:transparent;border:2px solid var(--line);border-radius:999px;padding:8px 16px;font-weight:800}
.prog{font-weight:800;color:var(--muted)}
.rtitle{font-family:"Grandstander",sans-serif;font-weight:800;font-size:28px;margin:0 0 12px;display:flex;align-items:center;gap:10px}
.card{position:relative;background:var(--card);border-radius:22px;padding:22px 18px;border:3px solid var(--line);overflow:hidden}
.card.bumped{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.prompt{text-align:center;margin-bottom:16px}
.big{font-family:"Grandstander",sans-serif;font-weight:800;font-size:clamp(32px,8vw,48px);line-height:1.1;margin-top:6px}
.emoji{font-size:56px;line-height:1}
.btnrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.say{background:transparent;border:2px solid var(--line);border-radius:999px;padding:9px 18px;font-weight:800;font-size:17px}
.say.main{background:var(--pumpkin);color:#2A1300;border-color:transparent}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opt{position:relative;background:#1B0F33;border:3px solid var(--line);border-radius:18px;font-size:clamp(46px,12vw,64px);min-height:112px;line-height:1}
.opt:hover:not(:disabled){border-color:var(--pumpkin)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt:disabled{cursor:default}
.hintcard{margin:14px 0 0;padding:12px 14px;border-radius:14px;background:var(--hint);color:var(--hintink);font-weight:800;display:flex;gap:10px;align-items:center}
.hintcard.pulse{animation:shake .45s}
.fb{min-height:1.5em;margin:14px 2px 0;font-weight:800;text-align:center}
.fb b{color:var(--ok)}
.next{display:none;margin:16px auto 0;background:var(--pumpkin);color:#2A1300;border:0;border-radius:999px;padding:12px 28px;font-weight:800;font-size:18px;box-shadow:inset 0 -4px 0 var(--pumpkin2)}
.next.show{display:block}

/* doors */
.doors{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.door{position:relative;height:170px;border:0;border-radius:70px 70px 10px 10px;background:#3B2414;perspective:600px;padding:0;overflow:visible}
.door .inside{position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle at 50% 40%,#FFB347,#5B2A00);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.door .inside .re{font-size:44px}
.door .inside .rl{font-family:"Grandstander",sans-serif;font-weight:800;font-size:17px;color:#2A1300}
.door .panel{position:absolute;inset:0;border-radius:inherit;background:linear-gradient(90deg,#6B3F1F,#8B5A2B);transform-origin:left center;transition:transform .7s;box-shadow:inset 0 0 0 6px #4A2A12;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px}
.door .panel::after{content:"";position:absolute;right:16%;top:52%;width:12px;height:12px;border-radius:50%;background:var(--moon)}
.door .panel .re{font-size:40px;opacity:.95}
.door .panel .rl{font-family:"Grandstander",sans-serif;font-weight:800;font-size:16px;color:#FFE7C8}
.door.open .panel{transform:rotateY(-105deg)}
.door .pop{position:absolute;left:50%;bottom:10px;width:90px;margin-left:-45px;opacity:0;transform:translateY(30px) scale(.6);transition:all .5s .35s}
.door.open .pop{opacity:1;transform:translateY(-40px) scale(1)}

/* catch */
.sky{position:relative;height:340px;border-radius:18px;background:linear-gradient(180deg,#120A22,#2B1648);overflow:hidden}
.flyer{position:absolute;width:104px;height:104px;border:0;background:transparent;padding:0}
.flyer .bk{position:absolute;inset:0}
.flyer .pic{position:absolute;left:0;right:0;top:20px;text-align:center;font-size:40px;line-height:1}
.flyer.gone{transition:transform .8s, opacity .8s;transform:translateY(-320px) scale(.5) rotate(20deg)!important;opacity:0}
.f1{animation:drift1 6s ease-in-out infinite}
.f2{animation:drift2 7s ease-in-out infinite}
.f3{animation:drift3 5.5s ease-in-out infinite}
@keyframes drift1{50%{transform:translate(30px,40px) rotate(6deg)}}
@keyframes drift2{50%{transform:translate(-36px,-30px) rotate(-6deg)}}
@keyframes drift3{50%{transform:translate(20px,-44px) rotate(4deg)}}

/* spell */
.slots{display:flex;justify-content:center;gap:6px;margin:6px 0 18px}
.slot{width:clamp(40px,11vw,62px);height:70px;border-bottom:4px solid var(--pumpkin);display:grid;place-items:center;font-family:"Grandstander",sans-serif;font-weight:800;font-size:38px}
.letters{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.letter{width:clamp(48px,12vw,62px);height:clamp(48px,12vw,62px);border-radius:50% 50% 44% 44%;border:0;background:radial-gradient(circle at 40% 35%,#FFB347,var(--pumpkin) 60%,var(--pumpkin2));color:#2A1300;font-family:"Grandstander",sans-serif;font-weight:800;font-size:28px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2)}
.letter:disabled{opacity:.2}

/* result */
.res{text-align:center}
.res .stars{font-size:44px;letter-spacing:6px}
.res svg{width:110px;margin:0 auto;display:block;animation:bob 2.4s ease-in-out infinite}

/* party */
.party{position:fixed;inset:0;z-index:5;background:linear-gradient(180deg,#0E0720,#2B1240);overflow:hidden;touch-action:manipulation}
.party .hud{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;z-index:3}
.party .count{font-family:"Grandstander",sans-serif;font-weight:800;font-size:26px}
.party .close{background:var(--pumpkin);color:#2A1300;border:0;border-radius:999px;padding:10px 18px;font-weight:800}
.party .msg{position:absolute;left:0;right:0;top:40%;text-align:center;font-family:"Creepster",cursive;font-size:clamp(44px,12vw,80px);color:var(--pumpkin);z-index:3;pointer-events:none;text-shadow:0 4px 0 #000a}
.pg{position:absolute;width:96px;height:96px;border:0;background:transparent;padding:0;z-index:2}
.pg svg{width:100%;height:100%}
.candy{position:absolute;font-size:30px;pointer-events:none;z-index:2;animation:burst .9s ease-out forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) rotate(260deg);opacity:0}}
.pbat{position:absolute;font-size:34px;pointer-events:none;z-index:1;animation:batfly 6s linear infinite}
@media (prefers-reduced-motion: reduce){ .bat,.ghost-float,.f1,.f2,.f3,.res svg,.card.bumped{animation:none} }
</style>
</head>
<body>
<div class="stars"></div><div class="moon"></div>
<div class="bat">🦇</div><div class="bat b2">🦇</div>
<main class="wrap" id="app"></main>

<script>
const GHOST = `<svg viewBox="0 0 120 110" aria-hidden="true">
  <ellipse cx="60" cy="104" rx="40" ry="5" fill="rgba(0,0,0,.25)"/>
  <path d="M14 40 L106 40 L96 98 Q60 104 24 98 Z" fill="#EEF3FA" stroke="#9FB3C8" stroke-width="3"/>
  <g stroke="#B9C8D8" stroke-width="3">
    <line x1="30" y1="48" x2="35" y2="94"/><line x1="46" y1="48" x2="48" y2="97"/><line x1="60" y1="48" x2="60" y2="98"/>
    <line x1="74" y1="48" x2="72" y2="97"/><line x1="90" y1="48" x2="85" y2="94"/>
    <line x1="20" y1="62" x2="100" y2="62"/><line x1="23" y1="78" x2="97" y2="78"/>
  </g>
  <rect x="8" y="32" width="104" height="12" rx="6" fill="#F7FBFF" stroke="#9FB3C8" stroke-width="3"/>
  <rect x="42" y="50" width="36" height="14" rx="7" fill="#1B1035"/>
  <circle cx="52" cy="57" r="3.6" fill="#FF8A1F"/><circle cx="68" cy="57" r="3.6" fill="#FF8A1F"/>
  <path d="M60 10 q8 6 0 12 q-8 6 0 12" fill="none" stroke="#D9C7F2" stroke-width="3" stroke-linecap="round" opacity=".8"/>
</svg>`;
const BASKET = `<svg class="bk" viewBox="0 0 120 110" aria-hidden="true">
  <path d="M14 40 L106 40 L96 98 Q60 104 24 98 Z" fill="#EEF3FA" stroke="#9FB3C8" stroke-width="3"/>
  <rect x="8" y="32" width="104" height="12" rx="6" fill="#F7FBFF" stroke="#9FB3C8" stroke-width="3"/>
  <path d="M24 98 q6 10 12 0 q6 10 12 0 q6 10 12 0 q6 10 12 0 q6 10 12 0 q6 10 12 0" fill="#EEF3FA" stroke="#9FB3C8" stroke-width="3"/>
</svg>`;

const ROUNDS = [
  {id:'words', name:'Listen',     e:'👂', f:440},
  {id:'doors', name:'Doors',      e:'🚪', f:493.88},
  {id:'catch', name:'Catch',      e:'🧺', f:554.37},
  {id:'spell', name:'Spell it',   e:'🎃', f:659.25}
];

const WORDS = [
  {en:'house', e:'🏠'}, {en:'door', e:'🚪'}, {en:'window', e:'🪟'}, {en:'ghost', e:'👻'},
  {en:'basket', e:'🧺'}, {en:'granny', e:'👵'}, {en:'biscuits', e:'🍪'}, {en:'sun', e:'☀️'},
  {en:'bath', e:'🛁'}, {en:'bed', e:'🛏️'}, {en:'dad', e:'👨'}, {en:'mum', e:'👩'}
];
const ROOMS = [
  {en:'kitchen', e:'🍳'}, {en:'bathroom', e:'🛁'}, {en:'bedroom', e:'🛏️'}, {en:'sunroom', e:'☀️'}, {en:'garden', e:'🌳'}
];
const SPELL = [{en:'sun', e:'☀️'}, {en:'bed', e:'🛏️'}, {en:'mum', e:'👩'}, {en:'door', e:'🚪'}, {en:'ghost', e:'👻'}];

const PRAISE = ['Spooky good!', 'Boo-tiful!', 'Super!', 'Well done!', 'Great!'];
const praise = () => PRAISE[Math.floor(Math.random() * PRAISE.length)];

/* helpers */
const app = document.getElementById('app');
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
const results = {};

let actx;
function ctx() { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); return actx; }
function tone(f, t = 0, d = 0.5, vol = 0.22, type = 'triangle') {
  try {
    const a = ctx(), now = a.currentTime + t, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, now); g.gain.exponentialRampToValueAtTime(vol, now + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, now + d);
    o.connect(g).connect(a.destination); o.start(now); o.stop(now + d + 0.05);
  } catch (e) {}
}
function whoo(t = 0, low = 300, high = 540, d = 1, vol = 0.16) {
  try {
    const a = ctx(), now = a.currentTime + t, o = a.createOscillator(), g = a.createGain(), lfo = a.createOscillator(), lg = a.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(low, now); o.frequency.exponentialRampToValueAtTime(high, now + d * .45); o.frequency.exponentialRampToValueAtTime(low * .9, now + d);
    lfo.frequency.value = 6; lg.gain.value = 14; lfo.connect(lg).connect(o.frequency);
    g.gain.setValueAtTime(0.0001, now); g.gain.exponentialRampToValueAtTime(vol, now + .15); g.gain.exponentialRampToValueAtTime(0.0001, now + d);
    o.connect(g).connect(a.destination); o.start(now); lfo.start(now); o.stop(now + d + .05); lfo.stop(now + d + .05);
  } catch (e) {}
}
const bump = () => { tone(110, 0, .22, .25, 'sine'); tone(90, .1, .22, .25, 'sine'); };
const yay = f => { tone(f); tone(f * 1.25, .1); tone(f * 1.5, .2); };
function speak(text) {
  try {
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const vs = speechSynthesis.getVoices();
    const v = vs.find(x => /en-GB/i.test(x.lang)) || vs.find(x => /^en/i.test(x.lang));
    if (v) u.voice = v;
    u.lang = 'en-GB'; u.rate = 0.8;
    speechSynthesis.speak(u);
  } catch (e) {}
}
if ('speechSynthesis' in window) { try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => {}; } catch (e) {} }
const starsFor = errors => errors <= 1 ? 3 : errors <= 3 ? 2 : 1;
const firstLetter = w => `Hint: ${w[0].toUpperCase()}… 🔊`;

/* home */
function home() {
  const allDone = ROUNDS.every(r => results[r.id]);
  app.innerHTML = `
    <h1>Ghostbasket</h1>
    <p class="sub">🎃 Open every room in the haunted house!</p>
    <div class="house">
      <div class="roof"></div>
      <div class="walls">
        ${ROUNDS.map((r, i) => `<button class="room ${results[r.id] ? 'done' : ''}" data-i="${i}" aria-label="${r.name}">
          <span class="re">${r.e}</span><span class="rn">${r.name}</span>
          <span class="rs">${results[r.id] ? '⭐'.repeat(results[r.id].stars) : ''}</span></button>`).join('')}
      </div>
      <div class="pumpkins"><span>🎃</span><span>🕯️</span><span>🎃</span></div>
      <div class="ghost-float">${GHOST}</div>
    </div>
    <button class="final" id="final" ${allDone ? '' : 'disabled'}>👻 Ghost party!</button>
    <p class="note">${allDone ? 'All rooms are open! Tap the button 🎉' : 'Open all 4 rooms to start the ghost party.'}</p>`;
  app.querySelectorAll('.room').forEach(b => b.addEventListener('click', () => {
    const r = ROUNDS[+b.dataset.i]; tone(r.f, 0, .35);
    setTimeout(() => startRound(r), 160);
  }));
  document.getElementById('final').addEventListener('click', ghostParty);
  window.scrollTo(0, 0);
}

function shell(r, i, n, inner, auto) {
  app.innerHTML = `
    <div class="top"><button class="back" id="back">🏚️ House</button><span class="prog">${i + 1} / ${n}</span></div>
    <h2 class="rtitle"><span>${r.e}</span>${r.name}</h2>
    <div class="card">
      ${inner}
      <div class="hintcard" hidden aria-live="polite"><span style="font-size:26px">💡</span><span class="ht"></span></div>
      <div class="fb" aria-live="polite"></div>
      <button class="next">${i + 1 < n ? 'Next ➜' : 'Done ✓'}</button>
    </div>`;
  document.getElementById('back').addEventListener('click', home);
  app.querySelectorAll('[data-say]').forEach(b => b.addEventListener('click', () => speak(b.dataset.say)));
  app.querySelectorAll('[data-show]').forEach(b => b.addEventListener('click', () => {
    app.querySelectorAll('.hidetext').forEach(t => t.hidden = false); b.hidden = true;
  }));
  if (auto) setTimeout(() => speak(auto), 350);
  return {card: app.querySelector('.card'), fb: app.querySelector('.fb'), next: app.querySelector('.next')};
}
const listenBtns = (say, word) => `
  <div class="big hidetext" hidden>${esc(word || say)}</div>
  <div class="btnrow"><button class="say main" data-say="${esc(say)}">🔊 Listen again</button><button class="say" data-show="1">👀 Show text</button></div>`;
function hint(card, text) {
  card.classList.remove('bumped'); void card.offsetWidth; card.classList.add('bumped'); bump();
  const h = card.querySelector('.hintcard'); h.querySelector('.ht').textContent = text; h.hidden = false;
  h.classList.remove('pulse'); void h.offsetWidth; h.classList.add('pulse');
}
function win(r, card, fb, next, text) {
  card.querySelector('.hintcard').hidden = true;
  yay(r.f); fb.innerHTML = `<b>${praise()}</b> ${text}`;
  next.classList.add('show'); next.focus();
}

function startRound(r) {
  if (r.id === 'words') runWords(r);
  else if (r.id === 'doors') runDoors(r);
  else if (r.id === 'catch') runCatch(r);
  else runSpell(r);
}

/* 1. listen and pick the picture */
function runWords(r) {
  const items = shuffle(WORDS).slice(0, 7);
  let i = 0, errors = 0;
  const render = () => {
    const w = items[i], opts = shuffle([w, ...shuffle(WORDS.filter(x => x !== w)).slice(0, 2)]);
    const {card, fb, next} = shell(r, i, items.length, `
      <div class="prompt"><div class="emoji">👂</div>${listenBtns(w.en)}</div>
      <div class="opts">${opts.map(o => `<button class="opt" data-v="${o.en}" aria-label="picture">${o.e}</button>`).join('')}</div>`, w.en);
    const btns = [...card.querySelectorAll('.opt')];
    btns.forEach(b => b.addEventListener('click', () => {
      if (b.dataset.v === w.en) { btns.forEach(x => x.disabled = true); b.classList.add('ok'); speak(w.en); win(r, card, fb, next, `${w.e} ${w.en}`); }
      else { errors++; hint(card, firstLetter(w.en)); }
    }));
    next.addEventListener('click', () => { i++; i < items.length ? render() : finish(r, errors); });
  };
  render();
}

/* 2. haunted doors: hear the room, open the right door, ghostbasket pops out */
function runDoors(r) {
  const items = shuffle(ROOMS).slice(0, 5);
  let i = 0, errors = 0;
  const render = () => {
    const rm = items[i], opts = shuffle([rm, ...shuffle(ROOMS.filter(x => x !== rm)).slice(0, 3)]);
    const {card, fb, next} = shell(r, i, items.length, `
      <div class="prompt"><div class="emoji">🧺❓</div>${listenBtns(rm.en)}</div>
      <div class="doors">${opts.map(o => `<button class="door" data-v="${o.en}">
        <div class="inside"><span class="re">${o.e}</span><span class="rl">${o.en}</span></div>
        <div class="panel"><span class="re">${o.e}</span><span class="rl">${o.en}</span></div>
        <div class="pop">${GHOST}</div></button>`).join('')}</div>`, rm.en);
    const btns = [...card.querySelectorAll('.door')];
    btns.forEach(b => b.addEventListener('click', () => {
      if (b.disabled) return;
      if (b.dataset.v === rm.en) {
        btns.forEach(x => x.disabled = true); b.classList.add('open');
        tone(180, 0, .3, .2, 'sawtooth'); whoo(.4); setTimeout(() => speak('Whoooo!'), 1300);
        win(r, card, fb, next, `${rm.e} ${rm.en}`);
      } else { errors++; hint(card, firstLetter(rm.en)); }
    }));
    next.addEventListener('click', () => { i++; i < items.length ? render() : finish(r, errors); });
  };
  render();
}

/* 3. catch the flying ghostbasket */
function runCatch(r) {
  const items = shuffle(WORDS).slice(0, 6);
  const spots = [[8, 30], [38, 150], [66, 40]];
  let i = 0, errors = 0;
  const render = () => {
    const w = items[i], opts = shuffle([w, ...shuffle(WORDS.filter(x => x !== w)).slice(0, 2)]);
    const {card, fb, next} = shell(r, i, items.length, `
      <div class="prompt">${listenBtns(w.en)}</div>
      <div class="sky">${opts.map((o, k) => `<button class="flyer f${k + 1}" style="left:${spots[k][0]}%;top:${spots[k][1]}px" data-v="${o.en}" aria-label="ghost">${BASKET}<span class="pic">${o.e}</span></button>`).join('')}</div>`, w.en);
    const btns = [...card.querySelectorAll('.flyer')];
    btns.forEach(b => b.addEventListener('click', () => {
      if (b.disabled) return;
      if (b.dataset.v === w.en) {
        btns.forEach(x => x.disabled = true); b.classList.add('gone'); whoo(0, 360, 620, .8, .15);
        setTimeout(() => speak(w.en), 500);
        win(r, card, fb, next, `${w.e} ${w.en}`);
      } else { errors++; hint(card, firstLetter(w.en)); }
    }));
    next.addEventListener('click', () => { i++; i < items.length ? render() : finish(r, errors); });
  };
  render();
}

/* 4. spell it */
function runSpell(r) {
  const items = shuffle(SPELL.slice(0, 4)).concat([SPELL[4]]);
  let i = 0, errors = 0;
  const render = () => {
    const it = items[i], letters = it.en.toUpperCase().split('');
    let pool = shuffle(letters.map((l, k) => ({l, k})));
    if (pool.map(p => p.l).join('') === letters.join('')) pool.reverse();
    const {card, fb, next} = shell(r, i, items.length, `
      <div class="prompt"><div class="emoji" style="font-size:72px">${it.e}</div>
        <div class="btnrow"><button class="say main" data-say="${it.en}">🔊 Listen again</button></div></div>
      <div class="slots"></div><div class="letters"></div>`, it.en);
    const slots = card.querySelector('.slots'), box = card.querySelector('.letters');
    let chosen = [], done = false;
    const draw = () => {
      slots.innerHTML = letters.map((_, k) => `<div class="slot">${chosen[k] ? chosen[k].l : ''}</div>`).join('');
      box.innerHTML = pool.map((p, idx) => `<button class="letter" data-p="${idx}" ${p.used || done ? 'disabled' : ''}>${p.l}</button>`).join('');
      box.querySelectorAll('[data-p]').forEach(b => b.addEventListener('click', () => {
        const p = pool[+b.dataset.p]; p.used = true; chosen.push(p);
        tone(r.f * (0.9 + chosen.length * 0.1), 0, .2, .14);
        if (chosen.length === letters.length) check(); else draw();
      }));
    };
    const check = () => {
      if (chosen.map(p => p.l).join('') === letters.join('')) { done = true; draw(); speak(it.en); win(r, card, fb, next, `${it.e} ${it.en.toUpperCase()}`); }
      else {
        errors++; draw(); hint(card, `Hint: ${letters[0]}… 🔊`);
        setTimeout(() => { chosen = []; pool.forEach(p => p.used = false); draw(); }, 900);
      }
    };
    draw();
    next.addEventListener('click', () => { i++; i < items.length ? render() : finish(r, errors); });
  };
  render();
}

function finish(r, errors) {
  const stars = starsFor(errors), prev = results[r.id];
  if (!prev || stars > prev.stars) results[r.id] = {stars};
  app.innerHTML = `
    <div class="card res">
      ${GHOST}
      <h2 class="rtitle" style="justify-content:center"><span>${r.e}</span>${r.name}</h2>
      <div class="stars">${'⭐'.repeat(stars)}</div>
      <div class="big">${praise()}</div>
      <button class="next show" id="toHome">🏚️ House</button>
    </div>`;
  whoo(0, 330, 600, .9, .14);
  document.getElementById('toHome').addEventListener('click', home);
}

/* final: ghost party — tap flying ghostbaskets, they burst into candy */
function ghostParty() {
  const TOTAL = 10;
  let caught = 0, alive = true;
  const p = document.createElement('div');
  p.className = 'party';
  p.innerHTML = `<div class="hud"><span class="count">👻 0 / ${TOTAL}</span><button class="close">✕</button></div>
    <div class="pbat" style="top:12%">🦇</div><div class="pbat" style="top:60%;animation-delay:-3s">🦇</div>`;
  document.body.appendChild(p);
  const countEl = p.querySelector('.count');
  const close = () => { alive = false; p.remove(); };
  p.querySelector('.close').addEventListener('click', close);
  speak('Ghost party!'); whoo();

  const spawn = () => {
    if (!alive || caught >= TOTAL) return;
    const g = document.createElement('button');
    g.className = 'pg'; g.setAttribute('aria-label', 'ghost');
    g.innerHTML = GHOST;
    const W = p.clientWidth, H = p.clientHeight;
    let x = Math.random() * (W - 96), y = H + 20;
    let vx = (Math.random() - .5) * 2.4, vy = -(1.2 + Math.random() * 1.6), wob = Math.random() * 6;
    g.style.left = x + 'px'; g.style.top = y + 'px';
    p.appendChild(g);
    let raf;
    const step = () => {
      if (!alive || !g.isConnected) return;
      wob += .05; x += vx + Math.sin(wob) * 1.2; y += vy;
      if (x < 0 || x > W - 96) vx = -vx;
      g.style.left = x + 'px'; g.style.top = y + 'px';
      g.style.transform = `rotate(${Math.sin(wob) * 10}deg)`;
      if (y < -110) { g.remove(); return; }
      raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    g.addEventListener('pointerdown', () => {
      cancelAnimationFrame(raf);
      const rect = g.getBoundingClientRect();
      g.remove(); caught++;
      countEl.textContent = `👻 ${caught} / ${TOTAL}`;
      whoo(0, 400 + caught * 20, 700 + caught * 20, .6, .14);
      tone(660 + caught * 30, .05, .2, .15);
      ['🍬','🍭','🍫','🎃','🍬','⭐'].forEach((c, k) => {
        const s = document.createElement('span'); s.className = 'candy'; s.textContent = c;
        s.style.left = (rect.left + 34) + 'px'; s.style.top = (rect.top + 30) + 'px';
        const ang = k / 6 * Math.PI * 2;
        s.style.setProperty('--dx', Math.cos(ang) * 110 + 'px'); s.style.setProperty('--dy', Math.sin(ang) * 110 + 'px');
        p.appendChild(s); setTimeout(() => s.remove(), 950);
      });
      if (caught >= TOTAL) {
        const m = document.createElement('div'); m.className = 'msg'; m.textContent = 'Happy Halloween!';
        p.appendChild(m); speak('Happy Halloween!'); [0, .12, .24, .36].forEach((t, k) => tone([523, 659, 784, 1046][k], t, .5));
      }
    });
  };
  const loop = () => { if (!alive || caught >= TOTAL) return; spawn(); setTimeout(loop, 900 + Math.random() * 600); };
  loop(); setTimeout(spawn, 300);
}

home();
</script>
